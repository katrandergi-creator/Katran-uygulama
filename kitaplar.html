<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kitaplar • Katran Dergi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
padding-bottom: 4rem;
}
.top-nav {
position: sticky;
top: 0;
background: rgba(10,8,8,0.9);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.06);
padding: 1rem 0;
z-index: 100;
}
.nav-inner {
max-width: 700px;
margin: 0 auto;
padding: 0 1rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
text-decoration: none;
color: #f4efe8;
}
.nav-logo .red { color: #e03131; }
.nav-btn {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
padding: 0.5rem 0.75rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
font-family: inherit;
}
.nav-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: #e03131; border-color: #e03131; }
.container { max-width: 700px; margin: 0 auto; padding: 1.5rem 1rem; }
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
margin-bottom: 0.5rem;
}
h1 .red { color: #e03131; }
.subtitle { color: #a89e94; font-size: 0.9rem; margin-bottom: 1.5rem; }
.search-box {
display: flex;
gap: 0.5rem;
margin-bottom: 1.5rem;
}
.search-input {
flex: 1;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 60px;
padding: 0.9rem 1.3rem;
color: #f4efe8;
font-family: inherit;
font-size: 0.95rem;
}
.search-input:focus { outline: none; border-color: #e03131; }
.search-btn {
background: #e03131;
color: #f4efe8;
border: none;
border-radius: 60px;
padding: 0 1.5rem;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
font-family: inherit;
display: flex;
align-items: center;
gap: 0.4rem;
}
.search-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.search-btn:disabled { opacity: 0.5; }
.book-card {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1rem;
margin-bottom: 0.8rem;
display: flex;
gap: 1rem;
transition: all 0.2s;
}
.book-card:hover { border-color: rgba(224,49,49,0.3); }
.book-cover {
width: 60px;
height: 90px;
border-radius: 6px;
background: rgba(255,255,255,0.05);
flex-shrink: 0;
object-fit: cover;
}
.book-cover-placeholder {
width: 60px;
height: 90px;
border-radius: 6px;
background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
flex-shrink: 0;
display: flex;
align-items: center;
justify-content: center;
color: #e03131;
}
.book-cover-placeholder svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.book-info { flex: 1; min-width: 0; }
.book-title {
font-weight: 700;
font-size: 0.95rem;
margin-bottom: 0.2rem;
line-height: 1.3;
}
.book-author { color: #a89e94; font-size: 0.85rem; margin-bottom: 0.4rem; }
.book-meta { color: #7a7068; font-size: 0.75rem; margin-bottom: 0.6rem; }
.book-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.book-action-btn {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
border-radius: 60px;
padding: 0.4rem 0.85rem;
font-size: 0.72rem;
cursor: pointer;
font-family: inherit;
font-weight: 600;
display: inline-flex;
align-items: center;
gap: 0.35rem;
transition: all 0.2s;
}
.book-action-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.book-action-btn:hover { color: #e03131; border-color: #e03131; }
.book-action-btn.active { background: rgba(224,49,49,0.15); color: #e03131; border-color: #e03131; }
.loading, .empty {
text-align: center;
padding: 3rem 1rem;
color: #a89e94;
}
.empty .flower { font-size: 2.5rem; color: #e03131; display: block; margin-bottom: 1rem; }
.request-box {
background: rgba(224,49,49,0.06);
border: 1px solid rgba(224,49,49,0.2);
border-radius: 16px;
padding: 1.5rem;
margin-top: 1.5rem;
text-align: center;
}
.request-box h3 { font-size: 1rem; margin-bottom: 0.5rem; }
.request-box p { color: #a89e94; font-size: 0.85rem; margin-bottom: 1rem; }
.request-btn {
background: #e03131;
color: #f4efe8;
border: none;
border-radius: 60px;
padding: 0.7rem 1.5rem;
font-weight: 700;
font-size: 0.85rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
}
.request-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.toast {
position: fixed;
bottom: 2rem;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: #e03131;
color: #f4efe8;
padding: 0.8rem 1.5rem;
border-radius: 60px;
font-weight: 600;
font-size: 0.9rem;
transition: transform 0.3s;
z-index: 9999;
max-width: 90%;
text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: #2e7d32; }
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="kitapligim.html" class="nav-btn" id="navLibrary">
<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
Kitaplığım
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Kitap</span> Ara</h1>
<p class="subtitle">Milyonlarca kitap arasından ara, rafına ekle.</p>

<div class="search-box">
<input type="text" class="search-input" id="searchInput" placeholder="Kitap adı veya yazar..." autofocus>
<button class="search-btn" id="searchBtn">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
Ara
</button>
</div>

<div id="resultsContainer">
<div class="empty"><span class="flower">❀</span>Aramak için yukarıya yaz.</div>
</div>

<div class="request-box" id="requestBox" style="display:none;">
<h3>Kitabı bulamadın mı?</h3>
<p>Aradığın kitap sistemde yoksa bize bildir, en kısa sürede ekleyelim.</p>
<button class="request-btn" id="openRequestBtn">
<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
Kitap Talep Et
</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var userBooks = {};

// ---------- İKONLAR ----------
var ICONS = {
bookOpen: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
bookmark: '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
checkCircle: '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
};

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, isSuccess) {
var t = document.getElementById('toast');
t.textContent = msg;
t.className = 'toast show' + (isSuccess ? ' success' : '');
setTimeout(function() { t.classList.remove('show'); }, 2500);
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (sessionRes.data.session) {
currentUser = sessionRes.data.session.user;
var ubRes = await supabaseClient.from('user_books').select('book_id, status').eq('user_id', currentUser.id);
(ubRes.data || []).forEach(function(ub) { userBooks[ub.book_id] = ub.status; });
}

document.getElementById('searchInput').addEventListener('keydown', function(e) {
if (e.key === 'Enter') doSearch();
});
document.getElementById('searchBtn').addEventListener('click', doSearch);
})();

async function doSearch() {
var query = document.getElementById('searchInput').value.trim();
if (!query) return;

var container = document.getElementById('resultsContainer');
var btn = document.getElementById('searchBtn');
container.innerHTML = '<div class="loading">Aranıyor...</div>';
btn.disabled = true;

try {
var res = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(query) + '&limit=20');
var data = await res.json();
var docs = data.docs || [];

if (!docs.length) {
container.innerHTML = '<div class="empty"><span class="flower">❀</span>Sonuç bulunamadı.</div>';
document.getElementById('requestBox').style.display = 'block';
return;
}

var booksToSave = [];
docs.forEach(function(doc) {
if (!doc.title) return;
var externalId = doc.key ? doc.key.replace('/works/', '') : null;
var coverId = doc.cover_i;
var coverUrl = coverId ? 'https://covers.openlibrary.org/b/id/' + coverId + '-M.jpg' : null;
booksToSave.push({
external_id: externalId,
source: 'openlibrary',
title: doc.title,
author: (doc.author_name && doc.author_name[0]) || null,
cover_url: coverUrl,
page_count: doc.number_of_pages_median || null,
published_year: doc.first_publish_year || null
});
});

var existingExternalIds = booksToSave.map(function(b) { return b.external_id; }).filter(Boolean);
var existingRes = await supabaseClient.from('books').select('id, external_id').in('external_id', existingExternalIds);

var existingMap = {};
(existingRes.data || []).forEach(function(b) { existingMap[b.external_id] = b.id; });

var newBooks = booksToSave.filter(function(b) { return b.external_id && !existingMap[b.external_id]; });
if (newBooks.length) {
var insertRes = await supabaseClient.from('books').insert(newBooks).select('id, external_id');
(insertRes.data || []).forEach(function(b) { existingMap[b.external_id] = b.id; });
}

var html = '';
booksToSave.forEach(function(b) {
var bookId = existingMap[b.external_id];
if (!bookId) return;

var status = userBooks[bookId] || null;
var coverHtml = b.cover_url
? '<img class="book-cover" src="' + b.cover_url + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-cover-placeholder&quot;>' + ICONS.bookOpen.replace(/"/g, '&quot;') + '</div>\'">'
: '<div class="book-cover-placeholder">' + ICONS.bookOpen + '</div>';

var metaParts = [];
if (b.author) metaParts.push(b.author);
if (b.published_year) metaParts.push(b.published_year);
if (b.page_count) metaParts.push(b.page_count + ' sayfa');

html += '<div class="book-card">';
html += coverHtml;
html += '<div class="book-info">';
html += '<div class="book-title">' + escapeHtml(b.title) + '</div>';
if (metaParts.length) html += '<div class="book-meta">' + escapeHtml(metaParts.join(' · ')) + '</div>';
html += '<div class="book-actions">';
html += '<button class="book-action-btn ' + (status === 'want' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'want\', this)">' + ICONS.bookmark + ' Okuyacağım</button>';
html += '<button class="book-action-btn ' + (status === 'reading' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'reading\', this)">' + ICONS.bookOpen + ' Okuyorum</button>';
html += '<button class="book-action-btn ' + (status === 'read' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'read\', this)">' + ICONS.checkCircle + ' Okudum</button>';
html += '</div>';
html += '</div>';
html += '</div>';
});

container.innerHTML = html || '<div class="empty">Sonuç bulunamadı.</div>';
document.getElementById('requestBox').style.display = 'block';

} catch (err) {
console.error(err);
container.innerHTML = '<div class="empty">Arama hatası: ' + escapeHtml(err.message) + '</div>';
} finally {
btn.disabled = false;
}
}

window.setBookStatus = async function(bookId, status, btn) {
if (!currentUser) { toast('Giriş yapmalısın'); return; }

var container = btn.parentElement;
var buttons = container.querySelectorAll('.book-action-btn');
buttons.forEach(function(b) { b.classList.remove('active'); });

var existing = userBooks[bookId];

if (existing === status) {
await supabaseClient.from('user_books').delete().eq('user_id', currentUser.id).eq('book_id', bookId);
delete userBooks[bookId];
toast('Rafından kaldırıldı');
} else if (existing) {
await supabaseClient.from('user_books').update({ status: status, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id).eq('book_id', bookId);
userBooks[bookId] = status;
btn.classList.add('active');
toast(status === 'read' ? 'Okundu olarak işaretlendi' : status === 'reading' ? 'Okunuyor' : 'Okunacaklara eklendi', true);
} else {
await supabaseClient.from('user_books').insert([{ user_id: currentUser.id, book_id: bookId, status: status }]);
userBooks[bookId] = status;
btn.classList.add('active');
toast(status === 'read' ? 'Okundu olarak işaretlendi' : status === 'reading' ? 'Okunuyor' : 'Okunacaklara eklendi', true);
}
};

document.getElementById('openRequestBtn').addEventListener('click', async function() {
if (!currentUser) { toast('Talep için giriş yapmalısın'); return; }

var title = prompt('Kitabın adı:');
if (!title) return;
var author = prompt('Yazar (opsiyonel):') || '';
var note = prompt('Eklemek istediğin not (opsiyonel):') || '';

var res = await supabaseClient.from('book_requests').insert([{
user_id: currentUser.id,
title: title,
author: author,
note: note
}]);

if (res.error) { toast('Hata: ' + res.error.message); return; }
toast('Talebin alındı! En kısa sürede ekleyeceğiz.', true);
});
})();
</script>
</body>
</html>
