// ============================================================
// GOOGLE BOOKS API KONTROL
// ============================================================
function isGoogleBooksAvailable() {
  var blockUntil = localStorage.getItem('gb_blocked_until');
  if (!blockUntil) return true;
  if (Date.now() > parseInt(blockUntil)) {
    localStorage.removeItem('gb_blocked_until');
    return true;
  }
  return false;
}

function blockGoogleBooks() {
  // Bugünün sonuna kadar (24 saat) blokla
  var tomorrow = new Date();
  tomorrow.setHours(24, 0, 0, 0);
  localStorage.setItem('gb_blocked_until', tomorrow.getTime().toString());
}

// ============================================================
// GOOGLE BOOKS ARAMA
// ============================================================
async function searchGoogleBooks(query) {
  if (!isGoogleBooksAvailable()) return { source: 'google', blocked: true, books: [] };
  
  try {
    var url = 'https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + '&maxResults=20&key=' + GOOGLE_BOOKS_KEY;
    var res = await fetch(url);
    
    if (res.status === 429 || res.status === 403) {
      // Kota doldu
      blockGoogleBooks();
      return { source: 'google', blocked: true, books: [] };
    }
    if (!res.ok) throw new Error('Google Books hata: ' + res.status);
    
    var data = await res.json();
    var items = data.items || [];
    if (!items.length) return { source: 'google', blocked: false, books: [] };
    
    var books = items.map(function(item) {
      var info = item.volumeInfo || {};
      var cover = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail) : null;
      if (cover) cover = cover.replace('http://', 'https://');
      
      return {
        external_id: item.id,
        source: 'google',
        title: info.title || 'İsimsiz',
        author: info.authors ? info.authors[0] : null,
        cover_url: cover,
        page_count: info.pageCount || null,
        published_year: info.publishedDate ? parseInt(info.publishedDate.substring(0, 4)) : null,
        description: info.description || null,
        subjects: info.categories ? info.categories.join(', ') : null
      };
    });
    
    return { source: 'google', blocked: false, books: books };
  } catch (e) {
    console.warn('Google Books hatası:', e);
    return { source: 'google', blocked: false, books: [] };
  }
}

// ============================================================
// OPEN LIBRARY ARAMA
// ============================================================
async function searchOpenLibrary(query) {
  try {
    var url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(query) + '&limit=20';
    var res = await fetch(url);
    if (!res.ok) throw new Error('Open Library hata');
    
    var data = await res.json();
    var docs = data.docs || [];
    if (!docs.length) return [];
    
    var books = docs.filter(function(d) { return d.title; }).map(function(doc) {
      var externalId = doc.key ? doc.key.replace('/works/', '') : null;
      var coverId = doc.cover_i;
      var coverUrl = coverId ? 'https://covers.openlibrary.org/b/id/' + coverId + '-M.jpg' : null;
      
      return {
        external_id: externalId,
        source: 'openlibrary',
        title: doc.title,
        author: (doc.author_name && doc.author_name[0]) || null,
        cover_url: coverUrl,
        page_count: doc.number_of_pages_median || null,
        published_year: doc.first_publish_year || null,
        description: null,
        subjects: doc.subject ? doc.subject.slice(0, 5).join(', ') : null
      };
    });
    
    return books;
  } catch (e) {
    console.warn('Open Library hatası:', e);
    return [];
  }
}

// ============================================================
// HİBRİT ARAMA — ÖNCE GOOGLE, SONRA OPEN LIBRARY
// ============================================================
async function hybridSearch(query) {
  var books = [];
  var source = 'google';
  
  // 1. GOOGLE BOOKS
  if (isGoogleBooksAvailable()) {
    var gbResult = await searchGoogleBooks(query);
    if (gbResult.books.length > 0) {
      return { books: gbResult.books, source: 'google' };
    }
    // Google'da sonuç yok, Open Library'ye düş
  }
  
  // 2. OPEN LIBRARY
  source = 'openlibrary';
  books = await searchOpenLibrary(query);
  
  return { books: books, source: source };
}

    await loadUserBooks();
  }
  
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  
  document.getElementById('modalClose').addEventListener('click', closeQuoteModal);
  document.getElementById('cancelBtn').addEventListener('click', closeQuoteModal);
  document.getElementById('quoteModal').addEventListener('click', function(e) {
    if (e.target === this) closeQuoteModal();
  });
  document.getElementById('quoteText').addEventListener('input', function() {
    document.getElementById('quoteCharCount').textContent = this.value.length + ' / 500';
  });
  document.getElementById('saveQuoteBtn').addEventListener('click', saveQuote);
})();

async function loadUserBooks() {
  var res = await supabaseClient
    .from('user_books')
    .select('id, book_id, status')
    .eq('user_id', currentUser.id);
  
  userBooks = {};
  userBookIds = {};
  userReadCount = 0;
  (res.data || []).forEach(function(ub) {
    userBooks[ub.book_id] = ub.status;
    userBookIds[ub.book_id] = ub.id;
    if (ub.status === 'read') userReadCount++;
  });
}

// ARAMA
async function doSearch() {
  var query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  
  var container = document.getElementById('resultsContainer');
  var btn = document.getElementById('searchBtn');
  container.innerHTML = '<div class="loading"><div class="spinner"></div>Aranıyor...</div>';
  btn.disabled = true;
  
  try {
    var result = await hybridSearch(query);
    var booksToSave = result.books;
    var sourceUsed = result.source;
    
    if (!booksToSave.length) {
      container.innerHTML = '<div class="empty">Sonuç bulunamadı.</div>';
      document.getElementById('requestBox').style.display = 'block';
      btn.disabled = false;
      return;
    }
    
    // DB'ye kaydet (external_id + source ile)
    var existingExternalIds = booksToSave.map(function(b) { return b.external_id; }).filter(Boolean);
    var existingRes = await supabaseClient
      .from('books')
      .select('id, external_id, source')
      .in('external_id', existingExternalIds);
    
    var existingMap = {};
    (existingRes.data || []).forEach(function(b) {
      existingMap[b.external_id + '_' + b.source] = b.id;
    });
    
    // Eski kayıtları da kontrol et (source olmadan)
    var oldExistingRes = await supabaseClient
      .from('books')
      .select('id, external_id')
      .in('external_id', existingExternalIds);
    (oldExistingRes.data || []).forEach(function(b) {
      if (!existingMap[b.external_id + '_' + sourceUsed]) {
        existingMap[b.external_id + '_' + sourceUsed] = b.id;
      }
    });
    
    var newBooks = booksToSave.filter(function(b) {
      return b.external_id && !existingMap[b.external_id + '_' + b.source];
    });
    
    if (newBooks.length) {
      var insertRes = await supabaseClient.from('books').insert(newBooks).select('id, external_id, source');
      (insertRes.data || []).forEach(function(b) {
        existingMap[b.external_id + '_' + b.source] = b.id;
      });
    }
    
    // Render
    var html = '';
    html += '<div style="text-align:right;font-size:0.7rem;color:var(--text-dim);margin-bottom:0.5rem;">';
    if (sourceUsed === 'google') {
      html += '<span class="source-badge google">Google Books</span>';
    } else {
      html += '<span class="source-badge openlibrary">Open Library</span>';
    }
    html += '</div>';
    
    booksToSave.forEach(function(b) {
      var bookId = existingMap[b.external_id + '_' + b.source];
      if (!bookId) return;
      
      var status = userBooks[bookId] || null;
      var coverHtml = b.cover_url
        ? '<img class="book-cover" src="' + b.cover_url + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-cover-placeholder&quot;>' + escapeHtml((b.title || '?').charAt(0).toUpperCase()) + '</div>\'">'
        : '<div class="book-cover-placeholder">' + escapeHtml((b.title || '?').charAt(0).toUpperCase()) + '</div>';
      
      var metaParts = [];
      if (b.author) metaParts.push(b.author);
      if (b.published_year) metaParts.push(b.published_year);
      if (b.page_count) metaParts.push(b.page_count + ' sayfa');
      
      html += '<div class="book-card" style="cursor:pointer;" data-book-id="' + bookId + '" data-title="' + escapeHtml(b.title) + '" data-author="' + escapeHtml(b.author || '') + '" data-cover="' + escapeHtml(b.cover_url || '') + '" onclick="if(!event.target.closest(\'.book-action-btn\')) window.location.href=\'kitap.html?id=' + bookId + '\'">';
      html += coverHtml;
      html += '<div class="book-info">';
      html += '<div class="book-title">' + escapeHtml(b.title) + '</div>';
      if (metaParts.length) html += '<div class="book-meta">' + escapeHtml(metaParts.join(' · ')) + '</div>';
      html += '<div class="book-actions">';
      html += '<button class="book-action-btn ' + (status === 'want' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'want\', this)">' + ICONS.bookmark + ' Okuyacağım</button>';
      html += '<button class="book-action-btn ' + (status === 'reading' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'reading\', this)">' + ICONS.bookOpen + ' Okuyorum</button>';
      html += '<button class="book-action-btn ' + (status === 'read' ? 'active' : '') + '" onclick="setBookStatus(\'' + bookId + '\', \'read\', this)">' + ICONS.checkCircle + ' Okudum</button>';
      html += '</div></div></div>';
    });
    
    container.innerHTML = html || '<div class="empty">Sonuç bulunamadı.</div>';
    document.getElementById('requestBox').style.display = 'block';
    
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div class="empty">Arama hatası: ' + escapeHtml(err.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

// DURUM AYARLA
window.setBookStatus = async function(bookId, status, btn) {
  if (!currentUser) { toast('Giriş yapmalısın', true); return; }
  var existing = userBooks[bookId];
  
  if (existing === status) {
    await supabaseClient.from('user_books').delete().eq('user_id', currentUser.id).eq('book_id', bookId);
    delete userBooks[bookId];
    delete userBookIds[bookId];
    if (status === 'read') userReadCount--;
    toast('Rafından kaldırıldı');
    location.reload();
    return;
  }
  
  if (status === 'read') {
    openQuoteModal(bookId, btn);
    return;
  }
  
  if (existing) {
    await supabaseClient.from('user_books').update({ status: status, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id).eq('book_id', bookId);
  } else {
    await supabaseClient.from('user_books').insert([{ user_id: currentUser.id, book_id: bookId, status: status }]);
  }
  userBooks[bookId] = status;
  toast(status === 'reading' ? '📖 Okunuyor' : '🔖 Okunacaklara eklendi');
  location.reload();
};

// ALINTI MODAL
function openQuoteModal(bookId, btn) {
  var card = btn.closest('.book-card');
  pendingBook = {
    bookId: bookId,
    title: card.getAttribute('data-title'),
    author: card.getAttribute('data-author'),
    cover: card.getAttribute('data-cover')
  };
  
  document.getElementById('modalBookInfo').innerHTML =
    '<div class="modal-book-title">' + escapeHtml(pendingBook.title) + '</div>' +
    '<div class="modal-book-author">' + escapeHtml(pendingBook.author || 'Bilinmeyen') + '</div>';
  
  var isFree = userReadCount < 2;
  if (isFree) {
    document.getElementById('modalInfo').innerHTML =
      '💡 Bu <strong>' + (userReadCount + 1) + '. kitap</strong>. İlk 2 kitap için <strong>alıntı zorunlu değil</strong>.';
    document.getElementById('quoteRequired').style.display = 'none';
    document.getElementById('saveQuoteBtn').textContent = 'Okudum Olarak Kaydet';
  } else {
    document.getElementById('modalInfo').innerHTML =
      '📝 Artık <strong>alıntı zorunlu</strong>. Bu kitaptan bir bölüm paylaşmadan "Okudum" olarak kaydedemezsin.';
    document.getElementById('quoteRequired').style.display = 'inline';
    document.getElementById('saveQuoteBtn').textContent = 'Alıntıyla Kaydet';
  }
  
  document.getElementById('quoteText').value = '';
  document.getElementById('quotePage').value = '';
  document.getElementById('shareToFeed').checked = true;
  document.getElementById('quoteCharCount').textContent = '0 / 500';
  document.getElementById('quoteModal').classList.add('open');
  setTimeout(function() { document.getElementById('quoteText').focus(); }, 100);
}

function closeQuoteModal() {
  document.getElementById('quoteModal').classList.remove('open');
  pendingBook = null;
}

async function saveQuote() {
  if (!pendingBook) return;
  var quoteText = document.getElementById('quoteText').value.trim();
  var page = document.getElementById('quotePage').value.trim();
  var shareToFeed = document.getElementById('shareToFeed').checked;
  var isFree = userReadCount < 2;
  
  if (!isFree && !quoteText) { toast('❌ Alıntı zorunlu!', true); return; }
  if (quoteText && quoteText.length < 10) { toast('❌ Alıntı en az 10 karakter olmalı', true); return; }
  
  var btn = document.getElementById('saveQuoteBtn');
  btn.disabled = true;
  btn.textContent = 'Kaydediliyor...';
  
  var bookId = pendingBook.bookId;
  
  try {
    var existing = userBooks[bookId];
    var updates = {
      status: 'read',
      quote: quoteText || null,
      quote_page: page ? parseInt(page) : null,
      finished_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    
    if (existing && userBookIds[bookId]) {
      await supabaseClient.from('user_books').update(updates).eq('id', userBookIds[bookId]);
    } else {
      updates.user_id = currentUser.id;
      updates.book_id = bookId;
      var insertRes = await supabaseClient.from('user_books').insert([updates]).select('id').single();
      if (insertRes.data) userBookIds[bookId] = insertRes.data.id;
    }
    userBooks[bookId] = 'read';
    if (!existing || existing !== 'read') userReadCount++;
    
    if (shareToFeed) {
      await supabaseClient.from('posts').insert([{
        user_id: currentUser.id,
        type: 'read',
        content: quoteText || null,
        quote_author: pendingBook.author || 'Bilinmeyen',
        quote_book: pendingBook.title || '',
        quote_page: page ? parseInt(page) : null,
        book_id: bookId,
        finished_at: new Date().toISOString()
      }]);
    }
    
    closeQuoteModal();
    toast('✅ Kaydedildi!' + (shareToFeed ? ' Akışta paylaşıldı.' : ''));
    setTimeout(function() { location.reload(); }, 800);
  } catch (err) {
    console.error(err);
    toast('Hata: ' + err.message, true);
    btn.disabled = false;
    btn.textContent = 'Kaydet';
  }
}

// TALEP
document.getElementById('openRequestBtn').addEventListener('click', async function() {
  if (!currentUser) { toast('Talep için giriş yapmalısın', true); return; }
  var title = prompt('Kitabın adı:');
  if (!title) return;
  var author = prompt('Yazar (opsiyonel):') || '';
  var note = prompt('Eklemek istediğin not (opsiyonel):') || '';
  var res = await supabaseClient.from('book_requests').insert([{
    user_id: currentUser.id, title: title, author: author, note: note
  }]);
  if (res.error) { toast('Hata: ' + res.error.message, true); return; }
  toast('✅ Talebin alındı!');
});
})();
</script>
