<!DOCTYPE html>
<html lang="tr">
<head>

<script>

    document.documentElement.setAttribute('data-theme', t);

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gruplar • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.top-nav { position: sticky; top: 0; background: var(--nav-bg); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); z-index: 100; padding: 0.85rem 0; }
.nav-inner { max-width: 600px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; text-decoration: none; color: var(--text); }
.nav-logo .red { color: var(--bordo); }
.nav-btn {
background: transparent;
color: var(--text-muted);
border: 1px solid var(--border);
padding: 0.5rem 0.9rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
font-family: inherit;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }
.container { max-width: 600px; margin: 0 auto; padding: 1.2rem 1rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 1.2rem; color: var(--text); }
h1 .red { color: var(--bordo); }
.new-group-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
width: 100%;
background: var(--bordo);
color: #fff;
border: none;
border-radius: 16px;
padding: 0.9rem;
font-family: inherit;
font-weight: 700;
font-size: 0.95rem;
cursor: pointer;
margin-bottom: 1.5rem;
transition: all 0.2s;
text-decoration: none;
}
.new-group-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.new-group-btn:hover { background: var(--bordo-dark); transform: translateY(-2px); }
.section-title {
font-family: 'Playfair Display', serif;
font-size: 1.15rem;
font-weight: 700;
color: var(--text);
margin-bottom: 0.8rem;
margin-top: 1.8rem;
display: flex;
align-items: center;
gap: 0.5rem;
}
.section-title:first-of-type { margin-top: 0; }
.section-title svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.section-sub { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-bottom: 1rem; margin-top: -0.5rem; }
.group-card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 16px;
padding: 1rem 1.1rem;
margin-bottom: 0.6rem;
display: flex;
align-items: center;
gap: 0.9rem;
text-decoration: none;
color: inherit;
transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
position: relative;
overflow: hidden;
}
.group-card:hover { border-color: var(--bordo); background: var(--bordo-glow); transform: translateX(4px); }
.group-card.rank-green::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #10b981; }
.group-card.rank-blue::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #3b82f6; }
.group-card.rank-red::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #e03131; }
.group-card.rank-gold::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #d4a843; }
.group-avatar {
width: 46px;
height: 46px;
border-radius: 14px;
background: var(--bordo);
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
color: #fff;
flex-shrink: 0;
font-size: 1.15rem;
font-family: 'Playfair Display', serif;
}
.group-card.rank-green .group-avatar { background: #10b981; }
.group-card.rank-blue .group-avatar { background: #3b82f6; }
.group-card.rank-red .group-avatar { background: #e03131; }
.group-card.rank-gold .group-avatar { background: #d4a843; }
.group-info { flex: 1; min-width: 0; }
.group-name { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 0.15rem; }
.group-desc { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-meta { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.2rem; }
.group-action { color: var(--bordo); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
.group-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.group-action.locked { color: var(--text-dim); }
.loading, .empty { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.3rem; }
.group-avatar { width: 42px; height: 42px; font-size: 1rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="mesajlar.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Mesajlar
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Gruplar</span></h1>

<a href="grup-olustur.html" class="new-group-btn">
<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
Yeni Grup Oluştur
</a>

<div id="rankGroupsSection" style="display:none;">
<div class="section-title">
<svg viewBox="0 0 24 24"><path d="M12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
Rütbe Odaları
</div>
<div class="section-sub">Rütben yükseldikçe yeni odalar açılır</div>
<div id="rankGroupsList"></div>
</div>

<div id="myGroupsSection" style="display:none;">
<div class="section-title">
<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
Gruplarım
</div>
<div id="myGroupsList"></div>
</div>

<div id="discoverSection" style="display:none;">
<div class="section-title">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
Keşfet
</div>
<div class="section-sub">Katılabileceğin gruplar</div>
<div id="discoverList"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>
<script src="avatares.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var currentProfile = null;
var myGroupIds = [];
var allGroups = [];
var groupMemberCounts = {};

var RANK_ORDER = ['filiz', 'karanfil', 'gergedan', 'katran'];
var RANK_COLORS = { filiz: 'green', karanfil: 'blue', gergedan: 'red', katran: 'gold' };
var RANK_LABELS = { filiz: 'Filiz', karanfil: 'Karanfil', gergedan: 'Gergedan Böceği', katran: 'Katran Kurucusu' };

var ICON_ARROW = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
var ICON_LOCK = '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function canAccessRank(minRank) {
if (!currentProfile) return false;
var myRank = currentProfile.rank || 'filiz';
return RANK_ORDER.indexOf(myRank) >= RANK_ORDER.indexOf(minRank);
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

var profRes = await supabaseClient.from('profiles').select('id, full_name, username, rank, status').eq('id', currentUser.id).single();
if (!profRes.data || profRes.data.status !== 'approved') { window.location.href = 'giris.html'; return; }
currentProfile = profRes.data;

var groupsRes = await supabaseClient.from('groups').select('*').order('created_at', { ascending: false });
allGroups = groupsRes.data || [];

var memRes = await supabaseClient.from('group_members').select('group_id').eq('user_id', currentUser.id);
myGroupIds = (memRes.data || []).map(function(m) { return m.group_id; });

for (var i = 0; i < allGroups.length; i++) {
var gid = allGroups[i].id;
var countRes = await supabaseClient.from('group_members').select('id', { count: 'exact', head: true }).eq('group_id', gid);
groupMemberCounts[gid] = countRes.count || 0;
}

renderAll();
})();

function renderAll() {
var rankGroups = allGroups.filter(function(g) { return g.type === 'rank'; });
var userGroups = allGroups.filter(function(g) { return g.type !== 'rank'; });

var rankList = document.getElementById('rankGroupsList');
if (rankGroups.length) {
document.getElementById('rankGroupsSection').style.display = 'block';
var html = '';
rankGroups.sort(function(a, b) { return RANK_ORDER.indexOf(a.min_rank) - RANK_ORDER.indexOf(b.min_rank); });
rankGroups.forEach(function(g) { html += renderGroupCard(g, true); });
rankList.innerHTML = html;
}

var myUserGroups = userGroups.filter(function(g) { return myGroupIds.indexOf(g.id) !== -1; });
var myList = document.getElementById('myGroupsList');
if (myUserGroups.length) {
document.getElementById('myGroupsSection').style.display = 'block';
var html = '';
myUserGroups.forEach(function(g) { html += renderGroupCard(g, false); });
myList.innerHTML = html;
}

var discoverGroups = userGroups.filter(function(g) { return myGroupIds.indexOf(g.id) === -1; });
var discList = document.getElementById('discoverList');
if (discoverGroups.length) {
document.getElementById('discoverSection').style.display = 'block';
var html = '';
discoverGroups.forEach(function(g) { html += renderGroupCard(g, false); });
discList.innerHTML = html;
}

if (!rankGroups.length && !userGroups.length) {
document.querySelector('.container').innerHTML += '<div class="empty">Henüz hiç grup yok. İlk grubu sen oluştur!</div>';
}
}

function renderGroupCard(g, isRank) {
var colorClass = '';
var rankBadge = '';
if (isRank) {
colorClass = ' rank-' + (RANK_COLORS[g.min_rank] || 'green');
rankBadge = RANK_LABELS[g.min_rank] || '';
}

var canAccess = !isRank || canAccessRank(g.min_rank);
var isMember = myGroupIds.indexOf(g.id) !== -1;
var initial = (g.name || '?').charAt(0).toUpperCase();
var memberCount = groupMemberCounts[g.id] || 0;

var actionHtml = '';
if (isRank && !canAccess) {
actionHtml = '<span class="group-action locked">' + ICON_LOCK + ' ' + rankBadge + '</span>';
} else if (isMember) {
actionHtml = '<span class="group-action">' + ICON_ARROW + '</span>';
} else {
actionHtml = '<span class="group-action">Katıl ' + ICON_ARROW + '</span>';
}

var clickable = isRank ? canAccess : true;
var tag = clickable ? 'a' : 'div';
var hrefAttr = clickable ? ' href="grup.html?id=' + g.id + '"' : '';

var html = '<' + tag + hrefAttr + ' class="group-card' + colorClass + '">';
html += '<div class="group-avatar">' + initial + '</div>';
html += '<div class="group-info">';
html += '<div class="group-name">' + escapeHtml(g.name) + '</div>';
if (g.description) html += '<div class="group-desc">' + escapeHtml(g.description) + '</div>';
html += '<div class="group-meta">' + memberCount + ' üye</div>';
html += '</div>';
html += actionHtml;
html += '</' + tag + '>';
return html;
}
})();
</script>
</body>
</html>
