<title>Mesajlar • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.top-nav {
position: sticky;
top: 0;
background: var(--nav-bg);
backdrop-filter: blur(24px);
border-bottom: 1px solid var(--border);
z-index: 100;
padding: 0.85rem 0;
}
.nav-inner { max-width: 600px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; text-decoration: none; color: var(--text); }
.nav-logo .red { color: var(--bordo); }
.nav-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 0.5rem 0.9rem; border-radius: 60px; text-decoration: none; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; font-family: inherit; }
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }
.container { max-width: 600px; margin: 0 auto; padding: 1.2rem 1rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem; color: var(--text); }
h1 .red { color: var(--bordo); }
.search-input-wrap { position: relative; display: flex; align-items: center; margin-bottom: 1rem; }
.search-input-wrap svg { position: absolute; left: 1rem; width: 16px; height: 16px; stroke: var(--text-dim); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.search-input {
width: 100%;
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 60px;
padding: 0.75rem 1.2rem 0.75rem 2.5rem;
color: var(--text);
font-family: inherit;
font-size: 0.9rem;
transition: all 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { outline: none; border-color: var(--bordo); background: var(--bordo-glow); }
.view-tabs { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; overflow-x: auto; scrollbar-width: none; }
.view-tabs::-webkit-scrollbar { display: none; }
.view-tab {
background: transparent;
color: var(--text-muted);
border: none;
padding: 0.55rem 1rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
white-space: nowrap;
}
.view-tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.view-tab.active { background: var(--bordo-glow); color: var(--bordo); }
.view-tab:hover:not(.active) { color: var(--text); background: var(--bg-elev); }
.view-tab .tab-badge { background: var(--accent); color: #fff; font-size: 0.62rem; padding: 1px 5px; border-radius: 20px; font-weight: 700; min-width: 16px; text-align: center; margin-left: 0.2rem; }
.card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 16px;
padding: 0.9rem 1.1rem;
margin-bottom: 0.5rem;
display: flex;
align-items: center;
gap: 0.9rem;
text-decoration: none;
color: inherit;
transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.card:hover { border-color: var(--bordo); background: var(--bordo-glow); transform: translateX(4px); }
.card-body { flex: 1; min-width: 0; }
.card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.15rem; gap: 0.5rem; }
.card-name { font-weight: 700; font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-time { color: var(--text-dim); font-size: 0.72rem; white-space: nowrap; flex-shrink: 0; }
.card-preview { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-preview.unread { color: var(--text); font-weight: 600; }
.card-badge { background: var(--accent); color: #fff; font-size: 0.68rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-action { color: var(--bordo); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
.card-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* GRUP KARTI */
.group-card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 16px;
padding: 1rem 1.1rem;
margin-bottom: 0.6rem;
display: flex;
align-items: center;
gap: 0.9rem;
text-decoration: none;
color: inherit;
transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
position: relative;
overflow: hidden;
}
.group-card:hover { border-color: var(--bordo); background: var(--bordo-glow); transform: translateX(4px); }
.group-card.rank-green::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #10b981; }
.group-card.rank-blue::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #3b82f6; }
.group-card.rank-red::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #e03131; }
.group-card.rank-gold::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #d4a843; }
.group-avatar {
width: 46px;
height: 46px;
border-radius: 14px;
background: var(--bordo);
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
color: #fff;
flex-shrink: 0;
font-size: 1.15rem;
font-family: 'Playfair Display', serif;
}
.group-card.rank-green .group-avatar { background: #10b981; }
.group-card.rank-blue .group-avatar { background: #3b82f6; }
.group-card.rank-red .group-avatar { background: #e03131; }
.group-card.rank-gold .group-avatar { background: #d4a843; }
.group-info { flex: 1; min-width: 0; }
.group-name { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 0.15rem; }
.group-desc { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-meta { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.2rem; }
.group-action { color: var(--bordo); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
.group-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.group-action.locked { color: var(--text-dim); }

.section-title {
font-family: 'Playfair Display', serif;
font-size: 1.1rem;
font-weight: 700;
color: var(--text);
margin-bottom: 0.8rem;
margin-top: 1.5rem;
display: flex;
align-items: center;
gap: 0.5rem;
}
.section-title:first-of-type { margin-top: 0; }
.section-title svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.section-sub { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-bottom: 1rem; margin-top: -0.5rem; }

.new-group-btn {
display: flex;
align-items: center;
justify-content: center;
gap: 0.5rem;
width: 100%;
background: var(--bordo);
color: #fff;
border: none;
border-radius: 16px;
padding: 0.9rem;
font-family: inherit;
font-weight: 700;
font-size: 0.95rem;
cursor: pointer;
margin-bottom: 1.5rem;
transition: all 0.2s;
text-decoration: none;
}
.new-group-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.new-group-btn:hover { background: var(--bordo-dark); transform: translateY(-2px); }

/* RÜTBE İLERLEME */
.rank-progress-box {
background: var(--bordo-glow);
border: 1px solid var(--bordo);
border-radius: 14px;
padding: 1rem 1.1rem;
margin-bottom: 1.2rem;
}
.rank-progress-top {
display: flex;
align-items: center;
gap: 0.8rem;
margin-bottom: 0.6rem;
}
.rank-progress-icon { font-size: 1.5rem; }
.rank-progress-label {
font-size: 0.7rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.08em;
font-weight: 600;
}
.rank-progress-name {
font-family: 'Playfair Display', serif;
font-size: 1.1rem;
font-weight: 900;
color: var(--bordo);
}
.rank-progress-count {
margin-left: auto;
text-align: right;
}
.rank-progress-count-label {
font-size: 0.7rem;
color: var(--text-muted);
}
.rank-progress-count-num {
font-family: 'Playfair Display', serif;
font-size: 1.1rem;
font-weight: 900;
color: var(--text);
}
.rank-progress-bar {
width: 100%;
height: 6px;
background: var(--bg-elev-2);
border-radius: 10px;
overflow: hidden;
margin-top: 0.6rem;
}
.rank-progress-fill {
height: 100%;
background: linear-gradient(90deg, var(--bordo), var(--bordo-light));
border-radius: 10px;
transition: width 0.5s ease;
}
.rank-progress-hint {
font-size: 0.78rem;
color: var(--text-muted);
margin-top: 0.5rem;
}
.rank-progress-hint strong { color: var(--bordo); }

@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.3rem; }
.card { padding: 0.8rem 1rem; }
.group-avatar { width: 42px; height: 42px; font-size: 1rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="akis.html" class="nav-btn">

<div class="container">
<h1><span class="red">Mesajlar</span></h1>

<div class="search-input-wrap">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input type="text" class="search-input" id="searchInput" placeholder="Sohbetlerde ara..." autocomplete="off">
</div>

<div class="view-tabs">
<button class="view-tab active" data-view="convos" id="tabConvos">
<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
Sohbetler

<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>

</button>
<button class="view-tab" data-view="groups" id="tabGroups">
<svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

<svg viewBox="0 0 24 24"><path d="M12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
Rütbe Odaları
</button>
</div>

<div id="contentContainer">
<div class="loading"><div class="spinner"></div>Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>
<script src="avatares.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var currentProfile = null;
var currentView = 'convos';
var searchQuery = '';
var allConvos = [];
var allUsers = [];
var allGroups = [];
var myGroupIds = [];
var groupMemberCounts = {};
var readCount = 0;
var dataLoaded = false;

var RANK_ORDER = ['filiz', 'karanfil', 'gergedan', 'katran'];
var RANK_COLORS = { filiz: 'green', karanfil: 'blue', gergedan: 'red', katran: 'gold' };
var RANK_LABELS = { filiz: 'Filiz', karanfil: 'Karanfil', gergedan: 'Gergedan Böceği', katran: 'Katran Konseyi' };
var RANK_TARGETS = { filiz: 3, karanfil: 10, gergedan: 25, katran: 999 };
var RANK_ICONS_EMOJI = { filiz: '🌱', karanfil: '🌸', gergedan: '🪲', katran: '👑' };

var ICON_ARROW = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
var ICON_LOCK = '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
var ICON_PLUS = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk';
if (s < 86400) return Math.floor(s/3600) + ' sa';
if (s < 604800) return Math.floor(s/86400) + ' gün';
return d.toLocaleDateString('tr-TR');
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 46);
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 46) + 'px;height:' + (size || 46) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo), var(--bordo-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:' + Math.round((size || 46) * 0.42) + 'px;">' + initial + '</div>';
}

function canAccessRank(minRank) {
if (!currentProfile) return false;
var myRank = currentProfile.rank || 'filiz';
return RANK_ORDER.indexOf(myRank) >= RANK_ORDER.indexOf(minRank);
}

async function loadReadCount() {
var res = await supabaseClient.from('user_books').select('id', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('status', 'read');
readCount = res.count || 0;
}

async function loadConversations() {
var res = await supabaseClient
.from('messages')
.select('*')
.or('sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentUser.id)
.order('created_at', { ascending: false })
.limit(500);

if (res.error) { allConvos = []; return; }
var msgs = res.data || [];
var convos = {};
var unreadCounts = {};

msgs.forEach(function(m) {
var other = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
if (!convos[other]) convos[other] = m;
if (m.sender_id !== currentUser.id && m.receiver_id === currentUser.id && !m.is_read) {
unreadCounts[other] = (unreadCounts[other] || 0) + 1;
}
});

var otherIds = Object.keys(convos);
if (!otherIds.length) { allConvos = []; return; }

var profRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', otherIds);
var profileMap = {};
(profRes.data || []).forEach(function(p) { profileMap[p.id] = p; });

allConvos = otherIds.sort(function(a, b) {
return new Date(convos[b].created_at) - new Date(convos[a].created_at);
}).map(function(oid) {
return {
user: profileMap[oid] || { full_name: 'İsimsiz', username: 'kullanici', avatar: 'harf' },
lastMsg: convos[oid],
unread: unreadCounts[oid] || 0
};
});

var totalUnread = allConvos.reduce(function(sum, c) { return sum + c.unread; }, 0);
if (totalUnread > 0) {
var b = document.getElementById('convosBadge');
b.textContent = totalUnread > 9 ? '9+' : totalUnread;
b.style.display = 'inline-block';
}
}

async function loadAllUsers() {
var res = await supabaseClient
.from('profiles')
.select('id, full_name, username, avatar, status')
.eq('status', 'approved')
.neq('id', currentUser.id)
.order('full_name', { ascending: true })
.limit(200);
allUsers = res.data || [];
}

async function loadGroups() {
var groupsRes = await supabaseClient.from('groups').select('*').order('created_at', { ascending: false });
allGroups = groupsRes.data || [];

var memRes = await supabaseClient.from('group_members').select('group_id').eq('user_id', currentUser.id);
myGroupIds = (memRes.data || []).map(function(m) { return m.group_id; });

for (var i = 0; i < allGroups.length; i++) {
  var gid = allGroups[i].id;
  var countRes = await supabaseClient.from('group_members').select('id', { count: 'exact', head: true }).eq('group_id', gid);
  groupMemberCounts[gid] = countRes.count || 0;
}
}

function render() {
var container = document.getElementById('contentContainer');

if (!dataLoaded) {
container.innerHTML = '<div class="loading"><div class="spinner"></div>Yükleniyor...</div>';
return;
}

if (currentView === 'convos') { renderConvos(container); return; }
if (currentView === 'users') { renderUsers(container); return; }
if (currentView === 'groups') { renderGroups(container); return; }
if (currentView === 'rankRooms') { renderRankRooms(container); return; }
}

function renderConvos(container) {
var filtered = allConvos;
if (searchQuery) {
filtered = allConvos.filter(function(c) {
return c.user.full_name.toLowerCase().indexOf(searchQuery) !== -1 ||
c.user.username.toLowerCase().indexOf(searchQuery) !== -1;
});
}
if (!filtered.length) {
container.innerHTML = searchQuery
? '<div class="empty">Aramaya uygun sohbet yok.</div>'
: '<div class="empty">Henüz mesajın yok.<br><br><button onclick="document.getElementById(\'tabUsers\').click()" style="background:var(--bordo);color:#fff;border:none;border-radius:60px;padding:0.7rem 1.5rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:0.5rem;">Yeni sohbet başlat</button></div>';
return;
}
var html = '';
filtered.forEach(function(c) {
var preview = (c.lastMsg.sender_id === currentUser.id ? 'Sen: ' : '') + c.lastMsg.content;
html += '<a class="card" href="sohbet.html?id=' + c.user.id + '">';
html += getAvatar(c.user, 46);
html += '<div class="card-body">';
html += '<div class="card-header">';
html += '<div class="card-name">' + escapeHtml(c.user.full_name) + '</div>';
html += '<div class="card-time">' + timeAgo(c.lastMsg.created_at) + '</div>';
html += '</div>';
html += '<div class="card-preview' + (c.unread > 0 ? ' unread' : '') + '">' + escapeHtml(preview) + '</div>';
html += '</div>';
if (c.unread > 0) html += '<div class="card-badge">' + (c.unread > 9 ? '9+' : c.unread) + '</div>';
html += '</a>';
});
container.innerHTML = html;
}

function renderUsers(container) {
var filteredUsers = allUsers;
if (searchQuery) {
filteredUsers = allUsers.filter(function(u) {
return (u.full_name || '').toLowerCase().indexOf(searchQuery) !== -1 ||
(u.username || '').toLowerCase().indexOf(searchQuery) !== -1;
});
}
if (!filteredUsers.length) {
container.innerHTML = searchQuery
? '<div class="empty">Kullanıcı bulunamadı.</div>'
: '<div class="empty">Henüz başka üye yok.</div>';
return;
}
var html = '';
filteredUsers.forEach(function(u) {
html += '<a class="card" href="sohbet.html?id=' + u.id + '">';
html += getAvatar(u, 46);
html += '<div class="card-body">';
html += '<div class="card-name">' + escapeHtml(u.full_name) + '</div>';
html += '<div class="card-preview">@' + escapeHtml(u.username) + '</div>';
html += '</div>';
html += '<div class="card-action">Mesaj ' + ICON_ARROW + '</div>';
html += '</a>';
});
container.innerHTML = html;
}

function renderGroups(container) {
var userGroups = allGroups.filter(function(g) { return g.type !== 'rank'; });
var myUserGroups = userGroups.filter(function(g) { return myGroupIds.indexOf(g.id) !== -1; });
var discoverGroups = userGroups.filter(function(g) { return myGroupIds.indexOf(g.id) === -1; });

if (searchQuery) {
myUserGroups = myUserGroups.filter(function(g) {
return (g.name || '').toLowerCase().indexOf(searchQuery) !== -1 ||
(g.description || '').toLowerCase().indexOf(searchQuery) !== -1;
});
discoverGroups = discoverGroups.filter(function(g) {
return (g.name || '').toLowerCase().indexOf(searchQuery) !== -1 ||
(g.description || '').toLowerCase().indexOf(searchQuery) !== -1;
});
}

var html = '';

if (!searchQuery) {
html += '<a href="grup-olustur.html" class="new-group-btn">' + ICON_PLUS + ' Yeni Grup Oluştur</a>';
}

if (myUserGroups.length) {
html += '<div class="section-title"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Gruplarım</div>';
myUserGroups.forEach(function(g) { html += renderGroupCard(g); });
}

if (discoverGroups.length) {
html += '<div class="section-title" style="margin-top:1.8rem;"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Keşfet</div>';
html += '<div class="section-sub">Katılabileceğin gruplar</div>';
discoverGroups.forEach(function(g) { html += renderGroupCard(g); });
}

if (!html) {
html = searchQuery
? '<div class="empty">Aramaya uygun grup yok.</div>'
: '<div class="empty">Henüz hiç grup yok. İlk grubu sen oluştur!</div>';
}

container.innerHTML = html;
}

function renderRankRooms(container) {
var rankGroups = allGroups.filter(function(g) { return g.type === 'rank'; });
rankGroups.sort(function(a, b) { return RANK_ORDER.indexOf(a.min_rank) - RANK_ORDER.indexOf(b.min_rank); });

if (searchQuery) {
rankGroups = rankGroups.filter(function(g) {
return (g.name || '').toLowerCase().indexOf(searchQuery) !== -1 ||
(g.description || '').toLowerCase().indexOf(searchQuery) !== -1;
});
}

if (!rankGroups.length) {
container.innerHTML = '<div class="empty">Henüz rütbe odası yok.</div>';
return;
}

var html = '<div class="section-sub">Rütben yükseldikçe yeni odalar açılır</div>';

if (currentProfile) {
var myRank = currentProfile.rank || 'filiz';
var target = RANK_TARGETS[myRank] || 3;
var previousTarget = 0;
if (myRank === 'karanfil') previousTarget = 3;
else if (myRank === 'gergedan') previousTarget = 10;
else if (myRank === 'katran') previousTarget = 25;
var progressPercent = 100;
if (myRank !== 'katran' && target > previousTarget) {
  progressPercent = Math.min(100, Math.round(((readCount - previousTarget) / (target - previousTarget)) * 100));
}
var remaining = myRank === 'katran' ? 0 : Math.max(0, target - readCount);

html += '<div class="rank-progress-box">';
html += '<div class="rank-progress-top">';
html += '<div class="rank-progress-icon">' + (RANK_ICONS_EMOJI[myRank] || '🌱') + '</div>';
html += '<div>';
html += '<div class="rank-progress-label">Rütben</div>';
html += '<div class="rank-progress-name">' + (RANK_LABELS[myRank] || 'Filiz') + '</div>';
html += '</div>';
html += '<div class="rank-progress-count">';
html += '<div class="rank-progress-count-label">Okunan</div>';
html += '<div class="rank-progress-count-num">' + readCount + '</div>';
html += '</div>';
html += '</div>';
if (myRank !== 'katran') {
html += '<div class="rank-progress-bar"><div class="rank-progress-fill" style="width:' + progressPercent + '%;"></div></div>';
html += '<div class="rank-progress-hint">Bir sonraki rütbeye <strong>' + remaining + ' kitap</strong> kaldı</div>';
} else {
html += '<div class="rank-progress-hint" style="color:var(--bordo);font-weight:700;">👑 En yüksek rütbedesin</div>';
}
html += '</div>';
}

rankGroups.forEach(function(g) { html += renderGroupCard(g, true); });
container.innerHTML = html;
}

function renderGroupCard(g, isRank) {
var colorClass = '';
var rankBadge = '';
if (isRank) {
colorClass = ' rank-' + (RANK_COLORS[g.min_rank] || 'green');
rankBadge = RANK_LABELS[g.min_rank] || '';
}

var canAccess = !isRank || canAccessRank(g.min_rank);
var isMember = myGroupIds.indexOf(g.id) !== -1;
var initial = (g.name || '?').charAt(0).toUpperCase();
var memberCount = groupMemberCounts[g.id] || 0;

var actionHtml = '';
if (isRank && !canAccess) {
actionHtml = '<span class="group-action locked">' + ICON_LOCK + ' ' + rankBadge + '</span>';
} else if (isMember) {
actionHtml = '<span class="group-action">' + ICON_ARROW + '</span>';
} else {
actionHtml = '<span class="group-action">Katıl ' + ICON_ARROW + '</span>';
}

var clickable = isRank ? canAccess : true;
var tag = clickable ? 'a' : 'div';
var hrefAttr = clickable ? ' href="grup.html?id=' + g.id + '"' : '';

var html = '<' + tag + hrefAttr + ' class="group-card' + colorClass + '">';
html += '<div class="group-avatar">' + initial + '</div>';
html += '<div class="group-info">';
html += '<div class="group-name">' + escapeHtml(g.name) + '</div>';
if (g.description) html += '<div class="group-desc">' + escapeHtml(g.description) + '</div>';
html += '<div class="group-meta">' + memberCount + ' üye</div>';
html += '</div>';
html += actionHtml;
html += '</' + tag + '>';
return html;
}

function switchView(view) {
currentView = view;
document.querySelectorAll('.view-tab').forEach(function(t) { t.classList.remove('active'); });
if (view === 'convos') document.getElementById('tabConvos').classList.add('active');
else if (view === 'users') document.getElementById('tabUsers').classList.add('active');
else if (view === 'groups') document.getElementById('tabGroups').classList.add('active');
else if (view === 'rankRooms') document.getElementById('tabRankRooms').classList.add('active');

var placeholders = {
  convos: 'Sohbetlerde ara...',
  users: 'Kullanıcılarda ara...',
  groups: 'Gruplarda ara...',
  rankRooms: 'Rütbe odalarında ara...'
};
document.getElementById('searchInput').placeholder = placeholders[view] || 'Ara...';
render();
}

// ============ BAŞLAT ============
(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

var profRes = await supabaseClient.from('profiles').select('id, full_name, username, rank, status').eq('id', currentUser.id).single();
if (!profRes.data || profRes.data.status !== 'approved') { window.location.href = 'giris.html'; return; }
currentProfile = profRes.data;

await loadReadCount();
await loadConversations();
await loadAllUsers();
await loadGroups();

dataLoaded = true;
render();

document.getElementById('searchInput').addEventListener('input', function() {
searchQuery = this.value.trim().toLowerCase();
render();
});
document.getElementById('tabConvos').addEventListener('click', function() { switchView('convos'); });
document.getElementById('tabUsers').addEventListener('click', function() { switchView('users'); });
document.getElementById('tabGroups').addEventListener('click', function() { switchView('groups'); });
document.getElementById('tabRankRooms').addEventListener('click', function() { switchView('rankRooms'); });
})();

})();
</script>
</body>
</html>
