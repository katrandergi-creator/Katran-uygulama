<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mesajlar • Katran Dergi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
padding-bottom: 4rem;
}
.top-nav {
position: sticky;
top: 0;
background: rgba(10,8,8,0.9);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.06);
padding: 1rem 0;
z-index: 100;
}
.nav-inner {
max-width: 600px;
margin: 0 auto;
padding: 0 1rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
text-decoration: none;
color: #f4efe8;
}
.nav-logo .red { color: #e03131; }
.nav-btn {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
padding: 0.5rem 0.9rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.4rem;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: #e03131; border-color: #e03131; }
.container { max-width: 600px; margin: 0 auto; padding: 1.5rem 1rem; }
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
margin-bottom: 1.5rem;
}
h1 .red { color: #e03131; }
.convo {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1rem 1.2rem;
margin-bottom: 0.6rem;
display: flex;
align-items: center;
gap: 0.9rem;
text-decoration: none;
color: inherit;
transition: all 0.2s;
}
.convo:hover { border-color: rgba(224,49,49,0.3); background: rgba(224,49,49,0.03); }
.convo-avatar {
width: 50px;
height: 50px;
border-radius: 50%;
background: linear-gradient(135deg, #e03131, #b71c1c);
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
color: #f4efe8;
flex-shrink: 0;
font-size: 1.1rem;
}
.convo-body { flex: 1; min-width: 0; }
.convo-header {
display: flex;
justify-content: space-between;
align-items: baseline;
margin-bottom: 0.2rem;
}
.convo-name { font-weight: 700; font-size: 0.95rem; }
.convo-time { color: #7a7068; font-size: 0.75rem; white-space: nowrap; }
.convo-preview {
color: #a89e94;
font-size: 0.85rem;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.convo-preview.unread { color: #f4efe8; font-weight: 600; }
.convo-badge {
background: #e03131;
color: #fff;
font-size: 0.7rem;
font-weight: 700;
min-width: 20px;
height: 20px;
padding: 0 6px;
border-radius: 20px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.loading, .empty {
text-align: center;
padding: 4rem 1rem;
color: #a89e94;
}
.empty .flower {
font-size: 3rem;
color: #e03131;
display: block;
margin-bottom: 1rem;
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="akis.html" class="nav-btn">← Akış</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Mesajlar</span></h1>
<div id="listContainer"><div class="loading">Yükleniyor...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var now = new Date();
var s = Math.floor((now - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk';
if (s < 86400) return Math.floor(s/3600) + ' sa';
if (s < 604800) return Math.floor(s/86400) + ' gün';
return d.toLocaleDateString('tr-TR');
}

async function load() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) {
window.location.href = 'giris.html';
return;
}
currentUser = sessionRes.data.session.user;

// Tüm mesajlarımı al
var res = await supabaseClient
.from('messages')
.select('*')
.or('sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentUser.id)
.order('created_at', { ascending: false })
.limit(500);

if (res.error) {
document.getElementById('listContainer').innerHTML =
'<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var msgs = res.data || [];

// Her karşı taraf için son mesajı bul
var convos = {};
var unreadCounts = {};

msgs.forEach(function(m) {
var other = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
if (!convos[other]) {
convos[other] = m;
}
if (m.sender_id !== currentUser.id && m.receiver_id === currentUser.id && !m.is_read) {
unreadCounts[other] = (unreadCounts[other] || 0) + 1;
}
});

var otherIds = Object.keys(convos);

if (!otherIds.length) {
document.getElementById('listContainer').innerHTML =
'<div class="empty"><span class="flower">❀</span>Henüz mesajın yok.</div>';
return;
}

var profRes = await supabaseClient.from('profiles').select('id, full_name, username').in('id', otherIds);
var profileMap = {};
(profRes.data || []).forEach(function(p) { profileMap[p.id] = p; });

var sorted = otherIds.sort(function(a, b) {
return new Date(convos[b].created_at) - new Date(convos[a].created_at);
});

var html = '';
sorted.forEach(function(oid) {
var p = profileMap[oid];
if (!p) return;
var lastMsg = convos[oid];
var unread = unreadCounts[oid] || 0;
var initial = (p.full_name || 'K').charAt(0).toUpperCase();

var preview = (lastMsg.sender_id === currentUser.id ? 'Sen: ' : '') + lastMsg.content;
var previewClass = unread > 0 ? 'convo-preview unread' : 'convo-preview';

html += '<a class="convo" href="sohbet.html?id=' + oid + '">';
html += '<div class="convo-avatar">' + initial + '</div>';
html += '<div class="convo-body">';
html += '<div class="convo-header">';
html += '<div class="convo-name">' + escapeHtml(p.full_name) + '</div>';
html += '<div class="convo-time">' + timeAgo(lastMsg.created_at) + '</div>';
html += '</div>';
html += '<div class="' + previewClass + '">' + escapeHtml(preview) + '</div>';
html += '</div>';
if (unread > 0) {
html += '<div class="convo-badge">' + (unread > 9 ? '9+' : unread) + '</div>';
}
html += '</a>';
});
document.getElementById('listContainer').innerHTML = html;
}

load();
})();
</script>
</body>
</html>
