<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<script>
(function() {
  try {
    var t = localStorage.getItem('katran-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mesajlar • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.top-nav {
position: sticky;
top: 0;
background: var(--nav-bg);
backdrop-filter: blur(24px);
border-bottom: 1px solid var(--border);
z-index: 100;
padding: 0.85rem 0;
}
.nav-inner { max-width: 600px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; text-decoration: none; color: var(--text); }
.nav-logo .red { color: var(--bordo); }
.nav-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 0.5rem 0.9rem; border-radius: 60px; text-decoration: none; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all 0.2s; font-family: inherit; }
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }
.container { max-width: 600px; margin: 0 auto; padding: 1.2rem 1rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem; color: var(--text); }
h1 .red { color: var(--bordo); }
.search-input-wrap { position: relative; display: flex; align-items: center; margin-bottom: 1rem; }
.search-input-wrap svg { position: absolute; left: 1rem; width: 16px; height: 16px; stroke: var(--text-dim); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.search-input {
width: 100%;
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 60px;
padding: 0.75rem 1.2rem 0.75rem 2.5rem;
color: var(--text);
font-family: inherit;
font-size: 0.9rem;
transition: all 0.2s;
}
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { outline: none; border-color: var(--bordo); background: var(--bordo-glow); }
.view-tabs { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; overflow-x: auto; scrollbar-width: none; }
.view-tabs::-webkit-scrollbar { display: none; }
.view-tab {
background: transparent;
color: var(--text-muted);
border: none;
padding: 0.55rem 1rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
white-space: nowrap;
}
.view-tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.view-tab.active { background: var(--bordo-glow); color: var(--bordo); }
.view-tab:hover:not(.active) { color: var(--text); background: var(--bg-elev); }
.view-tab .tab-badge { background: var(--accent); color: #fff; font-size: 0.62rem; padding: 1px 5px; border-radius: 20px; font-weight: 700; min-width: 16px; text-align: center; margin-left: 0.2rem; }
.card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 16px;
padding: 0.9rem 1.1rem;
margin-bottom: 0.5rem;
display: flex;
align-items: center;
gap: 0.9rem;
text-decoration: none;
color: inherit;
transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
.card:hover { border-color: var(--bordo); background: var(--bordo-glow); transform: translateX(4px); }
.card-body { flex: 1; min-width: 0; }
.card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.15rem; gap: 0.5rem; }
.card-name { font-weight: 700; font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-time { color: var(--text-dim); font-size: 0.72rem; white-space: nowrap; flex-shrink: 0; }
.card-preview { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-preview.unread { color: var(--text); font-weight: 600; }
.card-badge { background: var(--accent); color: #fff; font-size: 0.68rem; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-action { color: var(--bordo); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
.card-action svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.3rem; }
.card { padding: 0.8rem 1rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="akis.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Akış
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Mesajlar</span></h1>

<div class="search-input-wrap">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input type="text" class="search-input" id="searchInput" placeholder="Sohbetlerde ara..." autocomplete="off">
</div>

<div class="view-tabs">
<button class="view-tab active" data-view="convos" id="tabConvos">
<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
Sohbetler
<span class="tab-badge" id="convosBadge" style="display:none;">0</span>
</button>
<button class="view-tab" data-view="users" id="tabUsers">
<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
Yeni Sohbet
</button>
</div>

<div id="contentContainer">
<div class="loading"><div class="spinner"></div>Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>
<script src="avatares.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var currentView = 'convos';
var searchQuery = '';
var allConvos = [];
var allUsers = [];

var ICON_ARROW = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk';
if (s < 86400) return Math.floor(s/3600) + ' sa';
if (s < 604800) return Math.floor(s/86400) + ' gün';
return d.toLocaleDateString('tr-TR');
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 46);
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 46) + 'px;height:' + (size || 46) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo), var(--bordo-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:' + Math.round((size || 46) * 0.42) + 'px;">' + initial + '</div>';
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

await loadConversations();
await loadAllUsers();

document.getElementById('searchInput').addEventListener('input', function() {
searchQuery = this.value.trim().toLowerCase();
render();
});
document.getElementById('tabConvos').addEventListener('click', function() { switchView('convos'); });
document.getElementById('tabUsers').addEventListener('click', function() { switchView('users'); });
})();

function switchView(view) {
currentView = view;
document.querySelectorAll('.view-tab').forEach(function(t) { t.classList.remove('active'); });
if (view === 'convos') document.getElementById('tabConvos').classList.add('active');
else document.getElementById('tabUsers').classList.add('active');
document.getElementById('searchInput').placeholder = view === 'convos' ? 'Sohbetlerde ara...' : 'Kullanıcılarda ara...';
render();
}

async function loadConversations() {
var res = await supabaseClient
.from('messages')
.select('*')
.or('sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + currentUser.id)
.order('created_at', { ascending: false })
.limit(500);

if (res.error) { allConvos = []; return; }
var msgs = res.data || [];
var convos = {};
var unreadCounts = {};

msgs.forEach(function(m) {
var other = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
if (!convos[other]) convos[other] = m;
if (m.sender_id !== currentUser.id && m.receiver_id === currentUser.id && !m.is_read) {
unreadCounts[other] = (unreadCounts[other] || 0) + 1;
}
});

var otherIds = Object.keys(convos);
if (!otherIds.length) { allConvos = []; return; }

var profRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', otherIds);
var profileMap = {};
(profRes.data || []).forEach(function(p) { profileMap[p.id] = p; });

allConvos = otherIds.sort(function(a, b) {
return new Date(convos[b].created_at) - new Date(convos[a].created_at);
}).map(function(oid) {
return {
user: profileMap[oid] || { full_name: 'İsimsiz', username: 'kullanici', avatar: 'harf' },
lastMsg: convos[oid],
unread: unreadCounts[oid] || 0
};
});

var totalUnread = allConvos.reduce(function(sum, c) { return sum + c.unread; }, 0);
if (totalUnread > 0) {
var b = document.getElementById('convosBadge');
b.textContent = totalUnread > 9 ? '9+' : totalUnread;
b.style.display = 'inline-block';
}
}

async function loadAllUsers() {
var res = await supabaseClient
.from('profiles')
.select('id, full_name, username, avatar, status')
.eq('status', 'approved')
.neq('id', currentUser.id)
.order('full_name', { ascending: true })
.limit(200);
allUsers = res.data || [];
}

function render() {
var container = document.getElementById('contentContainer');

if (currentView === 'convos') {
var filtered = allConvos;
if (searchQuery) {
filtered = allConvos.filter(function(c) {
return c.user.full_name.toLowerCase().indexOf(searchQuery) !== -1 ||
c.user.username.toLowerCase().indexOf(searchQuery) !== -1;
});
}
if (!filtered.length) {
container.innerHTML = searchQuery
? '<div class="empty">Aramaya uygun sohbet yok.</div>'
: '<div class="empty">Henüz mesajın yok.<br><br><button onclick="document.getElementById(\'tabUsers\').click()" style="background:var(--bordo);color:#fff;border:none;border-radius:60px;padding:0.7rem 1.5rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:0.5rem;">Yeni sohbet başlat</button></div>';
return;
}
var html = '';
filtered.forEach(function(c) {
var preview = (c.lastMsg.sender_id === currentUser.id ? 'Sen: ' : '') + c.lastMsg.content;
html += '<a class="card" href="sohbet.html?id=' + c.user.id + '">';
html += getAvatar(c.user, 46);
html += '<div class="card-body">';
html += '<div class="card-header">';
html += '<div class="card-name">' + escapeHtml(c.user.full_name) + '</div>';
html += '<div class="card-time">' + timeAgo(c.lastMsg.created_at) + '</div>';
html += '</div>';
html += '<div class="card-preview' + (c.unread > 0 ? ' unread' : '') + '">' + escapeHtml(preview) + '</div>';
html += '</div>';
if (c.unread > 0) html += '<div class="card-badge">' + (c.unread > 9 ? '9+' : c.unread) + '</div>';
html += '</a>';
});
container.innerHTML = html;
return;
}

// USERS
var filteredUsers = allUsers;
if (searchQuery) {
filteredUsers = allUsers.filter(function(u) {
return (u.full_name || '').toLowerCase().indexOf(searchQuery) !== -1 ||
(u.username || '').toLowerCase().indexOf(searchQuery) !== -1;
});
}
if (!filteredUsers.length) {
container.innerHTML = searchQuery
? '<div class="empty">Kullanıcı bulunamadı.</div>'
: '<div class="empty">Henüz başka üye yok.</div>';
return;
}
var html = '';
filteredUsers.forEach(function(u) {
html += '<a class="card" href="sohbet.html?id=' + u.id + '">';
html += getAvatar(u, 46);
html += '<div class="card-body">';
html += '<div class="card-name">' + escapeHtml(u.full_name) + '</div>';
html += '<div class="card-preview">@' + escapeHtml(u.username) + '</div>';
html += '</div>';
html += '<div class="card-action">Mesaj ' + ICON_ARROW + '</div>';
html += '</a>';
});
container.innerHTML = html;
}
})();
</script>
</body>
</html>
