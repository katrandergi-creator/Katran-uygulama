<script>
(function() {

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;

var currentTab = 'all';
var allPosts = [];

var ICONS = {
heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',

search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
trash: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
more: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>',

x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
};

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var now = new Date();
var s = Math.floor((now - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk';
if (s < 86400) return Math.floor(s/3600) + ' sa';
if (s < 604800) return Math.floor(s/86400) + ' gün';
return d.toLocaleDateString('tr-TR');
}

function toast(msg) {
var t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ---------- OTURUM ----------
async function init() {
try {
var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;

if (session) {
currentUser = session.user;
var profRes = await supabaseClient
.from('profiles')
.select('full_name, username, status, role')
.eq('id', currentUser.id)
.single();

if (profRes.data && profRes.data.status === 'approved') {
currentProfile = profRes.data;
showLoggedInUI();
}
}
} catch (e) { console.error(e); }

loadPosts();
}

function showLoggedInUI() {
document.getElementById('composeBox').style.display = 'block';
document.getElementById('feedTabs').style.display = 'flex';
var initial = (currentProfile.full_name || 'K').charAt(0).toUpperCase();
document.getElementById('composeAvatar').textContent = initial;

var navRight = document.getElementById('navRight');
navRight.innerHTML =
'<a href="bildirimler.html" class="nav-btn" title="Bildirimler">' + ICONS.bell + '<span id="notifBadge" class="notif-badge" style="display:none;">0</span></a>' +
'<a href="mesajlar.html" class="nav-btn" title="Mesajlar">' + ICONS.mail + '<span id="msgBadge" class="notif-badge" style="display:none;">0</span></a>' +
'<a href="kitapligim.html" class="nav-btn" title="Kitaplığım">' + ICONS.library + '</a>' +
'<a href="kitaplar.html" class="nav-btn" title="Kitap Ara">' + ICONS.search + '</a>' +
'<a href="profil.html" class="nav-btn">' + escapeHtml(currentProfile.full_name.split(' ')[0]) + '</a>' +
'<button class="nav-btn primary" id="newPostBtn" title="Yeni Gönderi">' + ICONS.plus + '</button>';

document.getElementById('newPostBtn').addEventListener('click', function() {
window.location.href = 'gonderi.html';
});

// Sekmeler
document.getElementById('tabAll').addEventListener('click', function() {
switchTab('all');
});
document.getElementById('tabFollowing').addEventListener('click', function() {
switchTab('following');
});

// Bildirim sayısı
supabaseClient
.from('notifications')
.select('id', { count: 'exact', head: true })
.eq('user_id', currentUser.id)
.eq('is_read', false)
.then(function(res) {
var count = res.count || 0;
if (count > 0) {
var badge = document.getElementById('notifBadge');
badge.textContent = count > 9 ? '9+' : count;
badge.style.display = 'inline-block';
}
});

// Okunmamış mesaj sayısı
supabaseClient
.from('messages')
.select('id', { count: 'exact', head: true })
.eq('receiver_id', currentUser.id)
.eq('is_read', false)
.then(function(res) {
var count = res.count || 0;
if (count > 0) {
var badge = document.getElementById('msgBadge');
badge.textContent = count > 9 ? '9+' : count;
badge.style.display = 'inline-block';
}
});
}

function switchTab(tab) {
currentTab = tab;
document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
if (tab === 'all') document.getElementById('tabAll').classList.add('active');
else document.getElementById('tabFollowing').classList.add('active');
renderPosts();
}

// ---------- PROFİL CACHE ----------
async function fetchProfiles(ids) {
var missing = ids.filter(function(id) { return !profileCache[id]; });
if (missing.length) {
var res = await supabaseClient.from('profiles').select('id, full_name, username').in('id', missing);
(res.data || []).forEach(function(p) { profileCache[p.id] = p; });
}
var map = {};
ids.forEach(function(id) {
map[id] = profileCache[id] || { full_name: 'İsimsiz', username: 'kullanici' };
});
return map;
}

// ---------- GÖNDERİLERİ YÜKLE ----------
async function loadPosts() {
var postsRes = await supabaseClient
.from('posts')
.select('*')
.order('created_at', { ascending: false })
.limit(50);

if (postsRes.error) {
document.getElementById('postsContainer').innerHTML =
'<div class="empty">Hata: ' + escapeHtml(postsRes.error.message) + '</div>';
return;
}

allPosts = postsRes.data || [];

if (!allPosts.length) {
document.getElementById('postsContainer').innerHTML =
'<div class="empty"><span class="flower">❀</span>Henüz gönderi yok. İlk paylaşan sen ol!</div>';
return;
}

// Yazarları çek
var userIds = allPosts.map(function(p) { return p.user_id; });
var uniqueIds = userIds.filter(function(v, i, a) { return a.indexOf(v) === i; });
await fetchProfiles(uniqueIds);

// Kullanıcının beğendiklerini çek
var myLikes = {};
if (currentUser) {
var likesRes = await supabaseClient.from('likes').select('post_id').eq('user_id', currentUser.id);
(likesRes.data || []).forEach(function(l) { myLikes[l.post_id] = true; });
}
window.myLikes = myLikes;

// Takip edilenlerin listesi
var followingIds = [];
if (currentUser) {
var fRes = await supabaseClient.from('follows').select('following_id').eq('follower_id', currentUser.id);
followingIds = (fRes.data || []).map(function(f) { return f.following_id; });
}
window.followingIds = followingIds;

renderPosts();
}

function renderPosts() {
var posts = allPosts;

if (currentTab === 'following') {
if (!window.followingIds.length) {
document.getElementById('postsContainer').innerHTML =
'<div class="empty"><span class="flower">❀</span>Henüz kimseyi takip etmiyorsun. Profillere gidip takip et!</div>';
return;
}
posts = posts.filter(function(p) { return window.followingIds.indexOf(p.user_id) !== -1; });
if (!posts.length) {
document.getElementById('postsContainer').innerHTML =
'<div class="empty"><span class="flower">❀</span>Takip ettiğin kişilerin gönderisi yok.</div>';
return;
}
}

var html = '';
posts.forEach(function(post) {
var author = profileCache[post.user_id] || { full_name: 'İsimsiz', username: 'kullanici' };
var initial = (author.full_name || 'K').charAt(0).toUpperCase();
var liked = window.myLikes[post.id] ? 'liked' : '';
var isOwner = currentUser && currentUser.id === post.user_id;

html += '<div class="post-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
html += '<div class="post-header">';
html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">';
html += '<div class="post-avatar">' + initial + '</div>';
html += '</a>';
html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
html += '<div class="post-meta">';
html += '<div class="post-name">' + escapeHtml(author.full_name) + '</div>';
html += '<div class="post-username">@' + escapeHtml(author.username) + '</div>';
html += '</div>';
html += '</a>';
html += '<div class="post-time">' + timeAgo(post.created_at) + '</div>';

if (isOwner) {
html += '<button class="post-menu" onclick="toggleMenu(\'' + post.id + '\', event)">' + ICONS.more + '</button>';
html += '<div class="dropdown" id="menu-' + post.id + '">';
html += '<button onclick="deletePost(\'' + post.id + '\')">' + ICONS.trash + ' Gönderiyi Sil</button>';
html += '</div>';
}

html += '</div>';
html += '<div class="post-content">' + escapeHtml(post.content) + '</div>';
html += '<div class="post-actions">';
html += '<button class="action-btn ' + liked + '" onclick="toggleLike(\'' + post.id + '\', this)">';
html += ICONS.heart;
html += '<span class="like-count">' + (post.likes_count || 0) + '</span>';
html += '</button>';
html += '<button class="action-btn" onclick="toggleComments(\'' + post.id + '\', this)">';
html += ICONS.comment;
html += '<span class="comment-count">' + (post.comments_count || 0) + '</span>';
html += '</button>';
html += '</div>';
html += '<div class="comments-section" id="comments-' + post.id + '"></div>';
html += '</div>';
});

document.getElementById('postsContainer').innerHTML = html;

// URL'de ?post=ID varsa highlight
var urlParams = new URLSearchParams(window.location.search);
var highlightId = urlParams.get('post');
if (highlightId) {
var target = document.querySelector('[data-post-id="' + highlightId + '"]');
if (target) {
target.classList.add('highlight');
setTimeout(function() { target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
}
}
}

// ---------- MENÜ ----------
window.toggleMenu = function(postId, e) {
e.stopPropagation();
var menu = document.getElementById('menu-' + postId);
var isOpen = menu.classList.contains('open');
document.querySelectorAll('.dropdown').forEach(function(m) { m.classList.remove('open'); });
if (!isOpen) menu.classList.add('open');
};

document.addEventListener('click', function() {
document.querySelectorAll('.dropdown').forEach(function(m) { m.classList.remove('open'); });
});

// ---------- GÖNDERİ SİL ----------
window.deletePost = async function(postId) {
if (!confirm('Bu gönderiyi silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('posts').delete().eq('id', postId);
if (res.error) { toast('Silinemedi: ' + res.error.message); return; }
var card = document.querySelector('[data-post-id="' + postId + '"]');
if (card) card.remove();
toast('Gönderi silindi');
};

// ---------- BEĞENİ ----------
window.toggleLike = async function(postId, btn) {
if (!currentUser) { toast('Beğenmek için giriş yap'); return; }

var liked = btn.classList.contains('liked');
var countEl = btn.querySelector('.like-count');
var currentCount = parseInt(countEl.textContent) || 0;

if (liked) {
btn.classList.remove('liked');
countEl.textContent = Math.max(0, currentCount - 1);
} else {
btn.classList.add('liked');
countEl.textContent = currentCount + 1;
}

if (liked) {
await supabaseClient.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
} else {
await supabaseClient.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
}
};

// ---------- YORUMLAR ----------
window.toggleComments = async function(postId, btn) {
var section = document.getElementById('comments-' + postId);
if (section.classList.contains('open')) {
section.classList.remove('open');
return;
}
section.classList.add('open');
section.innerHTML = '<div style="color:#a89e94;font-size:0.85rem;padding:0.5rem;">Yükleniyor...</div>';

var res = await supabaseClient
.from('comments')
.select('*')
.eq('post_id', postId)
.order('created_at', { ascending: true });

var comments = res.data || [];
var ids = comments.map(function(c) { return c.user_id; });
var uniqueIds = ids.filter(function(v, i, a) { return a.indexOf(v) === i; });
var profileMap = await fetchProfiles(uniqueIds);

var card = document.querySelector('[data-post-id="' + postId + '"]');
var postOwnerId = card ? card.getAttribute('data-owner-id') : null;

var html = '';
comments.forEach(function(c) {
var author = profileMap[c.user_id] || { full_name: 'İsimsiz' };
var initial = (author.full_name || 'K').charAt(0).toUpperCase();
var canDelete = currentUser && (currentUser.id === c.user_id || currentUser.id === postOwnerId);

html += '<div class="comment" data-comment-id="' + c.id + '">';
html += '<div class="comment-avatar">' + initial + '</div>';
html += '<div class="comment-body">';
html += '<a href="kullanici.html?id=' + c.user_id + '" class="comment-name">' + escapeHtml(author.full_name) + '</a>';
html += '<div class="comment-text">' + escapeHtml(c.content) + '</div>';
if (canDelete) {
html += '<button class="comment-delete" onclick="deleteComment(\'' + c.id + '\', \'' + postId + '\')" title="Yorumu sil">' + ICONS.x + '</button>';
}
html += '</div>';
html += '</div>';
});

if (currentUser) {
html += '<div class="comment-form">';
html += '<input type="text" class="comment-input" placeholder="Yorum yaz..." id="cinput-' + postId + '" maxlength="500">';
html += '<button class="comment-send" onclick="sendComment(\'' + postId + '\', this)">Gönder</button>';
html += '</div>';
} else {
html += '<div style="color:#a89e94;font-size:0.85rem;text-align:center;padding:0.5rem;">Yorum yapmak için <a href="giris.html" style="color:#e03131;">giriş yap</a></div>';
}

section.innerHTML = html;
};

window.sendComment = async function(postId, btn) {
var input = document.getElementById('cinput-' + postId);
var content = input.value.trim();
if (!content) return;

btn.disabled = true;
btn.textContent = '...';

var res = await supabaseClient.from('comments').insert([{
post_id: postId,
user_id: currentUser.id,
content: content
}]);

btn.disabled = false;
btn.textContent = 'Gönder';

if (res.error) { toast('Hata: ' + res.error.message); return; }

input.value = '';
var card = document.querySelector('[data-post-id="' + postId + '"]');
var countEl = card.querySelector('.comment-count');
countEl.textContent = (parseInt(countEl.textContent) || 0) + 1;

var section = document.getElementById('comments-' + postId);
section.classList.remove('open');
await toggleComments(postId, btn);
};

window.deleteComment = async function(commentId, postId) {
if (!confirm('Bu yorumu silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('comments').delete().eq('id', commentId);
if (res.error) { toast('Silinemedi: ' + res.error.message); return; }

var card = document.querySelector('[data-post-id="' + postId + '"]');
var countEl = card.querySelector('.comment-count');
countEl.textContent = Math.max(0, (parseInt(countEl.textContent) || 1) - 1);

var section = document.getElementById('comments-' + postId);
section.classList.remove('open');
await toggleComments(postId, document.createElement('button'));
toast('Yorum silindi');
};

// ---------- BEĞENENLER MODAL ----------
window.showLikes = async function(postId) {
document.getElementById('modalTitle').textContent = 'Beğenenler';
document.getElementById('modalBody').innerHTML = '<div class="loading">Yükleniyor...</div>';
document.getElementById('userListModal').classList.add('open');

var res = await supabaseClient.from('likes').select('user_id').eq('post_id', postId);
var userIds = (res.data || []).map(function(r) { return r.user_id; });

if (!userIds.length) {
document.getElementById('modalBody').innerHTML =
'<div class="empty" style="padding:2rem;text-align:center;color:#a89e94;font-size:0.9rem;">Henüz beğenen yok.</div>';
return;
}

var profRes = await supabaseClient.from('profiles').select('id, full_name, username').in('id', userIds);
var profiles = profRes.data || [];

var html = '';
profiles.forEach(function(p) {
var initial = (p.full_name || 'K').charAt(0).toUpperCase();
html += '<a class="user-item" href="kullanici.html?id=' + p.id + '">';
html += '<div class="user-item-avatar">' + initial + '</div>';
html += '<div class="user-item-info">';
html += '<div class="user-item-name">' + escapeHtml(p.full_name) + '</div>';
html += '<div class="user-item-username">@' + escapeHtml(p.username) + '</div>';
html += '</div>';
html += '</a>';
});
document.getElementById('modalBody').innerHTML = html;
};

document.getElementById('modalClose').addEventListener('click', function() {
document.getElementById('userListModal').classList.remove('open');
});
document.getElementById('userListModal').addEventListener('click', function(e) {
if (e.target === this) this.classList.remove('open');
});

init();
})();
</script>
</body>
</html>
