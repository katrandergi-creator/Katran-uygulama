<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

background: var(--bg, #0a0808);

}
.top-nav {

}
.nav-inner { max-width: 600px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.nav-home {

color: var(--text, #f4efe8);
display: flex;
align-items: center;
gap: 0.5rem;
font-family: 'Playfair Display', serif;
font-size: 1.25rem;
font-weight: 900;
}
.nav-home .home-icon {
width: 32px; height: 32px;
border-radius: 50%;
background: var(--bordo-glow, rgba(139,46,62,0.25));
display: flex;
align-items: center;
justify-content: center;
color: var(--bordo, #8b2e3e);
}
.nav-home .home-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.nav-home .red { color: var(--bordo, #8b2e3e); }
.notif-btn {
position: relative;
background: var(--bg-elev, rgba(255,255,255,0.03));
color: var(--text-muted, #a89e94);
border: 1px solid var(--border, rgba(255,255,255,0.08));
padding: 0.55rem 0.7rem;
border-radius: 60px;
cursor: pointer;
display: flex;
align-items: center;
text-decoration: none;
}
.notif-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.notif-btn:hover { color: var(--bordo, #8b2e3e); border-color: var(--bordo, #8b2e3e); background: var(--bordo-glow, rgba(139,46,62,0.25)); }
.notif-badge { position: absolute; top: -6px; right: -6px; background: var(--accent, #e03131); color: #fff; font-size: 0.62rem; padding: 2px 6px; border-radius: 20px; font-weight: 700; min-width: 18px; text-align: center; }
.container { max-width: 600px; margin: 0 auto; padding: 1.2rem 1rem; }
.tabs { display: flex; gap: 0.4rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border, rgba(255,255,255,0.08)); padding-bottom: 0.5rem; }
.tab {
background: transparent;
color: var(--text-muted, #a89e94);
border: none;
padding: 0.55rem 1.1rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.45rem;
transition: all 0.2s;
}
.tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { background: var(--bordo-glow, rgba(139,46,62,0.25)); color: var(--bordo, #8b2e3e); }
.tab:hover:not(.active) { color: var(--text, #f4efe8); background: var(--bg-elev, rgba(255,255,255,0.03)); }
.compose-box {
background: var(--bg-elev, rgba(255,255,255,0.03));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 20px;
padding: 1rem 1.3rem;
margin-bottom: 1.2rem;
display: flex;
align-items: center;
gap: 1rem;
cursor: pointer;
transition: all 0.2s;
}
.compose-box:hover { border-color: var(--bordo, #8b2e3e); background: var(--bordo-glow, rgba(139,46,62,0.15)); }
.compose-placeholder { color: var(--text-muted, #a89e94); font-size: 0.9rem; }
.post-card {
background: var(--bg-elev, rgba(255,255,255,0.03));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 20px;
padding: 1.2rem 1.3rem;
margin-bottom: 0.8rem;
transition: all 0.25s;
position: relative;
}
.post-card:hover { border-color: var(--border-strong, rgba(255,255,255,0.15)); }
.post-card.highlight { border-color: var(--bordo, #8b2e3e); box-shadow: 0 0 0 2px var(--bordo-glow, rgba(139,46,62,0.25)); }
.post-header { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; }
.post-avatar-link { text-decoration: none; color: inherit; transition: transform 0.2s; }
.post-avatar-link:hover { transform: scale(1.05); }
.post-meta { flex: 1; min-width: 0; }
.post-name { font-weight: 700; font-size: 0.92rem; color: var(--text, #f4efe8); }
.post-username { color: var(--text-muted, #a89e94); font-size: 0.78rem; }
.post-time { color: var(--text-dim, #7a7068); font-size: 0.72rem; white-space: nowrap; }
.post-menu {
background: transparent;
border: none;
color: var(--text-dim, #7a7068);
cursor: pointer;
padding: 0.4rem 0.5rem;
border-radius: 50%;
display: flex;
align-items: center;
}
.post-menu svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.post-menu:hover { background: var(--bordo-glow, rgba(139,46,62,0.25)); color: var(--bordo, #8b2e3e); }
.post-content {
font-size: 0.98rem;
line-height: 1.65;
color: var(--text, #f4efe8);
margin-bottom: 0.9rem;
white-space: pre-wrap;
word-wrap: break-word;
}
.post-actions { display: flex; gap: 0.4rem; border-top: 1px solid var(--border, rgba(255,255,255,0.08)); padding-top: 0.7rem; }
.action-btn {
background: transparent;
border: none;
color: var(--text-muted, #a89e94);
font-size: 0.83rem;
padding: 0.5rem 1rem;
border-radius: 60px;
cursor: pointer;
display: flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
font-family: inherit;
font-weight: 500;
}
.action-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.action-btn:hover { background: var(--bordo-glow, rgba(139,46,62,0.25)); color: var(--bordo, #8b2e3e); }
.action-btn.liked { color: var(--bordo, #8b2e3e); }
.action-btn.liked svg { fill: var(--bordo, #8b2e3e); stroke: var(--bordo, #8b2e3e); }

/* REPOST */
.repost-badge {
display: flex;
align-items: center;
gap: 0.4rem;
font-size: 0.72rem;
color: var(--text-dim, #7a7068);
margin-bottom: 0.7rem;
padding-left: 0.2rem;
}
.repost-badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.repost-badge strong { color: var(--text-muted, #a89e94); font-weight: 600; }
.original-post {
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 14px;
padding: 0.9rem;
margin-bottom: 0.9rem;
cursor: pointer;
transition: all 0.2s;
}
.original-post:hover { border-color: var(--bordo, #8b2e3e); background: var(--bordo-glow, rgba(139,46,62,0.15)); }
.original-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.original-name { font-weight: 700; font-size: 0.82rem; color: var(--text, #f4efe8); }
.original-time { color: var(--text-dim, #7a7068); font-size: 0.7rem; }
.original-content { font-size: 0.88rem; color: var(--text-muted, #a89e94); line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* READ / ANALYSIS / QUOTE */
.read-card {
background: linear-gradient(135deg, var(--bordo-glow, rgba(139,46,62,0.1)), var(--bg-elev, rgba(255,255,255,0.03)));
border-color: var(--bordo, #8b2e3e);
}
.read-action {
display: flex;
align-items: center;
gap: 0.5rem;
font-size: 0.82rem;
color: var(--text-muted, #a89e94);
margin-bottom: 1rem;
padding: 0.6rem 0.8rem;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border-radius: 10px;
line-height: 1.5;
}
.read-action strong { color: var(--text, #f4efe8); font-weight: 700; }
.read-action em { color: var(--bordo, #8b2e3e); font-style: italic; font-weight: 600; }
.read-icon { width: 18px; height: 18px; stroke: var(--bordo, #8b2e3e); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.book-preview {
display: flex;
gap: 0.9rem;
padding: 0.8rem;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border-radius: 12px;
margin-bottom: 1rem;
text-decoration: none;
color: inherit;
transition: all 0.2s;
}
.book-preview:hover { background: var(--bordo-glow, rgba(139,46,62,0.15)); }
.book-preview-cover { width: 55px; height: 82px; border-radius: 4px 6px 6px 4px; object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 12px -3px rgba(0,0,0,0.4); }
.book-preview-placeholder {
background: linear-gradient(135deg, var(--bordo, #8b2e3e), var(--bordo-dark, #6b1f2e));
display: flex;
align-items: center;
justify-content: center;
color: #fff;
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
}
.book-preview-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.book-preview-title { font-weight: 700; font-size: 0.9rem; color: var(--text, #f4efe8); line-height: 1.3; margin-bottom: 0.15rem; }
.book-preview-author { color: var(--text-muted, #a89e94); font-size: 0.8rem; }
.book-preview-date { color: var(--text-dim, #7a7068); font-size: 0.72rem; margin-top: 0.25rem; font-style: italic; }
.read-quote {
position: relative;
padding: 0.6rem 0 0.6rem 1rem;
border-left: 3px solid var(--bordo, #8b2e3e);
margin-bottom: 1rem;
}
.read-quote-mark {
position: absolute;
top: -0.5rem;
left: -0.2rem;
font-family: 'Playfair Display', serif;
font-size: 2.5rem;
line-height: 1;
color: var(--bordo, #8b2e3e);
opacity: 0.3;
font-weight: 900;
pointer-events: none;
}
.read-quote-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; line-height: 1.7; color: var(--text, #f4efe8); position: relative; }
.read-quote-page { font-size: 0.72rem; color: var(--text-dim, #7a7068); text-align: right; margin-top: 0.3rem; }

/* ANALİZ */
.analysis-title {
font-family: 'Playfair Display', serif;
font-size: 1.15rem;
font-weight: 900;
color: var(--text, #f4efe8);
margin-bottom: 0.6rem;
line-height: 1.3;
}
.analysis-preview {
font-size: 0.92rem;
color: var(--text-muted, #a89e94);
line-height: 1.7;
white-space: pre-wrap;
word-wrap: break-word;
margin-bottom: 0.6rem;
}
.read-more-link {
color: var(--bordo, #8b2e3e);
text-decoration: none;
font-weight: 600;
font-size: 0.85rem;
display: inline-block;
margin-bottom: 1rem;
transition: color 0.2s;
}
.read-more-link:hover { text-decoration: underline; }

/* YORUMLAR */
.comments-section { margin-top: 0.9rem; border-top: 1px solid var(--border, rgba(255,255,255,0.08)); padding-top: 0.9rem; display: none; }
.comments-section.open { display: block; }
.comment { display: flex; gap: 0.6rem; padding: 0.5rem 0; position: relative; }
.comment-body { flex: 1; background: var(--bg-elev-2, rgba(255,255,255,0.06)); border-radius: 14px; padding: 0.55rem 2rem 0.55rem 0.85rem; position: relative; }
.comment-name { font-weight: 700; font-size: 0.8rem; margin-bottom: 0.15rem; text-decoration: none; color: var(--text, #f4efe8); display: inline-block; }
.comment-name:hover { color: var(--bordo, #8b2e3e); }
.comment-text { font-size: 0.88rem; color: var(--text-muted, #a89e94); line-height: 1.5; word-wrap: break-word; }
.comment-delete { position: absolute; top: 0.4rem; right: 0.5rem; background: transparent; border: none; color: var(--text-dim, #7a7068); cursor: pointer; padding: 0.3rem; border-radius: 50%; display: flex; }
.comment-delete svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.comment-delete:hover { color: var(--accent, #e03131); background: var(--accent-glow, rgba(224,49,49,0.15)); }
.comment-form { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
.comment-input {
flex: 1;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 60px;
padding: 0.65rem 1.1rem;
color: var(--text, #f4efe8);
font-family: inherit;
font-size: 0.88rem;
}
.comment-input:focus { outline: none; border-color: var(--bordo, #8b2e3e); }
.comment-send { background: var(--bordo, #8b2e3e); color: #fff; border: none; border-radius: 60px; padding: 0.65rem 1.1rem; font-weight: 700; cursor: pointer; font-size: 0.83rem; font-family: inherit; }
.comment-send:disabled { opacity: 0.5; }

/* DROPDOWN */
.dropdown {
position: absolute;
top: 3.2rem;
right: 1rem;
background: var(--bg, #0a0808);
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 14px;
padding: 0.3rem;
z-index: 10;
display: none;
min-width: 200px;
box-shadow: var(--shadow-lg, 0 20px 50px rgba(0,0,0,0.5));
}
.dropdown.open { display: block; }
.dropdown button {
background: transparent;
border: none;
color: var(--text, #f4efe8);
padding: 0.7rem 1rem;
border-radius: 8px;
cursor: pointer;
font-size: 0.85rem;
width: 100%;
text-align: left;
font-family: inherit;
display: flex;
align-items: center;
gap: 0.6rem;
font-weight: 500;
}
.dropdown button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dropdown button:hover { background: var(--bordo-glow, rgba(139,46,62,0.25)); }
.dropdown button.danger { color: var(--accent, #e03131); }
.dropdown button.danger:hover { background: var(--accent-glow, rgba(224,49,49,0.15)); }

/* MODAL */
.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.75);
backdrop-filter: blur(6px);
z-index: 9998;
display: none;
align-items: center;
justify-content: center;
padding: 1rem;
}
.modal-backdrop.open { display: flex; }
.modal {
background: var(--bg, #0a0808);
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 20px;
max-width: 440px;
width: 100%;
max-height: 80vh;
overflow: hidden;
display: flex;
flex-direction: column;
box-shadow: var(--shadow-lg, 0 20px 50px rgba(0,0,0,0.5));
}
.modal-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border, rgba(255,255,255,0.08)); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text, #f4efe8); }
.modal-close { background: transparent; border: none; color: var(--text-muted, #a89e94); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; transition: all 0.2s; }
.modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.modal-close:hover { color: var(--bordo, #8b2e3e); background: var(--bordo-glow, rgba(139,46,62,0.25)); }
.modal-body { padding: 0.5rem 0; overflow-y: auto; flex: 1; }
.user-item {
display: flex;
align-items: center;
gap: 0.8rem;
padding: 0.8rem 1.5rem;
text-decoration: none;
color: inherit;
transition: background 0.15s;
cursor: pointer;
border: none;
background: transparent;
width: 100%;
text-align: left;
font-family: inherit;
}
.user-item:hover { background: var(--bordo-glow, rgba(139,46,62,0.15)); }
.user-item-info { flex: 1; min-width: 0; }
.user-item-name { font-weight: 700; font-size: 0.9rem; color: var(--text, #f4efe8); }
.user-item-username { color: var(--text-muted, #a89e94); font-size: 0.8rem; }

.field { margin-bottom: 1rem; padding: 0 1.5rem; }
.field label { display: block; font-size: 0.8rem; color: var(--text-muted, #a89e94); margin-bottom: 0.4rem; font-weight: 600; }
.field textarea {
width: 100%;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 12px;
padding: 0.8rem 1rem;
color: var(--text, #f4efe8);
font-family: inherit;
font-size: 0.95rem;
min-height: 100px;
resize: vertical;
line-height: 1.6;
}
.field textarea::placeholder { color: var(--text-dim, #7a7068); }
.field textarea:focus { outline: none; border-color: var(--bordo, #8b2e3e); }
.quote-original {
margin: 0 1.5rem 1rem;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border-radius: 12px;
padding: 0.9rem;
border-left: 3px solid var(--bordo, #8b2e3e);
}
.quote-original-name { font-weight: 700; font-size: 0.82rem; color: var(--text, #f4efe8); margin-bottom: 0.3rem; }
.quote-original-text { font-size: 0.85rem; color: var(--text-muted, #a89e94); line-height: 1.5; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border, rgba(255,255,255,0.08)); display: flex; gap: 0.5rem; justify-content: flex-end; }
.btn {
padding: 0.75rem 1.5rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}
.btn-primary { background: var(--bordo, #8b2e3e); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--bordo-dark, #6b1f2e); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel { background: transparent; color: var(--text-muted, #a89e94); border: 1px solid var(--border, rgba(255,255,255,0.08)); }
.btn-cancel:hover { color: var(--bordo, #8b2e3e); border-color: var(--bordo, #8b2e3e); }

.loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted, #a89e94); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border, rgba(255,255,255,0.08)); border-top-color: var(--bordo, #8b2e3e); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.login-prompt {
background: var(--bordo-glow, rgba(139,46,62,0.25));
border: 1px solid var(--border-strong, rgba(255,255,255,0.15));
border-radius: 16px;
padding: 1.5rem;
text-align: center;
margin-bottom: 1.5rem;
}
.login-prompt a { color: var(--bordo, #8b2e3e); font-weight: 700; text-decoration: none; }
.toast {
position: fixed;
bottom: 100px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: var(--bordo, #8b2e3e);
color: #fff;
padding: 0.8rem 1.5rem;
border-radius: 60px;
font-weight: 600;
font-size: 0.9rem;
transition: transform 0.3s;
z-index: 9999;
max-width: 90%;
text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #e03131; }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
.post-card { padding: 1.1rem 1rem; }
.nav-home { font-size: 1.15rem; }
.nav-home .home-icon { width: 28px; height: 28px; }
.nav-home .home-icon svg { width: 15px; height: 15px; }
}
</style>
</head>

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk';
if (s < 86400) return Math.floor(s/3600) + ' sa';
if (s < 604800) return Math.floor(s/86400) + ' gün';
return d.toLocaleDateString('tr-TR');
}

function formatDate(dateStr) {
if (!dateStr) return '';
var d = new Date(dateStr);
var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function toast(msg, isError) {
var t = document.getElementById('toast');
t.textContent = msg;
t.className = 'toast show' + (isError ? ' error' : '');
setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// Avatars hazır olana kadar bekle
function waitForAvatars(cb) {
  if (window.renderAvatar) { cb(); return; }
  var count = 0;
  var iv = setInterval(function() {
    count++;
    if (window.renderAvatar || count > 40) { clearInterval(iv); cb(); }
  }, 50);
}

async function init() {
try {
var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;
if (session) {
currentUser = session.user;
var profRes = await supabaseClient.from('profiles').select('full_name, username, avatar, status, role').eq('id', currentUser.id).single();
if (profRes.data && profRes.data.status === 'approved') {
currentProfile = profRes.data;
var fRes = await supabaseClient.from('follows').select('following_id').eq('follower_id', currentUser.id);
followingIds = (fRes.data || []).map(function(f) { return f.following_id; });
var lRes = await supabaseClient.from('likes').select('post_id').eq('user_id', currentUser.id);
(lRes.data || []).forEach(function(l) { myLikes[l.post_id] = true; });
showLoggedInUI();
} else { document.getElementById('loginPrompt').style.display = 'block'; }
} else { document.getElementById('loginPrompt').style.display = 'block'; }
} catch (e) { console.error(e); document.getElementById('loginPrompt').style.display = 'block'; }
loadPosts();
}

else document.getElementById('tabFollowing').classList.add('active');

async function fetchProfiles(ids) {
var missing = ids.filter(function(id) { return !profileCache[id]; });
if (missing.length) {
var res = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', missing);
(res.data || []).forEach(function(p) { profileCache[p.id] = p; });
}
var map = {};
ids.forEach(function(id) { map[id] = profileCache[id] || { full_name: 'İsimsiz', username: 'kullanici', avatar: 'harf' }; });
return map;
}

async function loadPosts() {
var res = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false }).limit(50);
if (res.error) { document.getElementById('postsContainer').innerHTML = '<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>'; return; }
allPosts = res.data || [];
if (!allPosts.length) { document.getElementById('postsContainer').innerHTML = '<div class="empty">Henüz gönderi yok. İlk paylaşan sen ol!</div>'; return; }

var userIds = allPosts.map(function(p) { return p.user_id; });
var uniqueIds = userIds.filter(function(v, i, a) { return a.indexOf(v) === i; });
await fetchProfiles(uniqueIds);

var repostIds = allPosts.filter(function(p) { return p.repost_of; }).map(function(p) { return p.repost_of; });
window.repostCache = {};
if (repostIds.length) {
  var origRes = await supabaseClient.from('posts').select('*').in('id', repostIds);
  (origRes.data || []).forEach(function(p) { window.repostCache[p.id] = p; });
  var origUserIds = (origRes.data || []).map(function(p) { return p.user_id; });
  await fetchProfiles(origUserIds);
}

var bookIds = allPosts.filter(function(p) { return p.book_id; }).map(function(p) { return p.book_id; });
if (bookIds.length) {
var bookRes = await supabaseClient.from('books').select('id, cover_url, title, author').in('id', bookIds);
(bookRes.data || []).forEach(function(b) { bookCache[b.id] = b; });
}
renderPosts();
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 42);
  // Fallback (avatars.js yüklenmemişse)
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 42) + 'px;height:' + (size || 42) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo, #8b2e3e), var(--bordo-dark, #6b1f2e));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-weight:900;font-size:' + Math.round((size || 42) * 0.42) + 'px;">' + initial + '</div>';
}

var isOwner = currentUser && currentUser.id === post.user_id;

  return;
}

// QUOTE

window.toggleMenu = function(postId, e) {
e.stopPropagation();
var menu = document.getElementById('menu-' + postId);
var isOpen = menu.classList.contains('open');
document.querySelectorAll('.dropdown').forEach(function(m) { m.classList.remove('open'); });
if (!isOpen) menu.classList.add('open');
};
document.addEventListener('click', function() { document.querySelectorAll('.dropdown').forEach(function(m) { m.classList.remove('open'); }); });

window.deletePost = async function(postId) {
if (!confirm('Silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('posts').delete().eq('id', postId);
if (res.error) { toast('Silinemedi'); return; }
var card = document.querySelector('[data-post-id="' + postId + '"]');
if (card) card.remove();
toast('Silindi');
};

window.toggleLike = async function(postId, btn) {
if (!currentUser) { toast('Beğenmek için giriş yap'); return; }
var liked = btn.classList.contains('liked');
var countEl = btn.querySelector('.like-count');
var c = parseInt(countEl.textContent) || 0;
if (liked) {
btn.classList.remove('liked');
countEl.textContent = Math.max(0, c - 1);
delete myLikes[postId];
} else {
btn.classList.add('liked');
countEl.textContent = c + 1;
myLikes[postId] = true;
}
if (liked) await supabaseClient.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
else await supabaseClient.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
};

window.toggleComments = async function(postId, btn) {
var section = document.getElementById('comments-' + postId);
if (section.classList.contains('open')) { section.classList.remove('open'); return; }
section.classList.add('open');
section.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;padding:0.5rem;">Yükleniyor...</div>';
var res = await supabaseClient.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
var comments = res.data || [];
var ids = comments.map(function(c) { return c.user_id; });
var uniqueIds = ids.filter(function(v, i, a) { return a.indexOf(v) === i; });
var profileMap = await fetchProfiles(uniqueIds);
var card = document.querySelector('[data-post-id="' + postId + '"]');
var postOwnerId = card ? card.getAttribute('data-owner-id') : null;
var html = '';
comments.forEach(function(c) {
var author = profileMap[c.user_id] || { full_name: 'İsimsiz', avatar: 'harf' };
var canDelete = currentUser && (currentUser.id === c.user_id || currentUser.id === postOwnerId);
html += '<div class="comment" data-comment-id="' + c.id + '">';
html += getAvatar(author, 32);
html += '<div class="comment-body">';
html += '<a href="kullanici.html?id=' + c.user_id + '" class="comment-name">' + escapeHtml(author.full_name) + '</a>';
html += '<div class="comment-text">' + escapeHtml(c.content) + '</div>';
if (canDelete) html += '<button class="comment-delete" onclick="deleteComment(\'' + c.id + '\', \'' + postId + '\')">' + ICONS.x + '</button>';
html += '</div></div>';
});
if (currentUser) {
html += '<div class="comment-form">';
html += '<input type="text" class="comment-input" placeholder="Yorum yaz..." id="cinput-' + postId + '" maxlength="500">';
html += '<button class="comment-send" onclick="sendComment(\'' + postId + '\', this)">Gönder</button>';
html += '</div>';
} else {
html += '<div style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:0.5rem;">Yorum için <a href="giris.html" style="color:var(--bordo);">giriş yap</a></div>';
}
section.innerHTML = html;
};

window.sendComment = async function(postId, btn) {
var input = document.getElementById('cinput-' + postId);
var content = input.value.trim();
if (!content) return;
btn.disabled = true;
btn.textContent = '...';
var res = await supabaseClient.from('comments').insert([{ post_id: postId, user_id: currentUser.id, content: content }]);
btn.disabled = false;
btn.textContent = 'Gönder';
if (res.error) { toast('Hata'); return; }
input.value = '';
var card = document.querySelector('[data-post-id="' + postId + '"]');
var countEl = card.querySelector('.comment-count');
countEl.textContent = (parseInt(countEl.textContent) || 0) + 1;
var section = document.getElementById('comments-' + postId);
section.classList.remove('open');
await toggleComments(postId, btn);
};

window.deleteComment = async function(commentId, postId) {
if (!confirm('Yorumu silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('comments').delete().eq('id', commentId);
if (res.error) { toast('Silinemedi'); return; }
var card = document.querySelector('[data-post-id="' + postId + '"]');
var countEl = card.querySelector('.comment-count');
countEl.textContent = Math.max(0, (parseInt(countEl.textContent) || 1) - 1);
var section = document.getElementById('comments-' + postId);
section.classList.remove('open');
await toggleComments(postId, document.createElement('button'));
};

window.doRepost = async function(originalPostId, btn) {
if (!currentUser) { toast('Yeniden paylaşmak için giriş yap'); return; }
if (btn) btn.disabled = true;
var existing = await supabaseClient.from('posts').select('id').eq('user_id', currentUser.id).eq('repost_of', originalPostId).eq('is_repost', true).maybeSingle();
if (existing.data) {
var delRes = await supabaseClient.from('posts').delete().eq('id', existing.data.id);
if (delRes.error) { toast('Kaldırılamadı', true); if (btn) btn.disabled = false; return; }
toast('Yeniden paylaşım kaldırıldı');
if (btn) btn.classList.remove('reposted');
loadPosts();
return;
}
var origRes = await supabaseClient.from('posts').select('id, user_id').eq('id', originalPostId).single();
if (origRes.error || !origRes.data) { toast('Gönderi bulunamadı', true); if (btn) btn.disabled = false; return; }
if (origRes.data.user_id === currentUser.id) {
toast('Kendi gönderini yeniden paylaşamazsın', true);
if (btn) btn.disabled = false;
return;
}
var insRes = await supabaseClient.from('posts').insert([{ user_id: currentUser.id, content: null, is_repost: true, repost_of: originalPostId }]);
if (insRes.error) { toast('Hata: ' + insRes.error.message, true); if (btn) btn.disabled = false; return; }
toast('✅ Yeniden paylaşıldı');
loadPosts();
};

window.openQuoteModal = async function(postId) {
if (!currentUser) { toast('Giriş yapmalısın', true); return; }
var origRes = await supabaseClient.from('posts').select('*').eq('id', postId).single();
if (origRes.error || !origRes.data) { toast('Gönderi bulunamadı', true); return; }
var orig = origRes.data;
var origAuthor = profileCache[orig.user_id] || { full_name: 'İsimsiz' };
pendingQuotePost = orig;
document.getElementById('quoteOriginal').innerHTML = '<div class="quote-original-name">' + escapeHtml(origAuthor.full_name) + '</div><div class="quote-original-text">' + escapeHtml(orig.content || '') + '</div>';
document.getElementById('quoteComment').value = '';
document.getElementById('quoteModal').classList.add('open');
setTimeout(function() { document.getElementById('quoteComment').focus(); }, 100);
};

document.getElementById('quoteClose').addEventListener('click', function() { document.getElementById('quoteModal').classList.remove('open'); pendingQuotePost = null; });
document.getElementById('quoteCancel').addEventListener('click', function() { document.getElementById('quoteModal').classList.remove('open'); pendingQuotePost = null; });
document.getElementById('quoteModal').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('open'); pendingQuotePost = null; } });

document.getElementById('quoteSave').addEventListener('click', async function() {
if (!pendingQuotePost) return;
var comment = document.getElementById('quoteComment').value.trim();
var btn = this;
btn.disabled = true;
btn.textContent = 'Paylaşılıyor...';
var res = await supabaseClient.from('posts').insert([{ user_id: currentUser.id, content: comment || null, is_repost: false, repost_of: pendingQuotePost.id }]);
if (res.error) { toast('Hata: ' + res.error.message, true); btn.disabled = false; btn.textContent = 'Alıntıla'; return; }
document.getElementById('quoteModal').classList.remove('open');
pendingQuotePost = null;
btn.disabled = false;
btn.textContent = 'Alıntıla';
toast('✅ Alıntılandı');
loadPosts();
});

window.openDmModal = async function(postId) {
if (!currentUser) { toast('Giriş yapmalısın', true); return; }
var origRes = await supabaseClient.from('posts').select('*').eq('id', postId).single();
if (origRes.error || !origRes.data) { toast('Gönderi bulunamadı', true); return; }
pendingDmPost = origRes.data;
document.getElementById('dmBody').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);">Yükleniyor...</div>';
document.getElementById('dmModal').classList.add('open');
var usersRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').eq('status', 'approved').neq('id', currentUser.id).order('full_name', { ascending: true }).limit(100);
var users = usersRes.data || [];
if (!users.length) { document.getElementById('dmBody').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);">Kullanıcı bulunamadı.</div>'; return; }
var html = '';
users.forEach(function(u) {
html += '<button class="user-item" onclick="sendDm(\'' + u.id + '\')">' + getAvatar(u, 40) + '<div class="user-item-info"><div class="user-item-name">' + escapeHtml(u.full_name) + '</div><div class="user-item-username">@' + escapeHtml(u.username) + '</div></div></button>';
});
document.getElementById('dmBody').innerHTML = html;
};

window.sendDm = async function(receiverId) {
if (!pendingDmPost) return;
var postUrl = window.location.origin + '/gonderi-detay.html?id=' + pendingDmPost.id;
var content = '📎 Bir gönderi paylaştı:\n\n"' + (pendingDmPost.content || '').substring(0, 100) + (pendingDmPost.content && pendingDmPost.content.length > 100 ? '...' : '') + '"\n\n' + postUrl;
var res = await supabaseClient.from('messages').insert([{ sender_id: currentUser.id, receiver_id: receiverId, content: content, post_id: pendingDmPost.id }]);
if (res.error) { toast('Hata: ' + res.error.message, true); return; }
document.getElementById('dmModal').classList.remove('open');
pendingDmPost = null;
toast('✅ Gönderi paylaşıldı');
};

document.getElementById('dmClose').addEventListener('click', function() { document.getElementById('dmModal').classList.remove('open'); pendingDmPost = null; });
document.getElementById('dmModal').addEventListener('click', function(e) { if (e.target === this) { this.classList.remove('open'); pendingDmPost = null; } });

init();
})();
</script>
