<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kitap Talepleri • Katran</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
padding: 2rem 1rem;
}
.container { max-width: 800px; margin: 0 auto; }
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2rem;
flex-wrap: wrap;
gap: 1rem;
}
h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; }
h1 .red { color: #e03131; }
.back-link { color: #a89e94; text-decoration: none; font-size: 0.9rem; padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; }
.back-link:hover { color: #e03131; border-color: #e03131; }
.tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; }
.tab {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
padding: 0.5rem 1.2rem;
border-radius: 60px;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
font-family: inherit;
}
.tab.active { background: #e03131; color: #f4efe8; border-color: #e03131; }
.request-card {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1.2rem;
margin-bottom: 0.8rem;
}
.request-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
gap: 1rem;
margin-bottom: 0.6rem;
flex-wrap: wrap;
}
.request-title { font-weight: 700; font-size: 1rem; }
.request-author { color: #a89e94; font-size: 0.85rem; }
.request-note {
color: #a89e94;
font-size: 0.85rem;
background: rgba(0,0,0,0.2);
padding: 0.6rem 0.9rem;
border-radius: 8px;
border-left: 2px solid #e03131;
margin-top: 0.5rem;
line-height: 1.5;
}
.request-meta { font-size: 0.75rem; color: #7a7068; margin-top: 0.5rem; }
.request-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
.btn {
padding: 0.5rem 1.2rem;
border: none;
border-radius: 60px;
font-weight: 700;
font-size: 0.8rem;
cursor: pointer;
font-family: inherit;
}
.btn-approve { background: #2e7d32; color: #fff; }
.btn-approve:hover { background: #1b5e20; }
.btn-reject { background: transparent; color: #ff8a8a; border: 1px solid rgba(224,49,49,0.4); }
.btn-reject:hover { background: rgba(224,49,49,0.15); }
.status-badge {
display: inline-block;
padding: 0.25rem 0.7rem;
border-radius: 40px;
font-size: 0.7rem;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.05em;
}
.status-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
.status-approved { background: rgba(76,175,80,0.15); color: #81c784; }
.status-rejected { background: rgba(224,49,49,0.15); color: #ff8a8a; }
.loading, .empty { text-align: center; padding: 3rem; color: #a89e94; }
.empty .flower { font-size: 2.5rem; color: #e03131; display: block; margin-bottom: 1rem; }
.error-msg {
background: rgba(224,49,49,0.15);
border: 1px solid rgba(224,49,49,0.4);
color: #ff8a8a;
padding: 1rem;
border-radius: 10px;
text-align: center;
margin-bottom: 1rem;
}
</style>
</head>
<body>

<div class="container">
<div id="loadingState" class="loading">Yükleniyor...</div>

<div id="errorState" style="display:none;">
<div class="error-msg" id="errorMsg"></div>
<a href="index.html" class="back-link">← Ana Sayfa</a>
</div>

<div id="content" style="display:none;">
<div class="top-bar">
<h1><span class="red">Kitap</span> Talepleri</h1>
<a href="index.html" class="back-link">← Ana Sayfa</a>
</div>

<div class="tabs">
<button class="tab active" data-tab="pending">Bekleyen</button>
<button class="tab" data-tab="approved">Onaylı</button>
<button class="tab" data-tab="rejected">Reddedilen</button>
</div>

<div id="listContainer"><div class="loading">Yükleniyor...</div></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var allRequests = [];
var activeTab = 'pending';
var currentUser = null;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
return Math.floor(s/86400) + ' gün önce';
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

// Admin kontrolü
var profRes = await supabaseClient.from('profiles').select('role').eq('id', currentUser.id).single();
if (!profRes.data || profRes.data.role !== 'admin') {
document.getElementById('loadingState').style.display = 'none';
document.getElementById('errorState').style.display = 'block';
document.getElementById('errorMsg').textContent = 'Bu sayfaya erişim yetkiniz yok.';
return;
}

await loadRequests();
document.getElementById('loadingState').style.display = 'none';
document.getElementById('content').style.display = 'block';

document.querySelectorAll('.tab').forEach(function(t) {
t.addEventListener('click', function() {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeTab = this.getAttribute('data-tab');
render();
});
})();

async function loadRequests() {
var res = await supabaseClient
.from('book_requests')
.select('*')
.order('created_at', { ascending: false });

if (res.error) {
document.getElementById('listContainer').innerHTML = '<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}
allRequests = res.data || [];
render();
}

function render() {
var filtered = allRequests.filter(function(r) { return r.status === activeTab; });
var container = document.getElementById('listContainer');

if (!filtered.length) {
container.innerHTML = '<div class="empty"><span class="flower">❀</span>Bu bölümde talep yok.</div>';
return;
}

var html = '';
filtered.forEach(function(r) {
var badgeClass = 'status-' + r.status;
var badgeText = r.status === 'pending' ? 'Bekliyor' : r.status === 'approved' ? 'Onaylandı' : 'Reddedildi';

html += '<div class="request-card">';
html += '<div class="request-header">';
html += '<div>';
html += '<div class="request-title">' + escapeHtml(r.title) + '</div>';
if (r.author) html += '<div class="request-author">' + escapeHtml(r.author) + '</div>';
html += '</div>';
html += '<span class="status-badge ' + badgeClass + '">' + badgeText + '</span>';
html += '</div>';
if (r.note) html += '<div class="request-note">' + escapeHtml(r.note) + '</div>';
html += '<div class="request-meta">' + timeAgo(r.created_at) + '</div>';

if (r.status === 'pending') {
html += '<div class="request-actions">';
html += '<button class="btn btn-approve" onclick="setStatus(\'' + r.id + '\', \'approved\')">✓ Onayla</button>';
html += '<button class="btn btn-reject" onclick="setStatus(\'' + r.id + '\', \'rejected\')">✕ Reddet</button>';
html += '</div>';
}
html += '</div>';
});
container.innerHTML = html;
}

window.setStatus = async function(id, status) {
var res = await supabaseClient
.from('book_requests')
.update({ status: status, reviewed_at: new Date().toISOString(), reviewed_by: currentUser.id })
.eq('id', id);

if (res.error) { alert('Hata: ' + res.error.message); return; }
await loadRequests();
};
})();
</script>
</body>
</html>
