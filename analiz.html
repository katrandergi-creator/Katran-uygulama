<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<script>
(function() {
  try {
    var t = localStorage.getItem('katran-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Analiz Yaz • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg, #0a0808);
color: var(--text, #f4efe8);
min-height: 100vh;
padding: 1.5rem 1rem 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.container { max-width: 700px; margin: 0 auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.back-link {
color: var(--text-muted, #a89e94);
text-decoration: none;
font-size: 0.85rem;
padding: 0.4rem 0.9rem;
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 60px;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
background: var(--bg-elev, rgba(255,255,255,0.03));
}
.back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.back-link:hover { color: var(--bordo, #8b2e3e); border-color: var(--bordo, #8b2e3e); }
h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--text, #f4efe8); }
h1 .red { color: var(--bordo, #8b2e3e); }

.book-preview-card {
background: linear-gradient(135deg, var(--bordo-glow, rgba(139,46,62,0.1)), var(--bg-elev, rgba(255,255,255,0.03)));
border: 1px solid var(--bordo, #8b2e3e);
border-radius: 16px;
padding: 1rem;
margin-bottom: 1.2rem;
display: flex;
gap: 1rem;
align-items: center;
}
.book-preview-cover {
width: 60px;
height: 90px;
border-radius: 4px 6px 6px 4px;
object-fit: cover;
flex-shrink: 0;
box-shadow: 0 4px 12px -3px rgba(0,0,0,0.4);
}
.book-preview-placeholder {
width: 60px;
height: 90px;
border-radius: 4px 6px 6px 4px;
background: linear-gradient(135deg, var(--bordo, #8b2e3e), var(--bordo-dark, #6b1f2e));
display: flex;
align-items: center;
justify-content: center;
color: #fff;
font-family: 'Playfair Display', serif;
font-size: 1.5rem;
font-weight: 900;
flex-shrink: 0;
}
.book-preview-info { flex: 1; min-width: 0; }
.book-preview-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; color: var(--text, #f4efe8); margin-bottom: 0.15rem; line-height: 1.3; }
.book-preview-author { color: var(--text-muted, #a89e94); font-size: 0.85rem; }

.card {
background: var(--bg-elev, rgba(255,255,255,0.03));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 20px;
padding: 1.5rem;
margin-bottom: 1rem;
}
.field { margin-bottom: 1.2rem; }
.field:last-child { margin-bottom: 0; }
.field label {
display: block;
font-size: 0.8rem;
color: var(--text-muted, #a89e94);
margin-bottom: 0.5rem;
font-weight: 600;
}
.field label .required { color: var(--bordo, #8b2e3e); }
.field input,
.field textarea {
width: 100%;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 12px;
padding: 0.8rem 1rem;
color: var(--text, #f4efe8);
font-family: inherit;
font-size: 0.95rem;
transition: all 0.2s;
}
.field input::placeholder,
.field textarea::placeholder { color: var(--text-dim, #7a7068); }
.field input:focus,
.field textarea:focus { outline: none; border-color: var(--bordo, #8b2e3e); background: var(--bordo-glow, rgba(139,46,62,0.15)); }
.field textarea {
min-height: 250px;
resize: vertical;
line-height: 1.8;
font-size: 0.95rem;
}
.char-count { text-align: right; color: var(--text-dim, #7a7068); font-size: 0.72rem; margin-top: 0.3rem; }
.field-hint { font-size: 0.75rem; color: var(--text-dim, #7a7068); margin-top: 0.3rem; font-style: italic; }

.info-box {
background: var(--bordo-glow, rgba(139,46,62,0.15));
border-left: 3px solid var(--bordo, #8b2e3e);
border-radius: 8px;
padding: 0.8rem 1rem;
margin-bottom: 1.2rem;
font-size: 0.85rem;
color: var(--text-muted, #a89e94);
line-height: 1.5;
}
.info-box strong { color: var(--bordo, #8b2e3e); }

.btn-row { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.2rem; }
.btn {
padding: 0.75rem 1.5rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}
.btn-primary { background: var(--bordo, #8b2e3e); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--bordo-dark, #6b1f2e); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel {
background: transparent;
color: var(--text-muted, #a89e94);
border: 1px solid var(--border, rgba(255,255,255,0.08));
}
.btn-cancel:hover { color: var(--bordo, #8b2e3e); border-color: var(--bordo, #8b2e3e); }

.message {
padding: 1rem;
border-radius: 10px;
margin-bottom: 1.2rem;
display: none;
font-size: 0.9rem;
}
.message.error {
background: rgba(224,49,49,0.15);
border: 1px solid rgba(224,49,49,0.4);
color: #ff8a8a;
display: block;
}
.message.success {
background: rgba(76,175,80,0.1);
border: 1px solid rgba(76,175,80,0.3);
color: #a5d6a7;
display: block;
}

.loading { text-align: center; padding: 3rem; color: var(--text-muted, #a89e94); }
.spinner {
width: 32px;
height: 32px;
border: 3px solid var(--border, rgba(255,255,255,0.08));
border-top-color: var(--bordo, #8b2e3e);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 520px) {
h1 { font-size: 1.3rem; }
.card { padding: 1.2rem 1rem; }
.field textarea { min-height: 200px; }
}
</style>
</head>
<body>

<div class="container">
<div class="top-bar">
<a href="kitap.html" class="back-link" id="backLink">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Geri
</a>
<h1><span class="red">Analiz</span> Yaz</h1>
</div>

<div id="loadingState" class="loading"><div class="spinner"></div>Yükleniyor...</div>

<div id="formContent" style="display:none;">
<div class="book-preview-card" id="bookPreview"></div>

<div class="info-box">
📝 Kitap hakkındaki düşüncelerini, eleştirini veya analizini yaz. En az <strong>200 karakter</strong> olmalı. Bu yazı akışta paylaşılacak.
</div>

<div class="message" id="message"></div>

<div class="card">
<div class="field">
<label for="analysisTitle">Başlık <span class="required">*</span></label>
<input type="text" id="analysisTitle" maxlength="100" placeholder="Örn: Bir modern klasik üzerine düşünceler">
<div class="char-count" id="titleCount">0 / 100</div>
</div>

<div class="field">
<label for="analysisContent">Analiz <span class="required">*</span></label>
<textarea id="analysisContent" maxlength="5000" placeholder="Kitap hakkında ne düşünüyorsun? Karakterler, tema, anlatım, üslup... Her şeyden bahsedebilirsin."></textarea>
<div class="char-count" id="contentCount">0 / 5000</div>
<div class="field-hint">Min. 200 karakter.</div>
</div>
</div>

<div class="btn-row">
<button class="btn btn-cancel" onclick="history.back()">İptal</button>
<button class="btn btn-primary" id="submitBtn">Analizi Paylaş</button>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var bookId = null;
var bookData = null;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showMsg(msg, type) {
var m = document.getElementById('message');
m.className = 'message ' + type;
m.textContent = msg;
}

(async function init() {
var urlParams = new URLSearchParams(window.location.search);
bookId = urlParams.get('book') || urlParams.get('id');

if (!bookId) {
document.getElementById('loadingState').innerHTML = '<div style="color:#ff8a8a;">Kitap belirtilmedi.</div>';
return;
}

var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;

var profRes = await supabaseClient.from('profiles').select('status').eq('id', currentUser.id).single();
if (!profRes.data || profRes.data.status !== 'approved') { window.location.href = 'giris.html'; return; }

var bookRes = await supabaseClient.from('books').select('*').eq('id', bookId).single();
if (bookRes.error || !bookRes.data) {
document.getElementById('loadingState').innerHTML = '<div style="color:#ff8a8a;">Kitap bulunamadı.</div>';
return;
}
bookData = bookRes.data;

// Kitap önizleme
var cover = bookData.cover_url
  ? '<img class="book-preview-cover" src="' + escapeHtml(bookData.cover_url) + '" alt="">'
  : '<div class="book-preview-placeholder">' + escapeHtml((bookData.title || '?').charAt(0).toUpperCase()) + '</div>';

document.getElementById('bookPreview').innerHTML =
  cover +
  '<div class="book-preview-info">' +
    '<div class="book-preview-title">' + escapeHtml(bookData.title) + '</div>' +
    '<div class="book-preview-author">' + escapeHtml(bookData.author || 'Bilinmeyen') + '</div>' +
  '</div>';

document.getElementById('backLink').href = 'kitap.html?id=' + bookId;

document.getElementById('loadingState').style.display = 'none';
document.getElementById('formContent').style.display = 'block';

// Sayaçlar
document.getElementById('analysisTitle').addEventListener('input', function() {
  document.getElementById('titleCount').textContent = this.value.length + ' / 100';
});
document.getElementById('analysisContent').addEventListener('input', function() {
  document.getElementById('contentCount').textContent = this.value.length + ' / 5000';
});

document.getElementById('submitBtn').addEventListener('click', submitAnalysis);
})();

async function submitAnalysis() {
  var title = document.getElementById('analysisTitle').value.trim();
  var content = document.getElementById('analysisContent').value.trim();
  
  if (!title) { showMsg('Başlık gerekli.', 'error'); return; }
  if (!content) { showMsg('Analiz metni gerekli.', 'error'); return; }
  if (content.length < 200) { showMsg('Analiz en az 200 karakter olmalı.', 'error'); return; }
  
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Paylaşılıyor...';
  
  var res = await supabaseClient.from('posts').insert([{
    user_id: currentUser.id,
    type: 'analysis',
    content: content,
    analysis_title: title,
    quote_author: bookData.author || 'Bilinmeyen',
    quote_book: bookData.title || '',
    book_id: bookId
  }]);
  
  if (res.error) {
    showMsg('Hata: ' + res.error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Analizi Paylaş';
    return;
  }
  
  showMsg('Analizin paylaşıldı! Akışa yönlendiriliyorsun...', 'success');
  setTimeout(function() { window.location.href = 'akis.html'; }, 1200);
}
})();
</script>
</body>
</html>
