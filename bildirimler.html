<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<script>
(function() {
  try {
    var t = localStorage.getItem('katran-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bildirimler • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding-bottom: 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.top-nav {
position: sticky;
top: 0;
background: var(--nav-bg);
backdrop-filter: blur(24px);
border-bottom: 1px solid var(--border);
z-index: 100;
padding: 0.85rem 0;
}
.nav-inner { max-width: 600px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 900; text-decoration: none; color: var(--text); }
.nav-logo .red { color: var(--bordo); }
.nav-btn {
background: transparent;
color: var(--text-muted);
border: 1px solid var(--border);
padding: 0.5rem 0.9rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
font-family: inherit;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }
.container { max-width: 600px; margin: 0 auto; padding: 1.2rem 1rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 1rem; color: var(--text); }
h1 .red { color: var(--bordo); }
.tabs { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
.tab {
background: transparent;
color: var(--text-muted);
border: none;
padding: 0.55rem 1rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
}
.tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { background: var(--bordo-glow); color: var(--bordo); }
.tab:hover:not(.active) { color: var(--text); background: var(--bg-elev); }
.tab-badge { background: var(--accent); color: #fff; font-size: 0.62rem; padding: 1px 6px; border-radius: 20px; font-weight: 700; min-width: 18px; text-align: center; }
.mark-all-btn {
background: transparent;
color: var(--text-muted);
border: 1px solid var(--border);
padding: 0.5rem 1rem;
border-radius: 60px;
font-size: 0.8rem;
cursor: pointer;
margin-bottom: 1.2rem;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
}
.mark-all-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mark-all-btn:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }
.mark-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.notif {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 16px;
padding: 1rem 1.1rem;
margin-bottom: 0.6rem;
display: flex;
gap: 0.8rem;
align-items: flex-start;
cursor: pointer;
transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
text-decoration: none;
color: inherit;
}
.notif:hover { border-color: var(--bordo); background: var(--bordo-glow); transform: translateX(4px); }
.notif.unread { background: var(--bordo-glow); border-color: var(--bordo); }
.notif-body { flex: 1; min-width: 0; }
.notif-text { font-size: 0.9rem; line-height: 1.5; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
.notif-text strong { color: var(--text); font-weight: 700; }
.notif-icon { display: inline-flex; align-items: center; color: var(--bordo); }
.notif-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.notif-icon.filled svg { fill: currentColor; }
.notif-time { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 0.5rem; }
.loading, .empty { text-align: center; padding: 4rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.3rem; }
.notif { padding: 0.9rem 1rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="akis.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Akış
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Bildirimler</span></h1>
<div class="tabs">
<button class="tab active" data-tab="all" id="tabAll">
<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
Tümü
<span class="tab-badge" id="badgeAll" style="display:none;">0</span>
</button>
<button class="tab" data-tab="unread" id="tabUnread">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
Okunmamış
<span class="tab-badge" id="badgeUnread" style="display:none;">0</span>
</button>
</div>
<button class="mark-all-btn" id="markAllBtn" style="display:none;">
<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
Hepsini okundu işaretle
</button>
<div id="listContainer">
<div class="loading"><div class="spinner"></div>Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>
<script src="avatares.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var profileCache = {};
var allNotifs = [];
var currentTab = 'all';

var ICONS = {
heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
comment: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
userPlus: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>',
book: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
repost: '<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>'
};

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
if (s < 604800) return Math.floor(s/86400) + ' gün önce';
return d.toLocaleDateString('tr-TR');
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 42);
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 42) + 'px;height:' + (size || 42) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo), var(--bordo-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:' + Math.round((size || 42) * 0.42) + 'px;">' + initial + '</div>';
}

async function fetchProfiles(ids) {
var missing = ids.filter(function(id) { return !profileCache[id]; });
if (missing.length) {
var res = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', missing);
(res.data || []).forEach(function(p) { profileCache[p.id] = p; });
}
var map = {};
ids.forEach(function(id) { map[id] = profileCache[id] || { full_name: 'Birisi', username: 'kullanici', avatar: 'harf' }; });
return map;
}

async function load() {
var sessionRes = await supabaseClient.auth.getSession();
currentUser = sessionRes.data.session ? sessionRes.data.session.user : null;
if (!currentUser) { window.location.href = 'giris.html'; return; }

var res = await supabaseClient
.from('notifications')
.select('*')
.eq('user_id', currentUser.id)
.order('created_at', { ascending: false })
.limit(100);

if (res.error) {
document.getElementById('listContainer').innerHTML = '<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

allNotifs = res.data || [];
if (!allNotifs.length) {
document.getElementById('listContainer').innerHTML = '<div class="empty">Henüz bildirim yok.</div>';
return;
}

var actorIds = allNotifs.map(function(n) { return n.actor_id; }).filter(Boolean);
var unique = actorIds.filter(function(v, i, a) { return a.indexOf(v) === i; });
await fetchProfiles(unique);

updateBadges();
render();

document.getElementById('tabAll').addEventListener('click', function() { switchTab('all'); });
document.getElementById('tabUnread').addEventListener('click', function() { switchTab('unread'); });
}

function updateBadges() {
var unreadCount = allNotifs.filter(function(n) { return !n.is_read; }).length;
var badgeUnread = document.getElementById('badgeUnread');
if (unreadCount > 0) {
badgeUnread.textContent = unreadCount > 99 ? '99+' : unreadCount;
badgeUnread.style.display = 'inline-block';
} else {
badgeUnread.style.display = 'none';
}
var btn = document.getElementById('markAllBtn');
if (unreadCount > 0) btn.style.display = 'inline-flex';
else btn.style.display = 'none';
}

function switchTab(tab) {
currentTab = tab;
document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
if (tab === 'all') document.getElementById('tabAll').classList.add('active');
else document.getElementById('tabUnread').classList.add('active');
render();
}

function render() {
var container = document.getElementById('listContainer');
var notifs = currentTab === 'unread' ? allNotifs.filter(function(n) { return !n.is_read; }) : allNotifs;

if (!notifs.length) {
container.innerHTML = '<div class="empty">' + (currentTab === 'unread' ? 'Okunmamış bildirim yok.' : 'Henüz bildirim yok.') + '</div>';
return;
}

var html = '';
notifs.forEach(function(n) {
var actor = profileCache[n.actor_id] || { full_name: 'Birisi', username: 'kullanici', avatar: 'harf' };
var text = '';
var link = 'akis.html?post=' + (n.post_id || '');

if (n.type === 'like') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderini beğendi <span class="notif-icon filled">' + ICONS.heart + '</span>';
} else if (n.type === 'comment') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderine yorum yaptı <span class="notif-icon">' + ICONS.comment + '</span>';
} else if (n.type === 'follow') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> seni takip etmeye başladı <span class="notif-icon">' + ICONS.userPlus + '</span>';
link = 'kullanici.html?id=' + n.actor_id;
} else if (n.type === 'book_request') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> kitap talep etti <span class="notif-icon">' + ICONS.book + '</span>';
link = 'admin-talepler.html';
} else if (n.type === 'repost') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderini yeniden paylaştı <span class="notif-icon">' + ICONS.repost + '</span>';
} else if (n.type === 'quote') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderini alıntıladı <span class="notif-icon">' + ICONS.comment + '</span>';
}

var unreadClass = n.is_read ? '' : ' unread';
var dot = n.is_read ? '' : '<div class="notif-dot"></div>';

html += '<a class="notif' + unreadClass + '" href="' + link + '" data-notif-id="' + n.id + '">';
html += getAvatar(actor, 42);
html += '<div class="notif-body">';
html += '<div class="notif-text">' + text + '</div>';
html += '<div class="notif-time">' + timeAgo(n.created_at) + '</div>';
html += '</div>';
html += dot;
html += '</a>';
});

container.innerHTML = html;

container.querySelectorAll('.notif').forEach(function(el) {
el.addEventListener('click', async function() {
var id = el.getAttribute('data-notif-id');
await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
});
});
}

document.getElementById('markAllBtn').addEventListener('click', async function() {
this.disabled = true;
this.textContent = 'İşaretleniyor...';
await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
location.reload();
});

load();
})();
</script>
</body>
</html>
