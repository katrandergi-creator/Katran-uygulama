<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bildirimler • Katran Dergi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
padding-bottom: 4rem;
}
.top-nav {
position: sticky;
top: 0;
background: rgba(10,8,8,0.9);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.06);
padding: 1rem 0;
z-index: 100;
}
.nav-inner {
max-width: 600px;
margin: 0 auto;
padding: 0 1rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
text-decoration: none;
color: #f4efe8;
}
.nav-logo .red { color: #e03131; }
.nav-btn {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
padding: 0.5rem 0.9rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
font-family: inherit;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { color: #e03131; border-color: #e03131; }
.container {
max-width: 600px;
margin: 0 auto;
padding: 1.5rem 1rem;
}
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
margin-bottom: 1rem;
}
h1 .red { color: #e03131; }
.mark-read-btn {
background: transparent;
color: #a89e94;
border: 1px solid rgba(255,255,255,0.1);
padding: 0.5rem 1rem;
border-radius: 60px;
font-size: 0.8rem;
cursor: pointer;
margin-bottom: 1.5rem;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
}
.mark-read-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mark-read-btn:hover { color: #e03131; border-color: #e03131; }
.mark-read-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.notif {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1rem 1.2rem;
margin-bottom: 0.7rem;
display: flex;
gap: 0.8rem;
align-items: flex-start;
cursor: pointer;
transition: all 0.2s;
text-decoration: none;
color: inherit;
}
.notif:hover { border-color: rgba(224,49,49,0.3); }
.notif.unread {
background: rgba(224,49,49,0.06);
border-color: rgba(224,49,49,0.2);
}
.notif-avatar {
width: 40px;
height: 40px;
border-radius: 50%;
background: linear-gradient(135deg, #e03131, #b71c1c);
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
color: #f4efe8;
flex-shrink: 0;
font-size: 0.95rem;
}
.notif-body { flex: 1; min-width: 0; }
.notif-text {
font-size: 0.9rem;
line-height: 1.5;
color: #e8e0d6;
display: flex;
align-items: center;
gap: 0.4rem;
flex-wrap: wrap;
}
.notif-text strong { color: #f4efe8; font-weight: 700; }
.notif-icon {
display: inline-flex;
align-items: center;
color: #e03131;
}
.notif-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.notif-icon.filled svg { fill: currentColor; }
.notif-time {
font-size: 0.75rem;
color: #7a7068;
margin-top: 0.3rem;
}
.notif-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: #e03131;
flex-shrink: 0;
margin-top: 0.5rem;
}
.loading, .empty {
text-align: center;
padding: 4rem 1rem;
color: #a89e94;
}
.empty .flower {
font-size: 3rem;
color: #e03131;
display: block;
margin-bottom: 1rem;
}
@media (max-width: 520px) {
h1 { font-size: 1.5rem; }
.notif { padding: 0.9rem 1rem; }
.notif-avatar { width: 36px; height: 36px; font-size: 0.85rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="akis.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Akış
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Bildirimler</span></h1>
<button class="mark-read-btn" id="markAllBtn" style="display:none;">
<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
Hepsini okundu işaretle
</button>
<div id="listContainer">
<div class="loading">Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var profileCache = {};

// ---------- İKONLAR ----------
var ICONS = {
heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
comment: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
book: '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
userPlus: '<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>'
};

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var now = new Date();
var s = Math.floor((now - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
if (s < 604800) return Math.floor(s/86400) + ' gün önce';
return d.toLocaleDateString('tr-TR');
}

async function fetchProfiles(ids) {
var missing = ids.filter(function(id) { return !profileCache[id]; });
if (missing.length) {
var res = await supabaseClient.from('profiles').select('id, full_name, username').in('id', missing);
(res.data || []).forEach(function(p) { profileCache[p.id] = p; });
}
var map = {};
ids.forEach(function(id) {
map[id] = profileCache[id] || { full_name: 'Birisi', username: 'kullanici' };
});
return map;
}

async function load() {
var sessionRes = await supabaseClient.auth.getSession();
currentUser = sessionRes.data.session ? sessionRes.data.session.user : null;

if (!currentUser) {
window.location.href = 'giris.html';
return;
}

var res = await supabaseClient
.from('notifications')
.select('*')
.eq('user_id', currentUser.id)
.order('created_at', { ascending: false })
.limit(100);

if (res.error) {
document.getElementById('listContainer').innerHTML =
'<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var notifs = res.data || [];

if (!notifs.length) {
document.getElementById('listContainer').innerHTML =
'<div class="empty"><span class="flower">❀</span>Henüz bildirim yok.</div>';
return;
}

var actorIds = notifs.map(function(n) { return n.actor_id; }).filter(Boolean);
var unique = actorIds.filter(function(v, i, a) { return a.indexOf(v) === i; });
var profileMap = await fetchProfiles(unique);

var hasUnread = notifs.some(function(n) { return !n.is_read; });
if (hasUnread) document.getElementById('markAllBtn').style.display = 'inline-flex';

var html = '';
notifs.forEach(function(n) {
var actor = profileMap[n.actor_id] || { full_name: 'Birisi', username: 'kullanici' };
var initial = (actor.full_name || 'B').charAt(0).toUpperCase();
var text = '';
var link = 'akis.html?post=' + (n.post_id || '');
var iconClass = '';

if (n.type === 'like') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderini beğendi <span class="notif-icon filled">' + ICONS.heart + '</span>';
link = 'akis.html?post=' + (n.post_id || '');
} else if (n.type === 'comment') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> gönderine yorum yaptı <span class="notif-icon">' + ICONS.comment + '</span>';
link = 'akis.html?post=' + (n.post_id || '');
} else if (n.type === 'book_request') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> kitap talep etti <span class="notif-icon">' + ICONS.book + '</span>';
link = 'admin-talepler.html';
} else if (n.type === 'follow') {
text = '<strong>' + escapeHtml(actor.full_name) + '</strong> seni takip etmeye başladı <span class="notif-icon">' + ICONS.userPlus + '</span>';
link = 'kullanici.html?id=' + n.actor_id;
}

var unreadClass = n.is_read ? '' : ' unread';
var dot = n.is_read ? '' : '<div class="notif-dot"></div>';

html += '<a class="notif' + unreadClass + '" href="' + link + '" data-notif-id="' + n.id + '">';
html += '<div class="notif-avatar">' + initial + '</div>';
html += '<div class="notif-body">';
html += '<div class="notif-text">' + text + '</div>';
html += '<div class="notif-time">' + timeAgo(n.created_at) + '</div>';
html += '</div>';
html += dot;
html += '</a>';
});

document.getElementById('listContainer').innerHTML = html;

document.querySelectorAll('.notif').forEach(function(el) {
el.addEventListener('click', async function() {
var id = el.getAttribute('data-notif-id');
await supabaseClient.from('notifications').update({ is_read: true }).eq('id', id);
});
});
}

document.getElementById('markAllBtn').addEventListener('click', async function() {
this.disabled = true;
this.textContent = 'İşaretleniyor...';
await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id).eq('is_read', false);
location.reload();
});

load();
})();
</script>
</body>
</html>
