<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kitaplığım • Katran Dergi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
padding-bottom: 4rem;
}
.top-nav {
position: sticky;
top: 0;
background: rgba(10,8,8,0.9);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.06);
padding: 1rem 0;
z-index: 100;
}
.nav-inner {
max-width: 900px;
margin: 0 auto;
padding: 0 1rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
text-decoration: none;
color: #f4efe8;
}
.nav-logo .red { color: #e03131; }
.nav-btn {
background: #e03131;
color: #f4efe8;
border: none;
padding: 0.5rem 1rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
font-weight: 700;
font-family: inherit;
display: flex;
align-items: center;
gap: 0.4rem;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
margin-bottom: 1.5rem;
}
h1 .red { color: #e03131; }
.stats-row {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 0.8rem;
margin-bottom: 2rem;
}
.stat-box {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1.2rem 0.5rem;
text-align: center;
}
.stat-box .number {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
color: #e03131;
display: block;
}
.stat-box .label {
font-size: 0.7rem;
color: #a89e94;
text-transform: uppercase;
letter-spacing: 0.1em;
margin-top: 0.3rem;
}
.tabs {
display: flex;
gap: 0.4rem;
margin-bottom: 1.5rem;
border-bottom: 1px solid rgba(255,255,255,0.06);
padding-bottom: 0.5rem;
overflow-x: auto;
}
.tab {
background: transparent;
color: #a89e94;
border: none;
padding: 0.6rem 1.2rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
white-space: nowrap;
display: inline-flex;
align-items: center;
gap: 0.4rem;
}
.tab svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { background: rgba(224,49,49,0.15); color: #e03131; }
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
gap: 1rem;
}
.book-item { text-decoration: none; color: inherit; }
.book-cover {
width: 100%;
aspect-ratio: 2/3;
border-radius: 8px;
background: rgba(255,255,255,0.05);
object-fit: cover;
margin-bottom: 0.5rem;
border: 1px solid rgba(255,255,255,0.06);
transition: all 0.2s;
}
.book-item:hover .book-cover { transform: translateY(-4px); border-color: #e03131; }
.book-cover-placeholder {
width: 100%;
aspect-ratio: 2/3;
border-radius: 8px;
background: linear-gradient(135deg, #2a1a1a, #1a0a0a);
display: flex;
align-items: center;
justify-content: center;
color: #e03131;
margin-bottom: 0.5rem;
border: 1px solid rgba(255,255,255,0.06);
}
.book-cover-placeholder svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.book-title {
font-size: 0.8rem;
font-weight: 600;
line-height: 1.3;
margin-bottom: 0.2rem;
}
.book-author { font-size: 0.7rem; color: #a89e94; }
.loading, .empty {
text-align: center;
padding: 3rem 1rem;
color: #a89e94;
grid-column: 1 / -1;
}
.empty .flower { font-size: 2.5rem; color: #e03131; display: block; margin-bottom: 1rem; }
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="kitaplar.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
Kitap Ekle
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Kitaplığım</span></h1>

<div class="stats-row">
<div class="stat-box">
<span class="number" id="statRead">0</span>
<span class="label">Okudum</span>
</div>
<div class="stat-box">
<span class="number" id="statReading">0</span>
<span class="label">Okuyorum</span>
</div>
<div class="stat-box">
<span class="number" id="statWant">0</span>
<span class="label">Okuyacağım</span>
</div>
</div>

<div class="tabs">
<button class="tab active" data-tab="read">
<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
Okudum
</button>
<button class="tab" data-tab="reading">
<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
Okuyorum
</button>
<button class="tab" data-tab="want">
<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
Okuyacağım
</button>
</div>

<div class="grid" id="gridContainer">
<div class="loading">Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var allBooks = { read: [], reading: [], want: [] };
var activeTab = 'read';

var BOOK_ICON = '<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) {
window.location.href = 'giris.html';
return;
}
currentUser = sessionRes.data.session.user;
await loadBooks();

document.querySelectorAll('.tab').forEach(function(t) {
t.addEventListener('click', function() {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeTab = this.getAttribute('data-tab');
render();
});
});
})();

async function loadBooks() {
var res = await supabaseClient
.from('user_books')
.select('status, book_id, books(id, title, author, cover_url)')
.eq('user_id', currentUser.id);

if (res.error) {
document.getElementById('gridContainer').innerHTML =
'<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var books = res.data || [];
allBooks = { read: [], reading: [], want: [] };

books.forEach(function(ub) {
if (!ub.books) return;
var b = ub.books;
if (ub.status === 'read') allBooks.read.push(b);
else if (ub.status === 'reading') allBooks.reading.push(b);
else allBooks.want.push(b);
});

document.getElementById('statRead').textContent = allBooks.read.length;
document.getElementById('statReading').textContent = allBooks.reading.length;
document.getElementById('statWant').textContent = allBooks.want.length;

render();
}

function render() {
var container = document.getElementById('gridContainer');
var books = allBooks[activeTab] || [];

if (!books.length) {
container.innerHTML = '<div class="empty"><span class="flower">❀</span>Bu bölümde henüz kitap yok.</div>';
return;
}

var html = '';
books.forEach(function(b) {
var cover = b.cover_url
? '<img class="book-cover" src="' + escapeHtml(b.cover_url) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-cover-placeholder&quot;>' + BOOK_ICON.replace(/"/g, '&quot;') + '</div>\'">'
: '<div class="book-cover-placeholder">' + BOOK_ICON + '</div>';

html += '<div class="book-item">';
html += cover;
html += '<div class="book-title">' + escapeHtml(b.title) + '</div>';
if (b.author) html += '<div class="book-author">' + escapeHtml(b.author) + '</div>';
html += '</div>';
});
container.innerHTML = html;
}
})();
</script>
</body>
</html>
