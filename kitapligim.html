<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<script>
(function() {
  try {
    var t = localStorage.getItem('katran-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kitaplığım • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg, #0a0808);
color: var(--text, #f4efe8);
min-height: 100vh;
padding-bottom: 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.top-nav {
position: sticky;
top: 0;
background: var(--nav-bg, rgba(10,8,8,0.92));
backdrop-filter: blur(24px);
border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
z-index: 100;
padding: 0.85rem 0;
}
.nav-inner {
max-width: 900px;
margin: 0 auto;
padding: 0 1rem;
display: flex;
justify-content: space-between;
align-items: center;
}
.nav-logo {
font-family: 'Playfair Display', serif;
font-size: 1.25rem;
font-weight: 900;
text-decoration: none;
color: var(--text, #f4efe8);
}
.nav-logo .red { color: var(--bordo, #8b2e3e); }
.nav-btn {
background: var(--bordo, #8b2e3e);
color: #fff;
border: none;
padding: 0.5rem 1rem;
border-radius: 60px;
text-decoration: none;
font-size: 0.8rem;
cursor: pointer;
font-weight: 700;
font-family: inherit;
display: flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
}
.nav-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--bordo-dark, #6b1f2e); }
.container { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; margin-bottom: 1.2rem; color: var(--text, #f4efe8); }
h1 .red { color: var(--bordo, #8b2e3e); }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.2rem; }
.stat-box {
background: var(--bg-elev, rgba(255,255,255,0.03));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 14px;
padding: 1rem 0.5rem;
text-align: center;
transition: all 0.25s;
}
.stat-box:hover { border-color: var(--bordo, #8b2e3e); transform: translateY(-2px); }
.stat-box .number { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--bordo, #8b2e3e); display: block; line-height: 1; }
.stat-box .label { font-size: 0.7rem; color: var(--text-muted, #a89e94); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.3rem; }
.tabs {
display: flex;
gap: 0.3rem;
margin-bottom: 1rem;
border-bottom: 1px solid var(--border, rgba(255,255,255,0.08));
padding-bottom: 0.5rem;
overflow-x: auto;
scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
background: transparent;
color: var(--text-muted, #a89e94);
border: none;
padding: 0.55rem 1rem;
font-size: 0.85rem;
font-weight: 600;
cursor: pointer;
border-radius: 60px;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
white-space: nowrap;
}
.tab svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active { background: var(--bordo-glow, rgba(139,46,62,0.25)); color: var(--bordo, #8b2e3e); }
.tab:hover:not(.active) { color: var(--text, #f4efe8); background: var(--bg-elev, rgba(255,255,255,0.03)); }
.filter-row { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
.filter-chip {
background: transparent;
color: var(--text-muted, #a89e94);
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 60px;
padding: 0.4rem 0.9rem;
font-size: 0.78rem;
font-weight: 600;
cursor: pointer;
font-family: inherit;
transition: all 0.2s;
}
.filter-chip.active { background: var(--bordo-glow, rgba(139,46,62,0.25)); color: var(--bordo, #8b2e3e); border-color: var(--bordo, #8b2e3e); }
.filter-chip:hover:not(.active) { color: var(--text, #f4efe8); border-color: var(--border-strong, rgba(255,255,255,0.15)); }
.shelf-wrap { position: relative; padding-bottom: 6px; margin-bottom: 1rem; }
.shelf-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 1rem; padding: 0.4rem 0.2rem 0.9rem; }
.shelf-line { height: 6px; background: var(--bordo, #8b2e3e); border-radius: 2px; opacity: 0.5; box-shadow: 0 2px 8px -2px var(--bordo, #8b2e3e); margin-bottom: 0.4rem; }
.book-item {
text-decoration: none;
color: inherit;
transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
position: relative;
display: block;
}
.book-item:hover { transform: translateY(-6px); }
.book-cover { width: 100%; aspect-ratio: 2/3; border-radius: 4px 6px 6px 4px; background: rgba(255,255,255,0.05); object-fit: cover; display: block; box-shadow: 0 4px 12px -3px rgba(0,0,0,0.4); }
.book-cover-placeholder {
width: 100%;
aspect-ratio: 2/3;
border-radius: 4px 6px 6px 4px;
background: linear-gradient(135deg, var(--bordo, #8b2e3e), var(--bordo-dark, #6b1f2e));
display: flex;
align-items: center;
justify-content: center;
color: #fff;
font-family: 'Playfair Display', serif;
font-size: 2rem;
font-weight: 900;
box-shadow: 0 4px 12px -3px rgba(0,0,0,0.4);
}
.book-title { font-size: 0.78rem; font-weight: 600; line-height: 1.3; margin-top: 0.5rem; color: var(--text, #f4efe8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book-author { font-size: 0.7rem; color: var(--text-muted, #a89e94); margin-top: 0.15rem; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.quote-indicator {
position: absolute;
top: 6px;
right: 6px;
background: var(--bordo, #8b2e3e);
color: #fff;
width: 24px;
height: 24px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 2px 8px -2px rgba(0,0,0,0.5);
}
.quote-indicator svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.quote-preview { margin-top: 0.4rem; font-size: 0.7rem; color: var(--text-muted, #a89e94); font-style: italic; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-left: 0.5rem; border-left: 2px solid var(--bordo, #8b2e3e); }
.loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted, #a89e94); font-size: 0.9rem; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border, rgba(255,255,255,0.08)); border-top-color: var(--bordo, #8b2e3e); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.4rem; }
.shelf-row { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.8rem; }
.book-cover-placeholder { font-size: 1.5rem; }
.stat-box .number { font-size: 1.4rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="akis.html" class="nav-logo"><span class="red">KATRAN</span></a>
<a href="kitaplar.html" class="nav-btn">
<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
Kitap Ekle
</a>
</div>
</nav>

<div class="container">
<h1><span class="red">Kitaplığım</span></h1>

<div class="stats-row">
<div class="stat-box"><span class="number" id="statRead">0</span><span class="label">Okudum</span></div>
<div class="stat-box"><span class="number" id="statReading">0</span><span class="label">Okuyorum</span></div>
<div class="stat-box"><span class="number" id="statWant">0</span><span class="label">Okuyacağım</span></div>
</div>

<div class="tabs">
<button class="tab active" data-tab="read">
<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
Okudum
</button>
<button class="tab" data-tab="reading">
<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
Okuyorum
</button>
<button class="tab" data-tab="want">
<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
Okuyacağım
</button>
</div>

<div class="filter-row" id="filterRow">
<button class="filter-chip active" data-filter="all">Tümü</button>
<button class="filter-chip" data-filter="with-quote">Alıntılı</button>
<button class="filter-chip" data-filter="without-quote">Alıntısız</button>
</div>

<div id="contentContainer">
<div class="loading"><div class="spinner"></div>Yükleniyor...</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var allBooks = { read: [], reading: [], want: [] };
var activeTab = 'read';
var activeFilter = 'all';

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) { window.location.href = 'giris.html'; return; }
currentUser = sessionRes.data.session.user;
await loadBooks();

document.querySelectorAll('.tab').forEach(function(t) {
t.addEventListener('click', function() {
document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeTab = this.getAttribute('data-tab');
document.getElementById('filterRow').style.display = activeTab === 'read' ? 'flex' : 'none';
render();
});
});

document.querySelectorAll('.filter-chip').forEach(function(c) {
c.addEventListener('click', function() {
document.querySelectorAll('.filter-chip').forEach(function(x) { x.classList.remove('active'); });
this.classList.add('active');
activeFilter = this.getAttribute('data-filter');
render();
});
});
})();

async function loadBooks() {
var res = await supabaseClient
.from('user_books')
.select('status, book_id, quote, quote_page, books(id, title, author, cover_url)')
.eq('user_id', currentUser.id);

if (res.error) {
document.getElementById('contentContainer').innerHTML = '<div class="empty">Hata: ' + escapeHtml(res.error.message) + '</div>';
return;
}

var books = res.data || [];
allBooks = { read: [], reading: [], want: [] };

books.forEach(function(ub) {
if (!ub.books) return;
var b = { id: ub.books.id, title: ub.books.title, author: ub.books.author, cover_url: ub.books.cover_url, quote: ub.quote, quote_page: ub.quote_page };
if (ub.status === 'read') allBooks.read.push(b);
else if (ub.status === 'reading') allBooks.reading.push(b);
else allBooks.want.push(b);
});

document.getElementById('statRead').textContent = allBooks.read.length;
document.getElementById('statReading').textContent = allBooks.reading.length;
document.getElementById('statWant').textContent = allBooks.want.length;
render();
}

function render() {
var container = document.getElementById('contentContainer');
var books = allBooks[activeTab] || [];

if (activeTab === 'read' && activeFilter !== 'all') {
if (activeFilter === 'with-quote') books = books.filter(function(b) { return b.quote && b.quote.trim(); });
else if (activeFilter === 'without-quote') books = books.filter(function(b) { return !b.quote || !b.quote.trim(); });
}

if (!books.length) {
var emptyText = activeTab === 'read' ? 'Henüz kitap okumadın.' : activeTab === 'reading' ? 'Şu an okuduğun kitap yok.' : 'Henüz kitap eklemedin.';
container.innerHTML = '<div class="empty">' + emptyText + '</div>';
return;
}

var html = '';
books.forEach(function(b) {
var cover = b.cover_url
? '<img class="book-cover" src="' + escapeHtml(b.cover_url) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-cover-placeholder&quot;>' + escapeHtml((b.title || '?').charAt(0).toUpperCase()) + '</div>\'">'
: '<div class="book-cover-placeholder">' + escapeHtml((b.title || '?').charAt(0).toUpperCase()) + '</div>';

var quoteIndicator = (b.quote && b.quote.trim())
? '<div class="quote-indicator" title="Alıntı eklenmiş"><svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg></div>'
: '';

html += '<a class="book-item" href="kitap.html?id=' + b.id + '">';
html += cover;
html += quoteIndicator;
html += '<div class="book-title">' + escapeHtml(b.title || 'İsimsiz') + '</div>';
if (b.author) html += '<div class="book-author">' + escapeHtml(b.author) + '</div>';
if (b.quote && b.quote.trim() && activeTab === 'read') {
html += '<div class="quote-preview">' + escapeHtml(b.quote.substring(0, 80)) + (b.quote.length > 80 ? '...' : '') + '</div>';
}
html += '</a>';
});

container.innerHTML = '<div class="shelf-wrap"><div class="shelf-row">' + html + '</div><div class="shelf-line"></div></div>';
}
})();
</script>
</body>
</html>
