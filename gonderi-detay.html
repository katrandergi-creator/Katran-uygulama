<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 1.5rem 1rem 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.container { max-width: 700px; margin: 0 auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
.back-link {
color: var(--text-muted);
text-decoration: none;
font-size: 0.85rem;
padding: 0.4rem 0.9rem;
border: 1px solid var(--border);
border-radius: 60px;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
background: var(--bg-elev);
}
.back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.back-link:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }

.post-card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 20px;
padding: 1.5rem;
margin-bottom: 1rem;
}
.post-card.read-card {
background: linear-gradient(135deg, var(--bordo-glow), var(--bg-elev));
border-color: var(--bordo);
}
.post-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
.post-avatar-link { text-decoration: none; color: inherit; }
.post-meta { flex: 1; min-width: 0; }
.post-name { font-weight: 700; font-size: 1rem; color: var(--text); }
.post-username { color: var(--text-muted); font-size: 0.82rem; }
.post-time { color: var(--text-dim); font-size: 0.78rem; white-space: nowrap; }
.post-content { font-size: 1rem; line-height: 1.75; color: var(--text); margin-bottom: 1rem; white-space: pre-wrap; word-wrap: break-word; }

.analysis-title {
font-family: 'Playfair Display', serif;
font-size: 1.6rem;
font-weight: 900;
color: var(--text);
margin-bottom: 1rem;
line-height: 1.25;
}
.analysis-content {
font-size: 1rem;
line-height: 1.85;
color: var(--text);
white-space: pre-wrap;
word-wrap: break-word;
margin-bottom: 1rem;
}
.read-quote {
position: relative;
padding: 0.8rem 0 0.8rem 1.2rem;
border-left: 3px solid var(--bordo);
margin-bottom: 1rem;
}
.read-quote-mark {
position: absolute;
top: -0.5rem;
left: -0.3rem;
font-family: 'Playfair Display', serif;
font-size: 3rem;
line-height: 1;
color: var(--bordo);
opacity: 0.3;
font-weight: 900;
pointer-events: none;
}
.read-quote-text {
font-family: 'Playfair Display', serif;
font-style: italic;
font-size: 1.15rem;
line-height: 1.8;
color: var(--text);
position: relative;
}
.read-quote-page { font-size: 0.78rem; color: var(--text-dim); text-align: right; margin-top: 0.5rem; }
.book-preview {
display: flex;
gap: 1rem;
padding: 1rem;
background: var(--bg-elev-2);
border-radius: 14px;
margin-bottom: 1rem;
text-decoration: none;
color: inherit;
transition: all 0.2s;
}
.book-preview:hover { background: var(--bordo-glow); }
.book-preview-cover { width: 70px; height: 105px; border-radius: 4px 6px 6px 4px; object-fit: cover; flex-shrink: 0; box-shadow: 0 4px 12px -3px rgba(0,0,0,0.4); }
.book-preview-placeholder { background: linear-gradient(135deg, var(--bordo), var(--bordo-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; }
.book-preview-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.book-preview-title { font-weight: 700; font-size: 0.98rem; color: var(--text); line-height: 1.3; margin-bottom: 0.2rem; }
.book-preview-author { color: var(--text-muted); font-size: 0.85rem; }
.book-preview-date { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.3rem; font-style: italic; }
.read-action {
display: flex;
align-items: center;
gap: 0.6rem;
font-size: 0.88rem;
color: var(--text-muted);
margin-bottom: 1rem;
padding: 0.7rem 0.9rem;
background: var(--bg-elev-2);
border-radius: 10px;
line-height: 1.5;
}
.read-action strong { color: var(--text); font-weight: 700; }
.read-action em { color: var(--bordo); font-style: italic; font-weight: 600; }
.read-icon { width: 20px; height: 20px; stroke: var(--bordo); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.post-actions { display: flex; gap: 0.4rem; border-top: 1px solid var(--border); padding-top: 0.9rem; }
.action-btn {
background: transparent;
border: none;
color: var(--text-muted);
font-size: 0.88rem;
padding: 0.55rem 1.1rem;
border-radius: 60px;
cursor: pointer;
display: flex;
align-items: center;
gap: 0.45rem;
transition: all 0.2s;
font-family: inherit;
font-weight: 500;
}
.action-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.action-btn:hover { background: var(--bordo-glow); color: var(--bordo); }
.action-btn.liked { color: var(--bordo); }
.action-btn.liked svg { fill: var(--bordo); stroke: var(--bordo); }
.comments-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 1rem; }
.comment { display: flex; gap: 0.7rem; padding: 0.8rem 0; border-bottom: 1px solid var(--border); position: relative; }
.comment:last-child { border-bottom: none; }
.comment-body { flex: 1; min-width: 0; }
.comment-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 0.2rem; text-decoration: none; color: var(--text); display: inline-block; }
.comment-name:hover { color: var(--bordo); }
.comment-text { font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; word-wrap: break-word; }
.comment-delete { position: absolute; top: 0.8rem; right: 0; background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 0.3rem; border-radius: 50%; display: flex; }
.comment-delete svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.comment-delete:hover { color: var(--accent); background: var(--accent-glow); }
.comment-form { display: flex; gap: 0.5rem; margin-top: 1rem; }
.comment-input {
flex: 1;
background: var(--bg-elev-2);
border: 1px solid var(--border);
border-radius: 60px;
padding: 0.75rem 1.2rem;
color: var(--text);
font-family: inherit;
font-size: 0.92rem;
}
.comment-input:focus { outline: none; border-color: var(--bordo); }
.comment-send { background: var(--bordo); color: #fff; border: none; border-radius: 60px; padding: 0.75rem 1.3rem; font-weight: 700; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
.comment-send:disabled { opacity: 0.5; }
.loading, .empty { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
position: fixed;
bottom: 100px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: var(--bordo);
color: #fff;
padding: 0.8rem 1.5rem;
border-radius: 60px;
font-weight: 600;
font-size: 0.9rem;
transition: transform 0.3s;
z-index: 9999;
max-width: 90%;
text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { background: #e03131; }
@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
.post-card { padding: 1.2rem 1.1rem; }
.analysis-title { font-size: 1.3rem; }
}
</style>
</head>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var post = null;
var profileCache = {};
var bookCache = {};
var myLikes = {};

var ICONS = {
heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
comment: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
repost: '<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
checkCircle: '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
pencil: '<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>'
};

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
if (s < 604800) return Math.floor(s/86400) + ' gün önce';
return d.toLocaleDateString('tr-TR');
}

function formatDate(dateStr) {
if (!dateStr) return '';
var d = new Date(dateStr);
var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function toast(msg, isError) {
var t = document.getElementById('toast');
t.textContent = msg;
t.className = 'toast show' + (isError ? ' error' : '');
setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 42);
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 42) + 'px;height:' + (size || 42) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo), var(--bordo-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:' + Math.round((size || 42) * 0.42) + 'px;">' + initial + '</div>';
}

(async function init() {
var urlParams = new URLSearchParams(window.location.search);
var postId = urlParams.get('id');
if (!postId) {
document.getElementById('content').innerHTML = '<div class="empty">Gönderi belirtilmedi.</div>';
return;
}

var sessionRes = await supabaseClient.auth.getSession();
if (sessionRes.data.session) {
currentUser = sessionRes.data.session.user;
var profRes = await supabaseClient.from('profiles').select('status, full_name').eq('id', currentUser.id).single();
var lRes = await supabaseClient.from('likes').select('post_id').eq('user_id', currentUser.id);
(lRes.data || []).forEach(function(l) { myLikes[l.post_id] = true; });
}

var postRes = await supabaseClient.from('posts').select('*').eq('id', postId).single();
if (postRes.error || !postRes.data) {
document.getElementById('content').innerHTML = '<div class="empty">Gönderi bulunamadı.</div>';
return;
}
post = postRes.data;

var authorRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').eq('id', post.user_id).single();
profileCache[post.user_id] = authorRes.data || { full_name: 'İsimsiz', username: 'kullanici', avatar: 'harf' };

if (post.book_id) {
var bookRes = await supabaseClient.from('books').select('id, cover_url, title, author').eq('id', post.book_id).single();
if (bookRes.data) bookCache[post.book_id] = bookRes.data;
}

if (post.repost_of) {
var origRes = await supabaseClient.from('posts').select('*').eq('id', post.repost_of).single();
if (origRes.data) {
  post._original = origRes.data;
  var origAuthor = await supabaseClient.from('profiles').select('id, full_name, username, avatar').eq('id', origRes.data.user_id).single();
  profileCache[origRes.data.user_id] = origAuthor.data || { full_name: 'İsimsiz', username: 'kullanici', avatar: 'harf' };
}
}

render();
})();

function render() {
var container = document.getElementById('content');
var author = profileCache[post.user_id] || { full_name: 'İsimsiz', avatar: 'harf' };
var isOwner = currentUser && currentUser.id === post.user_id;
var liked = myLikes[post.id] ? 'liked' : '';

var html = '';

// REPOST
if (post.is_repost && post._original) {
  var orig = post._original;
  var origAuthor = profileCache[orig.user_id] || { full_name: 'İsimsiz', avatar: 'harf' };
  html += '<div class="post-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
  html += '<div class="read-action" style="background:transparent;padding:0 0 0.8rem 0;">' + ICONS.repost + ' <span><strong>' + escapeHtml(author.full_name) + '</strong> yeniden paylaştı</span></div>';
  html += '<div class="book-preview" style="cursor:pointer;" onclick="window.location.href=\'gonderi-detay.html?id=' + orig.id + '\'">';
  html += '<div style="flex:1;">';
  html += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">' + getAvatar(origAuthor, 32) + '<strong>' + escapeHtml(origAuthor.full_name) + '</strong><span style="color:var(--text-dim);font-size:0.75rem;">' + timeAgo(orig.created_at) + '</span></div>';
  html += '<div style="color:var(--text-muted);line-height:1.6;">' + escapeHtml(orig.content || '') + '</div>';
  html += '</div></div>';
  html += renderActions();
  html += '</div>';
  container.innerHTML = html;
  loadComments();
  return;
}

// QUOTE
if (post.repost_of && post._original && !post.is_repost) {
  var orig = post._original;
  var origAuthor = profileCache[orig.user_id] || { full_name: 'İsimsiz', avatar: 'harf' };
  html += '<div class="post-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
  html += '<div class="post-header">';
  html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">' + getAvatar(author, 48) + '</a>';
  html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
  html += '<div class="post-meta"><div class="post-name">' + escapeHtml(author.full_name) + '</div><div class="post-username">' + timeAgo(post.created_at) + '</div></div></a>';
  html += '</div>';
  if (post.content) html += '<div class="post-content">' + escapeHtml(post.content) + '</div>';
  html += '<div class="book-preview" style="cursor:pointer;" onclick="window.location.href=\'gonderi-detay.html?id=' + orig.id + '\'">';
  html += '<div style="flex:1;">';
  html += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">' + getAvatar(origAuthor, 32) + '<strong>' + escapeHtml(origAuthor.full_name) + '</strong><span style="color:var(--text-dim);font-size:0.75rem;">' + timeAgo(orig.created_at) + '</span></div>';
  html += '<div style="color:var(--text-muted);line-height:1.6;">' + escapeHtml(orig.content || '') + '</div>';
  html += '</div></div>';
  html += renderActions();
  html += '</div>';
  container.innerHTML = html;
  loadComments();
  return;
}

// ANALİZ
if (post.type === 'analysis') {
  var book = post.book_id && bookCache[post.book_id] ? bookCache[post.book_id] : null;
  var coverUrl = book ? book.cover_url : null;
  
  html += '<div class="post-card read-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
  html += '<div class="post-header">';
  html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">' + getAvatar(author, 48) + '</a>';
  html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
  html += '<div class="post-meta"><div class="post-name">' + escapeHtml(author.full_name) + '</div><div class="post-username">' + timeAgo(post.created_at) + '</div></div></a>';
  html += '</div>';
  html += '<div class="read-action">' + ICONS.pencil + '<span><strong>' + escapeHtml(author.full_name) + '</strong>, <em>' + escapeHtml(post.quote_book || 'bir kitap') + '</em> hakkında analiz yazdı</span></div>';
  if (post.book_id) html += '<a class="book-preview" href="kitap.html?id=' + post.book_id + '">';
  else html += '<div class="book-preview">';
  if (coverUrl) html += '<img class="book-preview-cover" src="' + escapeHtml(coverUrl) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-preview-cover book-preview-placeholder&quot;>' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>\'">';
  else html += '<div class="book-preview-cover book-preview-placeholder">' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>';
  html += '<div class="book-preview-info">';
  html += '<div class="book-preview-title">' + escapeHtml(post.quote_book || 'İsimsiz') + '</div>';
  html += '<div class="book-preview-author">' + escapeHtml(post.quote_author || 'Bilinmeyen') + '</div>';
  html += '</div>';
  if (post.book_id) html += '</a>'; else html += '</div>';
  if (post.analysis_title) html += '<h1 class="analysis-title">' + escapeHtml(post.analysis_title) + '</h1>';
  if (post.content) html += '<div class="analysis-content">' + escapeHtml(post.content) + '</div>';
  html += renderActions();
  html += '<div id="commentsSection"></div>';
  html += '</div>';
  container.innerHTML = html;
  loadComments();
  return;
}

// ALINTI
if (post.type === 'quote') {
  var book = post.book_id && bookCache[post.book_id] ? bookCache[post.book_id] : null;
  var coverUrl = book ? book.cover_url : null;
  
  html += '<div class="post-card read-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
  html += '<div class="post-header">';
  html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">' + getAvatar(author, 48) + '</a>';
  html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
  html += '<div class="post-meta"><div class="post-name">' + escapeHtml(author.full_name) + '</div><div class="post-username">' + timeAgo(post.created_at) + '</div></div></a>';
  html += '</div>';
  if (post.analysis_content && post.analysis_content.trim()) {
    html += '<div class="post-content">' + escapeHtml(post.analysis_content) + '</div>';
  }
  if (post.book_id) html += '<a class="book-preview" href="kitap.html?id=' + post.book_id + '">';
  else html += '<div class="book-preview">';
  if (coverUrl) html += '<img class="book-preview-cover" src="' + escapeHtml(coverUrl) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-preview-cover book-preview-placeholder&quot;>' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>\'">';
  else html += '<div class="book-preview-cover book-preview-placeholder">' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>';
  html += '<div class="book-preview-info">';
  html += '<div class="book-preview-title">' + escapeHtml(post.quote_book || 'İsimsiz') + '</div>';
  html += '<div class="book-preview-author">' + escapeHtml(post.quote_author || 'Bilinmeyen') + '</div>';
  html += '</div>';
  if (post.book_id) html += '</a>'; else html += '</div>';
  if (post.content) {
    html += '<div class="read-quote">';
    html += '<div class="read-quote-mark">&#8220;</div>';
    html += '<div class="read-quote-text">' + escapeHtml(post.content) + '</div>';
    if (post.quote_page) html += '<div class="read-quote-page">s. ' + post.quote_page + '</div>';
    html += '</div>';
  }
  html += renderActions();
  html += '<div id="commentsSection"></div>';
  html += '</div>';
  container.innerHTML = html;
  loadComments();
  return;
}

// OKUDU
if (post.type === 'read') {
  var book = post.book_id && bookCache[post.book_id] ? bookCache[post.book_id] : null;
  var coverUrl = book ? book.cover_url : null;
  var finishedStr = post.finished_at ? formatDate(post.finished_at) : '';
  
  html += '<div class="post-card read-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
  html += '<div class="post-header">';
  html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">' + getAvatar(author, 48) + '</a>';
  html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
  html += '<div class="post-meta"><div class="post-name">' + escapeHtml(author.full_name) + '</div><div class="post-username">' + timeAgo(post.created_at) + '</div></div></a>';
  html += '</div>';
  html += '<div class="read-action">' + ICONS.checkCircle + '<span><strong>' + escapeHtml(author.full_name) + '</strong>, <em>' + escapeHtml(post.quote_book || 'bir kitabı') + '</em>\' okudu</span></div>';
  if (post.book_id) html += '<a class="book-preview" href="kitap.html?id=' + post.book_id + '">';
  else html += '<div class="book-preview">';
  if (coverUrl) html += '<img class="book-preview-cover" src="' + escapeHtml(coverUrl) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;book-preview-cover book-preview-placeholder&quot;>' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>\'">';
  else html += '<div class="book-preview-cover book-preview-placeholder">' + escapeHtml((post.quote_book || '?').charAt(0).toUpperCase()) + '</div>';
  html += '<div class="book-preview-info">';
  html += '<div class="book-preview-title">' + escapeHtml(post.quote_book || 'İsimsiz') + '</div>';
  html += '<div class="book-preview-author">' + escapeHtml(post.quote_author || 'Bilinmeyen') + '</div>';
  if (finishedStr) html += '<div class="book-preview-date">' + finishedStr + '\'de bitirdi</div>';
  html += '</div>';
  if (post.book_id) html += '</a>'; else html += '</div>';
  if (post.content) {
    html += '<div class="read-quote"><div class="read-quote-mark">&#8220;</div><div class="read-quote-text">' + escapeHtml(post.content) + '</div>';
    if (post.quote_page) html += '<div class="read-quote-page">s. ' + post.quote_page + '</div>';
    html += '</div>';
  }
  html += renderActions();
  html += '<div id="commentsSection"></div>';
  html += '</div>';
  container.innerHTML = html;
  loadComments();
  return;
}

// NORMAL
html += '<div class="post-card" data-post-id="' + post.id + '" data-owner-id="' + post.user_id + '">';
html += '<div class="post-header">';
html += '<a href="kullanici.html?id=' + post.user_id + '" class="post-avatar-link">' + getAvatar(author, 48) + '</a>';
html += '<a href="kullanici.html?id=' + post.user_id + '" style="text-decoration:none;color:inherit;flex:1;min-width:0;">';
html += '<div class="post-meta"><div class="post-name">' + escapeHtml(author.full_name) + '</div><div class="post-username">@' + escapeHtml(author.username) + '</div></div></a>';
html += '<div class="post-time">' + timeAgo(post.created_at) + '</div>';
html += '</div>';
html += '<div class="post-content">' + escapeHtml(post.content) + '</div>';
html += renderActions();
html += '<div id="commentsSection"></div>';
html += '</div>';
container.innerHTML = html;
loadComments();
}

function renderActions() {
var liked = myLikes[post.id] ? 'liked' : '';
var isOwner = currentUser && currentUser.id === post.user_id;
var html = '<div class="post-actions">';
html += '<button class="action-btn ' + liked + '" onclick="toggleLike(\'' + post.id + '\', this)">' + ICONS.heart + '<span class="like-count">' + (post.likes_count || 0) + '</span></button>';
html += '<button class="action-btn" onclick="scrollToComments()">' + ICONS.comment + '<span class="comment-count">' + (post.comments_count || 0) + '</span></button>';
html += '<button class="action-btn" onclick="doRepost(\'' + post.id + '\')">' + ICONS.repost + '</button>';
if (isOwner) {
html += '<button class="action-btn" onclick="deletePost(\'' + post.id + '\')" style="color:var(--accent);">' + ICONS.x + '</button>';
}
html += '</div>';
return html;
}

window.scrollToComments = function() {
var el = document.getElementById('commentsSection');
if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.toggleLike = async function(postId, btn) {
if (!currentUser) { toast('Beğenmek için giriş yap'); return; }
var liked = btn.classList.contains('liked');
var countEl = btn.querySelector('.like-count');
var c = parseInt(countEl.textContent) || 0;
if (liked) {
btn.classList.remove('liked');
countEl.textContent = Math.max(0, c - 1);
delete myLikes[postId];
} else {
btn.classList.add('liked');
countEl.textContent = c + 1;
myLikes[postId] = true;
}
if (liked) await supabaseClient.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
else await supabaseClient.from('likes').insert([{ post_id: postId, user_id: currentUser.id }]);
};

window.doRepost = async function(postId) {
if (!currentUser) { toast('Yeniden paylaşmak için giriş yap'); return; }
var existing = await supabaseClient.from('posts').select('id').eq('user_id', currentUser.id).eq('repost_of', postId).eq('is_repost', true).maybeSingle();
if (existing.data) {
await supabaseClient.from('posts').delete().eq('id', existing.data.id);
toast('Yeniden paylaşım kaldırıldı');
return;
}
if (post.user_id === currentUser.id) { toast('Kendi gönderini yeniden paylaşamazsın', true); return; }
var res = await supabaseClient.from('posts').insert([{ user_id: currentUser.id, content: null, is_repost: true, repost_of: postId }]);
if (res.error) { toast('Hata'); return; }
toast('✅ Yeniden paylaşıldı');
};

window.deletePost = async function(postId) {
if (!confirm('Silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('posts').delete().eq('id', postId);
if (res.error) { toast('Silinemedi'); return; }
toast('Silindi');
setTimeout(function() { window.location.href = 'akis.html'; }, 800);
};

async function loadComments() {
var section = document.getElementById('commentsSection');
if (!section) return;
section.innerHTML = '<div class="comments-title">Yorumlar</div><div style="color:var(--text-muted);font-size:0.85rem;">Yükleniyor...</div>';
  
var res = await supabaseClient.from('comments').select('*').eq('post_id', post.id).order('created_at', { ascending: true });
var comments = res.data || [];
var ids = comments.map(function(c) { return c.user_id; });
var uniqueIds = ids.filter(function(v, i, a) { return a.indexOf(v) === i; });
var missing = uniqueIds.filter(function(id) { return !profileCache[id]; });
if (missing.length) {
var pRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', missing);
(pRes.data || []).forEach(function(p) { profileCache[p.id] = p; });
}
  
var html = '<div class="comments-title">Yorumlar (' + comments.length + ')</div>';
  
if (!comments.length) {
html += '<div style="color:var(--text-dim);font-size:0.88rem;font-style:italic;padding:0.5rem 0;">Henüz yorum yok.</div>';
} else {
comments.forEach(function(c) {
var author = profileCache[c.user_id] || { full_name: 'İsimsiz', avatar: 'harf' };
var canDelete = currentUser && (currentUser.id === c.user_id || currentUser.id === post.user_id);
html += '<div class="comment">';
html += getAvatar(author, 32);
html += '<div class="comment-body">';
html += '<a href="kullanici.html?id=' + c.user_id + '" class="comment-name">' + escapeHtml(author.full_name) + '</a>';
html += '<div class="comment-text">' + escapeHtml(c.content) + '</div>';
html += '</div>';
if (canDelete) html += '<button class="comment-delete" onclick="deleteComment(\'' + c.id + '\')">' + ICONS.x + '</button>';
html += '</div>';
});
}
  
if (currentUser) {
html += '<div class="comment-form">';
html += '<input type="text" class="comment-input" placeholder="Yorum yaz..." id="commentInput" maxlength="500">';
html += '<button class="comment-send" onclick="sendComment(this)">Gönder</button>';
html += '</div>';
} else {
html += '<div style="color:var(--text-muted);font-size:0.85rem;text-align:center;padding:1rem;">Yorum için <a href="giris.html" style="color:var(--bordo);">giriş yap</a></div>';
}
  
section.innerHTML = html;
}

window.sendComment = async function(btn) {
var input = document.getElementById('commentInput');
var content = input.value.trim();
if (!content) return;
btn.disabled = true;
btn.textContent = '...';
var res = await supabaseClient.from('comments').insert([{ post_id: post.id, user_id: currentUser.id, content: content }]);
btn.disabled = false;
btn.textContent = 'Gönder';
if (res.error) { toast('Hata'); return; }
input.value = '';
post.comments_count = (post.comments_count || 0) + 1;
var countEl = document.querySelector('.comment-count');
if (countEl) countEl.textContent = post.comments_count;
await loadComments();
};

window.deleteComment = async function(commentId) {
if (!confirm('Yorumu silmek istediğine emin misin?')) return;
var res = await supabaseClient.from('comments').delete().eq('id', commentId);
if (res.error) { toast('Silinemedi'); return; }
post.comments_count = Math.max(0, (post.comments_count || 1) - 1);
var countEl = document.querySelector('.comment-count');
if (countEl) countEl.textContent = post.comments_count;
await loadComments();
};
})();
</script>
</body>
</html>
