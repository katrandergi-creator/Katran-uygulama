<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<script>
(function() {
  try {
    var t = localStorage.getItem('katran-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Profili Düzenle • Katran Dergi</title>
<link rel="stylesheet" href="tema.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg, #0a0808);
color: var(--text, #f4efe8);
min-height: 100vh;
padding: 1.5rem 1rem 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.container { max-width: 600px; margin: 0 auto; }

.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 1.5rem;
flex-wrap: wrap;
gap: 0.5rem;
}
.back-link {
color: var(--text-muted, #a89e94);
text-decoration: none;
font-size: 0.85rem;
padding: 0.4rem 0.9rem;
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 60px;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
background: var(--bg-elev, rgba(255,255,255,0.03));
}
.back-link svg {
width: 14px;
height: 14px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
}
.back-link:hover {
color: var(--bordo, #8b2e3e);
border-color: var(--bordo, #8b2e3e);
background: var(--bordo-glow, rgba(139,46,62,0.25));
}
h1 {
font-family: 'Playfair Display', serif;
font-size: 1.5rem;
font-weight: 900;
color: var(--text, #f4efe8);
}
h1 .red { color: var(--bordo, #8b2e3e); }

.card {
background: var(--bg-elev, rgba(255,255,255,0.03));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 20px;
padding: 1.8rem;
}
.field { margin-bottom: 1.4rem; }
.field:last-of-type { margin-bottom: 0; }
label {
display: block;
font-size: 0.85rem;
color: var(--text-muted, #a89e94);
margin-bottom: 0.5rem;
font-weight: 600;
letter-spacing: 0.02em;
}
textarea {
width: 100%;
min-height: 140px;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 1px solid var(--border, rgba(255,255,255,0.08));
border-radius: 12px;
padding: 1.1rem 1.2rem;
color: var(--text, #f4efe8);
font-family: inherit;
font-size: 0.95rem;
line-height: 1.7;
resize: vertical;
transition: all 0.2s;
}
textarea::placeholder { color: var(--text-dim, #7a7068); }
textarea:focus {
outline: none;
border-color: var(--bordo, #8b2e3e);
background: var(--bordo-glow, rgba(139,46,62,0.15));
}
.char-count {
text-align: right;
color: var(--text-dim, #7a7068);
font-size: 0.78rem;
margin-top: 0.5rem;
}
.char-count.warn { color: #ffc107; }
.char-count.danger { color: var(--accent, #e03131); }
.field-hint {
font-size: 0.75rem;
color: var(--text-dim, #7a7068);
margin-top: 0.4rem;
font-style: italic;
}

/* AVATAR SEÇİCİ */
.avatar-picker {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 0.7rem;
}
.avatar-option {
aspect-ratio: 1;
border-radius: 16px;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border: 2px solid var(--border, rgba(255,255,255,0.08));
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
color: var(--bordo, #8b2e3e);
position: relative;
overflow: hidden;
}
.avatar-option:hover {
border-color: var(--bordo, #8b2e3e);
transform: translateY(-3px);
}
.avatar-option.active {
border-color: var(--bordo, #8b2e3e);
background: var(--bordo-glow, rgba(139,46,62,0.25));
transform: scale(1.03);
}
.avatar-option.active::after {
content: '✓';
position: absolute;
top: 4px;
right: 4px;
width: 18px;
height: 18px;
border-radius: 50%;
background: var(--bordo, #8b2e3e);
color: #fff;
font-size: 0.7rem;
font-weight: 900;
display: flex;
align-items: center;
justify-content: center;
line-height: 1;
}
.avatar-option svg {
width: 45%;
height: 45%;
}
.avatar-option .initial-preview {
font-family: 'Playfair Display', serif;
font-size: 1.6rem;
font-weight: 900;
color: var(--bordo, #8b2e3e);
}
.avatar-preview-row {
display: flex;
align-items: center;
gap: 1rem;
margin-bottom: 1rem;
padding: 1rem;
background: var(--bg-elev-2, rgba(255,255,255,0.06));
border-radius: 14px;
}
.avatar-preview-row .preview-text {
flex: 1;
min-width: 0;
}
.avatar-preview-row .preview-label {
font-size: 0.75rem;
color: var(--text-dim, #7a7068);
text-transform: uppercase;
letter-spacing: 0.1em;
font-weight: 600;
margin-bottom: 0.2rem;
}
.avatar-preview-row .preview-value {
font-family: 'Playfair Display', serif;
font-size: 1rem;
font-weight: 700;
color: var(--text, #f4efe8);
}

.btn-row {
display: flex;
justify-content: flex-end;
gap: 0.5rem;
margin-top: 1.5rem;
}
.btn {
padding: 0.75rem 1.6rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.9rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}
.btn svg {
width: 15px;
height: 15px;
stroke: currentColor;
fill: none;
stroke-width: 2.5;
stroke-linecap: round;
stroke-linejoin: round;
}
.btn-primary {
background: var(--bordo, #8b2e3e);
color: #fff;
}
.btn-primary:hover:not(:disabled) {
background: var(--bordo-dark, #6b1f2e);
transform: translateX(4px);
}
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel {
background: transparent;
color: var(--text-muted, #a89e94);
border: 1px solid var(--border, rgba(255,255,255,0.08));
}
.btn-cancel:hover {
color: var(--bordo, #8b2e3e);
border-color: var(--bordo, #8b2e3e);
}

.message {
padding: 1rem;
border-radius: 12px;
margin-bottom: 1.2rem;
display: none;
font-size: 0.9rem;
align-items: center;
gap: 0.5rem;
line-height: 1.5;
}
.message svg {
width: 16px;
height: 16px;
stroke: currentColor;
fill: none;
stroke-width: 2;
stroke-linecap: round;
stroke-linejoin: round;
flex-shrink: 0;
}
.message.error {
background: rgba(224,49,49,0.15);
border: 1px solid rgba(224,49,49,0.4);
color: #ff8a8a;
display: flex;
}
.message.info {
background: rgba(16,185,129,0.1);
border: 1px solid rgba(16,185,129,0.3);
color: #6ee7b7;
display: flex;
}

.loading {
text-align: center;
padding: 3rem;
color: var(--text-muted, #a89e94);
}
.spinner {
width: 32px;
height: 32px;
border: 3px solid var(--border, rgba(255,255,255,0.08));
border-top-color: var(--bordo, #8b2e3e);
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
h1 { font-size: 1.3rem; }
.card { padding: 1.3rem 1.1rem; }
textarea { min-height: 120px; }
.avatar-picker { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
}
</style>
</head>
<body>

<div class="container">
<div id="loadingState" class="loading">
<div class="spinner"></div>
Yükleniyor...
</div>

<div id="formContent" style="display:none;">
<div class="top-bar">
<a href="profil.html" class="back-link">
<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
Profile dön
</a>
<h1><span class="red">Profili</span> Düzenle</h1>
</div>

<div class="message" id="message"></div>

<div class="card">

<!-- AVATAR SEÇİCİ -->
<div class="field">
<label>Avatar</label>
<div class="avatar-preview-row">
<div id="currentAvatarPreview"></div>
<div class="preview-text">
<div class="preview-label">Seçili</div>
<div class="preview-value" id="currentAvatarLabel">Baş Harf</div>
</div>
</div>
<div class="avatar-picker" id="avatarPicker"></div>
<div class="field-hint">Profilinde görünecek simgeyi seç.</div>
</div>

<!-- BİYOGRAFİ -->
<div class="field">
<label for="bio">Hakkımda (kısa biyografi)</label>
<textarea id="bio" maxlength="300" placeholder="Kendinden kısaca bahset..."></textarea>
<div class="char-count" id="charCount">0 / 300</div>
<div class="field-hint">Bu yazı profilinde herkese görünür. Kısa ve öz ol.</div>
</div>

<div class="btn-row">
<button class="btn btn-cancel" onclick="window.location.href='profil.html'">İptal</button>
<button class="btn btn-primary" id="submitBtn">
Kaydet
<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
</button>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tema.js"></script>
<script src="avatares.js"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
var ICON_ERROR = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

var bioEl = document.getElementById('bio');
var charCount = document.getElementById('charCount');
var message = document.getElementById('message');
var submitBtn = document.getElementById('submitBtn');
var selectedAvatar = 'harf';
var userInitial = 'K';
var userFullName = '';

function showMessage(msg, type) {
message.className = 'message ' + type;
message.innerHTML = (type === 'error' ? ICON_ERROR : ICON_CHECK) + '<span>' + msg + '</span>';
}

bioEl.addEventListener('input', function() {
var len = bioEl.value.length;
charCount.textContent = len + ' / 300';
charCount.className = 'char-count';
if (len > 270) charCount.classList.add('danger');
else if (len > 240) charCount.classList.add('warn');
});

// AVATAR SEÇİCİ RENDER
function renderAvatarPicker() {
var picker = document.getElementById('avatarPicker');
if (!picker) return;
if (!window.KATRAN_AVATAR_LIST) { setTimeout(renderAvatarPicker, 100); return; }
  
var html = '';
window.KATRAN_AVATAR_LIST.forEach(function(a) {
  var inner = '';
  if (a.id === 'harf') {
    inner = '<span class="initial-preview">' + userInitial + '</span>';
  } else {
    inner = window.KATRAN_AVATARS[a.id] || '';
  }
  var active = a.id === selectedAvatar ? ' active' : '';
  html += '<div class="avatar-option' + active + '" data-id="' + a.id + '" title="' + a.label + '">' + inner + '</div>';
});
picker.innerHTML = html;

picker.querySelectorAll('.avatar-option').forEach(function(el) {
  el.addEventListener('click', function() {
    selectedAvatar = this.getAttribute('data-id');
    renderAvatarPicker();
    updatePreview();
  });
});
}

function updatePreview() {
  var previewEl = document.getElementById('currentAvatarPreview');
  var labelEl = document.getElementById('currentAvatarLabel');
  
  // Geçici profile objesi
  var tempProfile = { avatar: selectedAvatar, full_name: userFullName || userInitial };
  previewEl.innerHTML = window.renderAvatar(tempProfile, 50);
  
  var found = window.KATRAN_AVATAR_LIST.find(function(a) { return a.id === selectedAvatar; });
  labelEl.textContent = found ? found.label : 'Baş Harf';
}

// KAYDET
submitBtn.addEventListener('click', async function() {
var bio = bioEl.value.trim();

submitBtn.disabled = true;
submitBtn.textContent = 'Kaydediliyor...';
message.style.display = 'none';

var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;
if (!session) {
showMessage('Giriş yapmalısın.', 'error');
submitBtn.disabled = false;
submitBtn.innerHTML = 'Kaydet <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
return;
}

var res = await supabaseClient
.from('profiles')
.update({ bio: bio, avatar: selectedAvatar })
.eq('id', session.user.id);

if (res.error) {
showMessage('Hata: ' + res.error.message, 'error');
submitBtn.disabled = false;
submitBtn.innerHTML = 'Kaydet <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
return;
}

showMessage('Kaydedildi! Profile dönülüyor...', 'info');
setTimeout(function() { window.location.href = 'profil.html'; }, 800);
});

// İNİT
(async function init() {
var sessionRes = await supabaseClient.auth.getSession();
var session = sessionRes.data.session;

if (!session) {
window.location.href = 'giris.html';
return;
}

var res = await supabaseClient
.from('profiles')
.select('bio, avatar, full_name, status')
.eq('id', session.user.id)
.single();

if (!res.data || res.data.status !== 'approved') {
document.getElementById('loadingState').innerHTML = 'Hesabın onaylı değil. <a href="giris.html" style="color:var(--bordo);">Girişe dön</a>';
return;
}

userFullName = res.data.full_name || '';
userInitial = (userFullName || 'K').charAt(0).toUpperCase();

if (res.data.bio) {
bioEl.value = res.data.bio;
var len = res.data.bio.length;
charCount.textContent = len + ' / 300';
}
if (res.data.avatar) selectedAvatar = res.data.avatar;

document.getElementById('loadingState').style.display = 'none';
document.getElementById('formContent').style.display = 'block';

// Seçici ve önizleme
renderAvatarPicker();
updatePreview();

bioEl.focus();
})();

})();
</script>
</body>
</html>
