body {

.container { max-width: 700px; margin: 0 auto; }
.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2rem;
flex-wrap: wrap;
gap: 0.5rem;
}
.back-link {
color: #a89e94;
text-decoration: none;
font-size: 0.85rem;
padding: 0.45rem 0.9rem;
border: 1px solid rgba(255,255,255,0.1);
border-radius: 60px;
display: inline-flex;
align-items: center;
gap: 0.4rem;
transition: all 0.2s;
}
.back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.profile-card {

margin-bottom: 1.5rem;
}
.avatar {
width: 100px;
height: 100px;

background: linear-gradient(135deg, #e03131, #b71c1c);

align-items: center;
justify-content: center;
margin: 0 auto 1.5rem;
font-family: 'Playfair Display', serif;
font-size: 2.5rem;
font-weight: 900;
color: #f4efe8;
border: 3px solid rgba(255,255,255,0.1);
}
.rank-badge {
display: inline-flex;
align-items: center;
gap: 0.4rem;
padding: 0.4rem 1rem;
border-radius: 60px;
font-size: 0.75rem;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.1em;
margin-bottom: 1rem;
}
.rank-filiz { background: rgba(168,158,148,0.15); color: #a89e94; border: 1px solid rgba(168,158,148,0.3); }

.rank-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; }
.rank-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.full-name {
font-family: 'Playfair Display', serif;
font-size: 2rem;
font-weight: 900;
margin-bottom: 0.3rem;
}
.username { color: #a89e94; font-size: 1rem; margin-bottom: 1rem; }
.member-since { color: #a89e94; font-size: 0.85rem; font-style: italic; margin-bottom: 1.5rem; }
.btn-row {
display: flex;
gap: 0.5rem;
justify-content: center;
flex-wrap: wrap;
}
.action-btn {
padding: 0.7rem 1.5rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.85rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: all 0.2s;
}
.action-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.action-btn.not-following { background: #e03131; color: #f4efe8; }
.action-btn.not-following:hover { background: #b71c1c; }
.action-btn.following { background: transparent; color: #a89e94; border: 1px solid rgba(255,255,255,0.15); }
.action-btn.following:hover { background: rgba(224,49,49,0.15); color: #e03131; border-color: #e03131; }
.action-btn.message-btn { background: transparent; color: #a89e94; border: 1px solid rgba(255,255,255,0.15); }
.action-btn.message-btn:hover { color: #e03131; border-color: #e03131; }

.follow-stat {

padding: 1.2rem 0.5rem;

.follow-stat:hover { border-color: rgba(224,49,49,0.3); background: rgba(224,49,49,0.03); }
.follow-stat .number {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
color: #e03131;
display: block;
}
.follow-stat .label {
font-size: 0.7rem;
color: #a89e94;
text-transform: uppercase;
letter-spacing: 0.1em;
margin-top: 0.3rem;
}
.section {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 20px;

margin-bottom: 1.5rem;

.section h2 {

font-size: 1.3rem;
margin-bottom: 1rem;

.section p { color: #a89e94; font-size: 0.95rem; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }

.stat-box {
background: rgba(255,255,255,0.03);
border: 1px solid rgba(255,255,255,0.06);
border-radius: 16px;
padding: 1.2rem 0.5rem;
text-align: center;
}
.stat-box .number {
font-family: 'Playfair Display', serif;
font-size: 1.8rem;
font-weight: 900;
color: #e03131;

.stat-box .label {

background: rgba(255,255,255,0.02);

line-height: 1.6;

.my-post-stats {
display: flex;
gap: 1rem;
margin-top: 0.6rem;
font-size: 0.8rem;
color: #a89e94;
align-items: center;
}
.my-post-stats button {
background: transparent;
border: none;
color: #a89e94;
font-family: inherit;
font-size: 0.8rem;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.3rem;
padding: 0.2rem 0.4rem;

}
.my-post-stats button:hover { background: rgba(224,49,49,0.1); color: #e03131; }
.my-post-stats svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.loading { text-align: center; padding: 4rem; color: #a89e94; }
.loading .flower {

color: #e03131;

@keyframes spin {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }

.message-error {
background: rgba(224,49,49,0.15);

.toast {

bottom: 2rem;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: #e03131;
color: #f4efe8;
padding: 0.8rem 1.5rem;
border-radius: 60px;
font-weight: 600;

.modal-body {

.user-item {

.user-item:hover { background: rgba(224,49,49,0.06); }
.user-item-avatar {
width: 40px;
height: 40px;

background: linear-gradient(135deg, #e03131, #b71c1c);

@media (max-width: 520px) {

var RANK_ICONS = {
filiz: '<svg viewBox="0 0 24 24"><path d="M7 20h10"/><path d="M12 20V10"/><path d="M12 10c0-4 4-8 8-8 0 4-4 8-8 8z"/><path d="M12 10c0-4-4-8-8-8 0 4 4 8 8 8z"/></svg>',

};

function escapeHtml(str) {

return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);

if (s < 60) return 'şimdi';

// ---------- BAŞLAT ----------
(async function init() {
var urlParams = new URLSearchParams(window.location.search);
targetUserId = urlParams.get('id');

if (!targetUserId) {
showError('Kullanıcı belirtilmedi.');
return;
}

try {
var sessionRes = await supabaseClient.auth.getSession();
if (sessionRes.data.session) {
currentUser = sessionRes.data.session.user;
}
} catch (e) { console.error(e); }

var isOwnProfile = currentUser && currentUser.id === targetUserId;

var profileRes = await supabaseClient
.from('profiles')
.select('*')
.eq('id', targetUserId)
.single();

if (profileRes.error || !profileRes.data) {
showError('Kullanıcı bulunamadı.');
return;
}

var profile = profileRes.data;

if (profile.status !== 'approved' && !isOwnProfile) {
showError('Bu kullanıcının profili mevcut değil.');
return;
}

var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
document.getElementById('avatar').textContent = initial;
document.getElementById('fullName').textContent = profile.full_name || 'İsimsiz';
document.getElementById('username').textContent = '@' + (profile.username || 'kullanici');

var rank = profile.rank || 'filiz';
document.getElementById('rankContainer').innerHTML =
'<div class="rank-badge rank-' + rank + '">' +
'<span class="rank-icon">' + (RANK_ICONS[rank] || RANK_ICONS.filiz) + '</span>' +
(RANK_LABELS[rank] || 'Filiz') +
'</div>';

if (profile.bio && profile.bio.trim()) {
document.getElementById('bio').textContent = profile.bio;
} else {
document.getElementById('bioSection').style.display = 'none';
}

if (profile.created_at) {
var date = new Date(profile.created_at);
var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
document.getElementById('memberSince').textContent =
months[date.getMonth()] + ' ' + date.getFullYear() + "'den beri üye";
}

document.title = profile.full_name + ' • Katran Dergi';

await loadFollowCounts();

if (!isOwnProfile) {
await checkFollowStatus();
renderButtons();
} else {
document.getElementById('ownNote').style.display = 'block';
}

var stats = { read: 0, reading: 0, want: 0 };
var ubRes = await supabaseClient.from('user_books').select('status').eq('user_id', targetUserId);
(ubRes.data || []).forEach(function(r) {
if (r.status === 'read') stats.read++;
else if (r.status === 'reading') stats.reading++;
else stats.want++;
});
document.getElementById('statRead').textContent = stats.read;
document.getElementById('statReading').textContent = stats.reading;
document.getElementById('statWant').textContent = stats.want;

loadUserPosts(targetUserId);

// Follow stat tıklamaları
document.getElementById('followersStat').addEventListener('click', function() {
showUserList('Takipçiler', 'followers');
});
document.getElementById('followingStat').addEventListener('click', function() {
showUserList('Takip Edilenler', 'following');
});

document.getElementById('loadingState').style.display = 'none';
document.getElementById('profileContent').style.display = 'block';
})();

// ---------- TAKİP SAYILARI ----------
async function loadFollowCounts() {
var followersRes = await supabaseClient
.from('follows')
.select('id', { count: 'exact', head: true })
.eq('following_id', targetUserId);

var followingRes = await supabaseClient
.from('follows')
.select('id', { count: 'exact', head: true })
.eq('follower_id', targetUserId);

document.getElementById('statFollowers').textContent = followersRes.count || 0;
document.getElementById('statFollowing').textContent = followingRes.count || 0;
}

// ---------- TAKİP DURUMU ----------
async function checkFollowStatus() {
if (!currentUser) return;
var res = await supabaseClient
.from('follows')
.select('id')
.eq('follower_id', currentUser.id)
.eq('following_id', targetUserId)
.single();
isFollowing = !!res.data;
}

function renderButtons() {
var row = document.getElementById('btnRow');
if (!currentUser) {
row.innerHTML =
'<button class="action-btn not-following" onclick="window.location.href=\'giris.html\'">' + ICON_PLUS + ' Takip Et</button>';
return;
}
row.innerHTML =
'<button class="action-btn ' + (isFollowing ? 'following' : 'not-following') + '" id="followBtn">' +
(isFollowing ? ICON_CHECK + ' Takiptesin' : ICON_PLUS + ' Takip Et') +
'</button>' +
'<button class="action-btn message-btn" id="messageBtn">' + ICON_MAIL + ' Mesaj</button>';

document.getElementById('followBtn').addEventListener('click', toggleFollow);
document.getElementById('messageBtn').addEventListener('click', function() {
window.location.href = 'sohbet.html?id=' + targetUserId;
});
}

async function toggleFollow() {
if (!currentUser) {
toast('Takip etmek için giriş yapmalısın');
return;
}
var btn = document.getElementById('followBtn');
btn.disabled = true;

if (isFollowing) {
await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', targetUserId);
isFollowing = false;
toast('Takipten çıkıldı');
} else {
var res = await supabaseClient.from('follows').insert([{
follower_id: currentUser.id,
following_id: targetUserId
}]);
if (res.error) { toast('Hata: ' + res.error.message); btn.disabled = false; return; }
isFollowing = true;
toast('Takip ediliyor');
}
btn.disabled = false;
renderButtons();
await loadFollowCounts();
}

// ---------- KULLANICI LİSTESİ MODAL ----------
async function showUserList(title, type) {
document.getElementById('modalTitle').textContent = title;
document.getElementById('modalBody').innerHTML = '<div class="loading">Yükleniyor...</div>';
document.getElementById('userListModal').classList.add('open');

var userIds = [];

if (type === 'followers') {
var res = await supabaseClient.from('follows').select('follower_id').eq('following_id', targetUserId);
userIds = (res.data || []).map(function(r) { return r.follower_id; });
} else {
var res = await supabaseClient.from('follows').select('following_id').eq('follower_id', targetUserId);
userIds = (res.data || []).map(function(r) { return r.following_id; });
}

if (!userIds.length) {
document.getElementById('modalBody').innerHTML =
'<div class="empty" style="padding:2rem;text-align:center;color:#a89e94;font-size:0.9rem;">Henüz kimse yok.</div>';
return;
}

var profRes = await supabaseClient.from('profiles').select('id, full_name, username').in('id', userIds);
var profiles = profRes.data || [];

if (!profiles.length) {
document.getElementById('modalBody').innerHTML =
'<div class="empty" style="padding:2rem;text-align:center;color:#a89e94;font-size:0.9rem;">Kimse bulunamadı.</div>';
return;
}

var html = '';
profiles.forEach(function(p) {
var initial = (p.full_name || 'K').charAt(0).toUpperCase();
html += '<a class="user-item" href="kullanici.html?id=' + p.id + '">';
html += '<div class="user-item-avatar">' + initial + '</div>';
html += '<div class="user-item-info">';
html += '<div class="user-item-name">' + escapeHtml(p.full_name) + '</div>';
html += '<div class="user-item-username">@' + escapeHtml(p.username) + '</div>';
html += '</div>';
html += '</a>';
});
document.getElementById('modalBody').innerHTML = html;
}

document.getElementById('modalClose').addEventListener('click', function() {
document.getElementById('userListModal').classList.remove('open');
});
document.getElementById('userListModal').addEventListener('click', function(e) {
if (e.target === this) this.classList.remove('open');
});

// ---------- GÖNDERİLER ----------
async function loadUserPosts(userId) {
var res = await supabaseClient
.from('posts')
.select('*')
.eq('user_id', userId)
.order('created_at', { ascending: false })
.limit(20);

var container = document.getElementById('userPosts');

if (res.error) {
container.innerHTML = '<div style="color:#ff8a8a;font-size:0.85rem;">Yüklenemedi.</div>';
return;
}

var posts = res.data || [];
if (!posts.length) {
container.innerHTML = '<div style="color:#a89e94;font-size:0.9rem;">Henüz gönderi paylaşmamış.</div>';
return;
}

var html = '';
posts.forEach(function(p) {
html += '<div class="my-post">';
html += '<div class="my-post-time">' + timeAgo(p.created_at) + '</div>';
html += '<div class="my-post-content" onclick="window.location.href=\'akis.html?post=' + p.id + '\'">' + escapeHtml(p.content) + '</div>';
html += '<div class="my-post-stats">';
html += '<button onclick="showLikes(\'' + p.id + '\')">' + ICON_HEART + ' ' + (p.likes_count || 0) + '</button>';
html += '<span style="display:inline-flex;align-items:center;gap:0.3rem;">' + ICON_COMMENT + ' ' + (p.comments_count || 0) + '</span>';
html += '</div>';
html += '</div>';
});
container.innerHTML = html;
}
