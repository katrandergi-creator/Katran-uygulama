<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
padding: 1.5rem 1rem 100px;
transition: background 0.3s ease, color 0.3s ease;
}
.container { max-width: 700px; margin: 0 auto; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.5rem; }
.back-link {
color: var(--text-muted);
text-decoration: none;
font-size: 0.85rem;
padding: 0.4rem 0.85rem;
border: 1px solid var(--border);
border-radius: 60px;
display: inline-flex;
align-items: center;
gap: 0.35rem;
transition: all 0.2s;
background: var(--bg-elev);
}
.back-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back-link:hover { color: var(--bordo); border-color: var(--bordo); background: var(--bordo-glow); }

.profile-card {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 20px;
padding: 1.8rem 1.5rem;
text-align: center;
margin-bottom: 1rem;
}
.avatar-container { display: flex; justify-content: center; margin-bottom: 1rem; }
.full-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; margin-bottom: 0.15rem; color: var(--text); }
.username { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.8rem; }
.member-since { color: var(--text-dim); font-size: 0.78rem; font-style: italic; margin-top: 0.5rem; }

.rank-badge {
display: inline-flex;
align-items: center;
gap: 0.35rem;
padding: 0.35rem 0.85rem;
border-radius: 60px;
font-size: 0.7rem;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 0.08em;
}
.rank-filiz { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
.rank-karanfil { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
.rank-gergedan { background: rgba(224,49,49,0.15); color: #e03131; border: 1px solid rgba(224,49,49,0.3); }
.rank-katran { background: rgba(212,168,67,0.15); color: var(--gold); border: 1px solid rgba(212,168,67,0.3); }
.rank-icon { width: 14px; height: 14px; display: inline-flex; align-items: center; }
.rank-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 1.2rem; }
.action-btn {
padding: 0.65rem 1.4rem;
border-radius: 60px;
border: none;
font-weight: 700;
font-size: 0.85rem;
cursor: pointer;
font-family: inherit;
display: inline-flex;
align-items: center;
gap: 0.45rem;
transition: all 0.25s;
}
.action-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.action-btn.follow { background: var(--bordo); color: #fff; }
.action-btn.follow:hover { background: var(--bordo-dark); transform: translateY(-2px); }
.action-btn.following { background: transparent; color: var(--text-muted); border: 1px solid var(--border-strong); }
.action-btn.following:hover { color: var(--bordo); border-color: var(--bordo); }
.action-btn.message { background: transparent; color: var(--text-muted); border: 1px solid var(--border-strong); }
.action-btn.message:hover { color: var(--bordo); border-color: var(--bordo); }

.follow-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
.follow-stat {
background: var(--bg-elev);
border: 1px solid var(--border);
border-radius: 14px;
padding: 1rem 0.5rem;
text-align: center;
cursor: pointer;
transition: all 0.25s;
}
.follow-stat:hover { border-color: var(--bordo); transform: translateY(-2px); }
.follow-stat .number { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--bordo); display: block; line-height: 1; }
.follow-stat .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.3rem; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.2rem; }
.stat-box { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 0.4rem; text-align: center; }
.stat-box .number { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 900; color: var(--bordo); display: block; line-height: 1; }
.stat-box .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.3rem; }

.section { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 1.3rem; margin-bottom: 1rem; }
.section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.9rem; }
.section h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--text); }
.section p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }

.shelf-wrap { position: relative; padding-bottom: 6px; }
.shelf-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.8rem; padding: 0.3rem 0 0.7rem; }
.shelf-line { height: 5px; background: var(--bordo); border-radius: 2px; opacity: 0.4; margin-bottom: 0.3rem; }
.shelf-empty { color: var(--text-dim); font-size: 0.85rem; font-style: italic; text-align: center; padding: 0.8rem 0; }
.book-spine { text-decoration: none; color: inherit; transition: transform 0.25s; display: block; }
.book-spine:hover { transform: translateY(-4px); }
.book-spine .cover {
width: 100%;
aspect-ratio: 2/3;
border-radius: 3px 5px 5px 3px;
background: linear-gradient(135deg, var(--bordo), var(--bordo-dark));
display: flex;
align-items: center;
justify-content: center;
color: #fff;
font-family: 'Playfair Display', serif;
font-size: 1.4rem;
font-weight: 900;
box-shadow: 0 3px 10px -3px rgba(0,0,0,0.4);
overflow: hidden;
}
.book-spine .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-spine .title {
font-size: 0.7rem;
color: var(--text-muted);
margin-top: 0.35rem;
line-height: 1.3;
overflow: hidden;
text-overflow: ellipsis;
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
}

.my-post { background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.6rem; cursor: pointer; transition: all 0.2s; }
.my-post:last-child { margin-bottom: 0; }
.my-post:hover { border-color: var(--bordo); transform: translateX(4px); }
.my-post-time { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.35rem; }
.my-post-content { font-size: 0.88rem; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
.my-post-content.quote { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; }
.my-post-attr { font-size: 0.75rem; color: var(--text-muted); text-align: right; margin-top: 0.4rem; font-style: italic; }
.my-post-attr strong { color: var(--bordo); font-style: normal; }
.my-post-stats { display: flex; gap: 0.9rem; margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-muted); align-items: center; }
.my-post-stats svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.my-post-stats span { display: inline-flex; align-items: center; gap: 0.3rem; }

.loading { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--bordo); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }
.message-error { background: rgba(224,49,49,0.15); border: 1px solid rgba(224,49,49,0.4); color: #ff8a8a; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; text-align: center; font-size: 0.9rem; }
.own-note { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 1rem; font-style: italic; }
.own-note a { color: var(--bordo); text-decoration: none; font-weight: 700; }
.toast {
position: fixed;
bottom: 100px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: var(--bordo);
color: #fff;
padding: 0.8rem 1.5rem;
border-radius: 60px;
font-weight: 600;
font-size: 0.9rem;
transition: transform 0.3s;
z-index: 9999;
max-width: 90%;
text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 9998; display: none; align-items: center; justify-content: center; padding: 1rem; }
.modal-backdrop.open { display: flex; }
.modal { background: var(--bg); border: 1px solid var(--border); border-radius: 20px; max-width: 440px; width: 100%; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.modal-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text); }
.modal-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; transition: all 0.2s; }
.modal-close svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.modal-close:hover { color: var(--bordo); background: var(--bordo-glow); }
.modal-body { padding: 0.5rem 0; overflow-y: auto; flex: 1; }
.user-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 1.5rem; text-decoration: none; color: inherit; transition: background 0.15s; }
.user-item:hover { background: var(--bordo-glow); }
.user-item-info { flex: 1; min-width: 0; }
.user-item-name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
.user-item-username { color: var(--text-muted); font-size: 0.8rem; }

@media (max-width: 520px) {
.container { padding: 1rem 0.8rem; }
.profile-card { padding: 1.5rem 1rem; }
.full-name { font-size: 1.3rem; }
.section { padding: 1.1rem 1rem; }
}
</style>
</head>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var targetUserId = null;
var isFollowing = false;

var RANK_ICONS = {
filiz: '<svg viewBox="0 0 24 24"><path d="M7 20h10"/><path d="M12 20V10"/><path d="M12 10c0-4 4-8 8-8 0 4-4 8-8 8z"/><path d="M12 10c0-4-4-8-8-8 0 4 4 8 8 8z"/></svg>',
karanfil: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 22a10 10 0 0 1-10-10"/><path d="M2 12a10 10 0 0 1 10-10"/><path d="M22 12a10 10 0 0 1-10 10"/></svg>',
gergedan: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v4"/><path d="M9 7l3-4 3 4"/><circle cx="10" cy="12" r="0.5" fill="currentColor"/><circle cx="14" cy="12" r="0.5" fill="currentColor"/></svg>',
katran: '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
};

var ICON_HEART = '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
var ICON_COMMENT = '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
var ICON_PLUS = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
var ICON_CHECK = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
var ICON_MAIL = '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>';

var RANK_LABELS = { filiz: 'Filiz', karanfil: 'Karanfil', gergedan: 'Gergedan Böceği', katran: 'Katran Kurucusu' };

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(dateStr) {
var d = new Date(dateStr);
var s = Math.floor((new Date() - d) / 1000);
if (s < 60) return 'şimdi';
if (s < 3600) return Math.floor(s/60) + ' dk önce';
if (s < 86400) return Math.floor(s/3600) + ' sa önce';
if (s < 604800) return Math.floor(s/86400) + ' gün önce';
return d.toLocaleDateString('tr-TR');
}

function toast(msg) {
var t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function showError(msg) {
document.getElementById('loadingState').style.display = 'none';
document.getElementById('errorState').style.display = 'block';
document.getElementById('errorMsg').textContent = msg;
}

function getAvatar(profile, size) {
  if (window.renderAvatar) return window.renderAvatar(profile, size || 42);
  var initial = (profile.full_name || 'K').charAt(0).toUpperCase();
  return '<div style="width:' + (size || 42) + 'px;height:' + (size || 42) + 'px;border-radius:50%;background:linear-gradient(135deg, var(--bordo), var(--bordo-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:' + Math.round((size || 42) * 0.42) + 'px;">' + initial + '</div>';
}

(async function init() {
var urlParams = new URLSearchParams(window.location.search);
targetUserId = urlParams.get('id');
if (!targetUserId) { showError('Kullanıcı belirtilmedi.'); return; }

var sessionRes = await supabaseClient.auth.getSession();
if (sessionRes.data.session) currentUser = sessionRes.data.session.user;
var isOwn = currentUser && currentUser.id === targetUserId;

var profileRes = await supabaseClient.from('profiles').select('*').eq('id', targetUserId).single();
if (profileRes.error || !profileRes.data) { showError('Kullanıcı bulunamadı.'); return; }
var profile = profileRes.data;
if (profile.status !== 'approved' && !isOwn) { showError('Bu kullanıcının profili mevcut değil.'); return; }

// Avatar
var waitAvatar = setInterval(function() {
  if (window.renderAvatar) {
    clearInterval(waitAvatar);
    document.getElementById('avatarContainer').innerHTML = window.renderAvatar(profile, 80);
  }
}, 50);

document.getElementById('fullName').textContent = profile.full_name || 'İsimsiz';
document.getElementById('username').textContent = '@' + (profile.username || 'kullanici');

var rank = profile.rank || 'filiz';
document.getElementById('rankContainer').innerHTML = '<div class="rank-badge rank-' + rank + '"><span class="rank-icon">' + (RANK_ICONS[rank] || RANK_ICONS.filiz) + '</span>' + (RANK_LABELS[rank] || 'Filiz') + '</div>';

if (profile.bio && profile.bio.trim()) {
document.getElementById('bio').textContent = profile.bio;
document.getElementById('bioSection').style.display = 'block';
}

if (profile.created_at) {
var date = new Date(profile.created_at);
var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
document.getElementById('memberSince').textContent = months[date.getMonth()] + ' ' + date.getFullYear() + "'den beri üye";
}

document.title = profile.full_name + ' • Katran Dergi';

await loadFollowCounts();
await loadUserBooks();
loadUserPosts(targetUserId);

if (!isOwn) { await checkFollowStatus(); renderButtons(); }
else { document.getElementById('ownNote').style.display = 'block'; }

document.getElementById('followersStat').addEventListener('click', function() { showUserList('Takipçiler', 'followers'); });
document.getElementById('followingStat').addEventListener('click', function() { showUserList('Takip Edilenler', 'following'); });
document.getElementById('modalClose').addEventListener('click', function() { document.getElementById('userListModal').classList.remove('open'); });
document.getElementById('userListModal').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });

document.getElementById('loadingState').style.display = 'none';
document.getElementById('profileContent').style.display = 'block';
})();

async function loadFollowCounts() {
var followersRes = await supabaseClient.from('follows').select('id', { count: 'exact', head: true }).eq('following_id', targetUserId);
var followingRes = await supabaseClient.from('follows').select('id', { count: 'exact', head: true }).eq('follower_id', targetUserId);
document.getElementById('statFollowers').textContent = followersRes.count || 0;
document.getElementById('statFollowing').textContent = followingRes.count || 0;
}

async function checkFollowStatus() {
if (!currentUser) return;
var res = await supabaseClient.from('follows').select('id').eq('follower_id', currentUser.id).eq('following_id', targetUserId).maybeSingle();
isFollowing = !!res.data;
}

function renderButtons() {
var row = document.getElementById('btnRow');
if (!currentUser) {
row.innerHTML = '<button class="action-btn follow" onclick="window.location.href=\'giris.html\'">' + ICON_PLUS + ' Takip Et</button>';
return;
}
row.innerHTML = '<button class="action-btn ' + (isFollowing ? 'following' : 'follow') + '" id="followBtn">' + (isFollowing ? ICON_CHECK + ' Takiptesin' : ICON_PLUS + ' Takip Et') + '</button>' +
'<button class="action-btn message" id="messageBtn">' + ICON_MAIL + ' Mesaj</button>';
document.getElementById('followBtn').addEventListener('click', toggleFollow);
document.getElementById('messageBtn').addEventListener('click', function() { window.location.href = 'sohbet.html?id=' + targetUserId; });
}

async function toggleFollow() {
if (!currentUser) { toast('Takip etmek için giriş yap'); return; }
var btn = document.getElementById('followBtn');
btn.disabled = true;
if (isFollowing) {
await supabaseClient.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', targetUserId);
isFollowing = false;
toast('Takipten çıkıldı');
} else {
var res = await supabaseClient.from('follows').insert([{ follower_id: currentUser.id, following_id: targetUserId }]);
if (res.error) { toast('Hata'); btn.disabled = false; return; }
isFollowing = true;
toast('Takip ediliyor');
}
btn.disabled = false;
renderButtons();
await loadFollowCounts();
}

async function loadUserBooks() {
var res = await supabaseClient.from('user_books').select('status, books(id, title, author, cover_url)').eq('user_id', targetUserId);
if (res.error) return;
var stats = { read: 0, reading: 0, want: 0 };
var readBooks = [];
(res.data || []).forEach(function(r) {
if (!r.books) return;
if (r.status === 'read') { stats.read++; readBooks.push(r.books); }
else if (r.status === 'reading') { stats.reading++; }
else { stats.want++; }
});
document.getElementById('statRead').textContent = stats.read;
document.getElementById('statReading').textContent = stats.reading;
document.getElementById('statWant').textContent = stats.want;
renderShelf(readBooks);
}

function renderShelf(books) {
var el = document.getElementById('readShelf');
if (!books.length) { el.innerHTML = '<div class="shelf-empty">Henüz kitap okumamış.</div>'; return; }
var html = '';
books.forEach(function(b) {
var cover = b.cover_url
? '<img src="' + escapeHtml(b.cover_url) + '" alt="" onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + escapeHtml((b.title || '?').charAt(0).toUpperCase()) + '\';">'
: escapeHtml((b.title || '?').charAt(0).toUpperCase());
html += '<a class="book-spine" href="kitap.html?id=' + b.id + '" title="' + escapeHtml(b.title) + '">';
html += '<div class="cover">' + cover + '</div>';
html += '<div class="title">' + escapeHtml(b.title || 'İsimsiz') + '</div>';
html += '</a>';
});
el.innerHTML = html;
}

async function loadUserPosts(userId) {
var res = await supabaseClient.from('posts').select('*').eq('user_id', userId).order('created_at', { ascending: false }).limit(20);
var container = document.getElementById('userPosts');
if (res.error) { container.innerHTML = '<div style="color:#ff8a8a;font-size:0.85rem;">Yüklenemedi.</div>'; return; }
var posts = res.data || [];
if (!posts.length) { container.innerHTML = '<div style="color:var(--text-muted);font-size:0.9rem;">Henüz gönderi paylaşmamış.</div>'; return; }
var html = '';
posts.forEach(function(p) {
if (p.type === 'quote' || p.type === 'read' || p.type === 'analysis') {
html += '<div class="my-post" onclick="window.location.href=\'gonderi-detay.html?id=' + p.id + '\'">';
html += '<div class="my-post-time">' + timeAgo(p.created_at) + '</div>';
if (p.content) html += '<div class="my-post-content quote">&#8220;' + escapeHtml(p.content) + '&#8221;</div>';
html += '<div class="my-post-attr">— <strong>' + escapeHtml(p.quote_author || 'Bilinmeyen') + '</strong>';
if (p.quote_book) html += ', <em>' + escapeHtml(p.quote_book) + '</em>';
html += '</div>';
html += '<div class="my-post-stats">';
html += '<span>' + ICON_HEART + ' ' + (p.likes_count || 0) + '</span>';
html += '<span>' + ICON_COMMENT + ' ' + (p.comments_count || 0) + '</span>';
html += '</div></div>';
} else {
html += '<div class="my-post" onclick="window.location.href=\'gonderi-detay.html?id=' + p.id + '\'">';
html += '<div class="my-post-time">' + timeAgo(p.created_at) + '</div>';
html += '<div class="my-post-content">' + escapeHtml(p.content) + '</div>';
html += '<div class="my-post-stats">';
html += '<span>' + ICON_HEART + ' ' + (p.likes_count || 0) + '</span>';
html += '<span>' + ICON_COMMENT + ' ' + (p.comments_count || 0) + '</span>';
html += '</div></div>';
}
});
container.innerHTML = html;
}

async function showUserList(title, type) {
document.getElementById('modalTitle').textContent = title;
document.getElementById('modalBody').innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-muted);">Yükleniyor...</div>';
document.getElementById('userListModal').classList.add('open');
var userIds = [];
if (type === 'followers') {
var res = await supabaseClient.from('follows').select('follower_id').eq('following_id', targetUserId);
userIds = (res.data || []).map(function(r) { return r.follower_id; });
} else {
var res = await supabaseClient.from('follows').select('following_id').eq('follower_id', targetUserId);
userIds = (res.data || []).map(function(r) { return r.following_id; });
}
if (!userIds.length) { document.getElementById('modalBody').innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-muted);font-size:0.9rem;">Henüz kimse yok.</div>'; return; }
var profRes = await supabaseClient.from('profiles').select('id, full_name, username, avatar').in('id', userIds);
var profiles = profRes.data || [];
var html = '';
profiles.forEach(function(p) {
html += '<a class="user-item" href="kullanici.html?id=' + p.id + '">' + getAvatar(p, 40) + '<div class="user-item-info"><div class="user-item-name">' + escapeHtml(p.full_name) + '</div><div class="user-item-username">@' + escapeHtml(p.username) + '</div></div></a>';
});
document.getElementById('modalBody').innerHTML = html;
}
})();
</script>
