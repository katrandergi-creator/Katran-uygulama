<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sohbet • Katran Dergi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, sans-serif;
background: #0a0808;
color: #f4efe8;
min-height: 100vh;
display: flex;
flex-direction: column;
height: 100vh;
}
.top-nav {
background: rgba(10,8,8,0.95);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.06);
padding: 0.8rem 1rem;
display: flex;
align-items: center;
gap: 0.8rem;
flex-shrink: 0;
}
.back-link {
color: #a89e94;
text-decoration: none;
display: inline-flex;
align-items: center;
padding: 0.4rem;
border-radius: 50%;
}
.back-link svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back-link:hover { color: #e03131; }
.chat-user {
display: flex;
align-items: center;
gap: 0.7rem;
flex: 1;
text-decoration: none;
color: inherit;
}
.chat-avatar {
width: 38px;
height: 38px;
border-radius: 50%;
background: linear-gradient(135deg, #e03131, #b71c1c);
display: flex;
align-items: center;
justify-content: center;
font-weight: 900;
color: #f4efe8;
font-size: 0.9rem;
}
.chat-name { font-weight: 700; font-size: 0.95rem; }
.chat-username { color: #a89e94; font-size: 0.78rem; }
.messages {
flex: 1;
overflow-y: auto;
padding: 1rem;
display: flex;
flex-direction: column;
gap: 0.5rem;
max-width: 700px;
margin: 0 auto;
width: 100%;
}
.msg {
max-width: 75%;
padding: 0.7rem 1rem;
border-radius: 16px;
font-size: 0.92rem;
line-height: 1.5;
word-wrap: break-word;
white-space: pre-wrap;
}
.msg.sent {
align-self: flex-end;
background: #e03131;
color: #f4efe8;
border-bottom-right-radius: 4px;
}
.msg.received {
align-self: flex-start;
background: rgba(255,255,255,0.06);
color: #e8e0d6;
border-bottom-left-radius: 4px;
}
.msg-time {
font-size: 0.65rem;
opacity: 0.6;
margin-top: 0.2rem;
}
.msg.sent .msg-time { text-align: right; }
.composer {
padding: 0.8rem 1rem;
border-top: 1px solid rgba(255,255,255,0.06);
background: rgba(10,8,8,0.95);
display: flex;
gap: 0.5rem;
max-width: 700px;
margin: 0 auto;
width: 100%;
flex-shrink: 0;
}
.composer input {
flex: 1;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.1);
border-radius: 60px;
padding: 0.8rem 1.2rem;
color: #f4efe8;
font-family: inherit;
font-size: 0.92rem;
}
.composer input:focus { outline: none; border-color: #e03131; }
.composer button {
background: #e03131;
color: #f4efe8;
border: none;
border-radius: 60px;
padding: 0 1.3rem;
font-weight: 700;
cursor: pointer;
font-family: inherit;
display: flex;
align-items: center;
}
.composer button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.composer button:disabled { opacity: 0.5; }
.loading { text-align: center; padding: 3rem; color: #a89e94; }
@media (max-width: 640px) {
.msg { max-width: 85%; }
}
</style>
</head>
<body>

<div class="top-nav" id="topNav">
<div class="loading" style="padding:0;">Yükleniyor...</div>
</div>

<div class="messages" id="messages"></div>

<div class="composer" id="composer" style="display:none;">
<input type="text" id="msgInput" placeholder="Mesaj yaz..." maxlength="1000" autocomplete="off">
<button id="sendBtn">
<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function() {
'use strict';

var SUPABASE_URL = 'https://bdxvgtxregsonbvhvdav.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkeHZndHhyZWdzb25idmh2ZGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzM4ODcsImV4cCI6MjEwNTAwOTg4N30.7gQGqcvDzTKpQyjnRkmcCrwPny3m5pfUOy4BWk7O0CQ';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentUser = null;
var otherId = null;
var otherProfile = null;

function escapeHtml(str) {
if (!str) return '';
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatTime(dateStr) {
var d = new Date(dateStr);
return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

function formatDateLabel(dateStr) {
var d = new Date(dateStr);
var today = new Date();
var yesterday = new Date();
yesterday.setDate(yesterday.getDate() - 1);

if (d.toDateString() === today.toDateString()) return 'Bugün';
if (d.toDateString() === yesterday.toDateString()) return 'Dün';
var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

(async function init() {
var urlParams = new URLSearchParams(window.location.search);
otherId = urlParams.get('id');

if (!otherId) {
window.location.href = 'mesajlar.html';
return;
}

var sessionRes = await supabaseClient.auth.getSession();
if (!sessionRes.data.session) {
window.location.href = 'giris.html';
return;
}
currentUser = sessionRes.data.session.user;

if (otherId === currentUser.id) {
window.location.href = 'mesajlar.html';
return;
}

var profRes = await supabaseClient
.from('profiles')
.select('id, full_name, username, status')
.eq('id', otherId)
.single();

if (profRes.error || !profRes.data || profRes.data.status !== 'approved') {
document.getElementById('topNav').innerHTML =
'<a href="mesajlar.html" class="back-link">←</a><div class="loading" style="padding:0;">Kullanıcı bulunamadı.</div>';
return;
}

otherProfile = profRes.data;
renderHeader();

// Okunmamış mesajları okundu yap
await supabaseClient.from('messages').update({ is_read: true })
.eq('sender_id', otherId).eq('receiver_id', currentUser.id).eq('is_read', false);

await loadMessages();
document.getElementById('composer').style.display = 'flex';

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', function(e) {
if (e.key === 'Enter') sendMessage();
});

// Realtime - yeni mesajları otomatik al
supabaseClient.channel('messages-channel')
.on('postgres_changes', {
event: 'INSERT',
schema: 'public',
table: 'messages'
}, function(payload) {
var m = payload.new;
if ((m.sender_id === otherId && m.receiver_id === currentUser.id) ||
(m.sender_id === currentUser.id && m.receiver_id === otherId)) {
loadMessages();
if (m.sender_id === otherId) {
supabaseClient.from('messages').update({ is_read: true }).eq('id', m.id);
}
}
})
.subscribe();

})();

function renderHeader() {
var initial = (otherProfile.full_name || 'K').charAt(0).toUpperCase();
document.getElementById('topNav').innerHTML =
'<a href="mesajlar.html" class="back-link">' +
'<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>' +
'</a>' +
'<a href="kullanici.html?id=' + otherId + '" class="chat-user">' +
'<div class="chat-avatar">' + initial + '</div>' +
'<div>' +
'<div class="chat-name">' + escapeHtml(otherProfile.full_name) + '</div>' +
'<div class="chat-username">@' + escapeHtml(otherProfile.username) + '</div>' +
'</div>' +
'</a>';
}

async function loadMessages() {
var res = await supabaseClient
.from('messages')
.select('*')
.or('and(sender_id.eq.' + currentUser.id + ',receiver_id.eq.' + otherId + '),and(sender_id.eq.' + otherId + ',receiver_id.eq.' + currentUser.id + ')')
.order('created_at', { ascending: true })
.limit(200);

var container = document.getElementById('messages');
var msgs = res.data || [];

if (!msgs.length) {
container.innerHTML = '<div class="loading">Henüz mesaj yok. İlk mesajı sen yaz!</div>';
return;
}

var html = '';
var lastDate = '';
msgs.forEach(function(m) {
var dateLabel = formatDateLabel(m.created_at);
if (dateLabel !== lastDate) {
html += '<div style="text-align:center;font-size:0.75rem;color:#7a7068;margin:0.8rem 0;">' + dateLabel + '</div>';
lastDate = dateLabel;
}

var cls = m.sender_id === currentUser.id ? 'sent' : 'received';
html += '<div class="msg ' + cls + '">';
html += escapeHtml(m.content);
html += '<div class="msg-time">' + formatTime(m.created_at) + '</div>';
html += '</div>';
});
container.innerHTML = html;
container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
var input = document.getElementById('msgInput');
var content = input.value.trim();
if (!content) return;

var btn = document.getElementById('sendBtn');
btn.disabled = true;

var res = await supabaseClient.from('messages').insert([{
sender_id: currentUser.id,
receiver_id: otherId,
content: content
}]);

btn.disabled = false;
if (res.error) { alert('Hata: ' + res.error.message); return; }
input.value = '';
await loadMessages();
}
})();
</script>
</body>
</html>
